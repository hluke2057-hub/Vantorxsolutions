name: VantorX 24/7 Cloud Autopilot

on:
  schedule:
    # Runs every 30 minutes 24/7/365 on GitHub cloud runners
    # Operational window (8 AM - 8 PM ET): Dispatches batches of 15 verified leads up to 100/day quota
    # Off hours: Runs Supabase keep-alive heartbeats to prevent cloud dormancy
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  cloud-outreach-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Execute 24/7 Cloud Outbound Batch & Supabase Keep-Alive
        continue-on-error: true
        env:
          DEMO_PHONE: "(561) 813-8602"
          SENDER_EMAIL: "luke@vantorxsolutions.com"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node scripts/cloud_outbound_engine.js --batch=15

      - name: Commit Intelligence Metrics & History
        continue-on-error: true
        run: |
          git config --global user.name "VantorX Cloud Autopilot"
          git config --global user.email "autopilot@vantorxsolutions.com"
          git add data/ website/data/ || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(cloud-autopilot): 24/7 autonomous dispatch cycle completed [skip ci]" || true
            git pull --rebase origin main || true
            git push origin main || echo "::warning::git push skipped due to token permissions. Autopilot email delivery remains 100% active."
          fi

