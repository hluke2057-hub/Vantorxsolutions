        <div class="field"><label class="label">Cancellation</label><input class="input" id="polC" value="${esc((k.policies || {}).cancellation || '')}" /></div>
        <div class="field"><label class="label">Walk-ins</label><input class="input" id="polW" value="${esc((k.policies || {}).walkins || '')}" /></div>
        <div class="field"><label class="label">Payment</label><input class="input" id="polP" value="${esc((k.policies || {}).payment || '')}" /></div>
        <button class="btn primary" id="polSave" style="margin-top:10px">Save policies</button>
      </section>
    </div>`;

  const bid = store.business.id;
  const saveFaqs = async (faqs) => {
    try {
      await api.saveConfig(bid, { knowledge: { faqs } });
      toast('Saved to platform', 'success');
      await ctx.refreshAll(); refresh();
    } catch (e) { toast(e.message, 'error'); }
  };

  root.querySelector('#faqAdd').addEventListener('click', () => {
    const q = root.querySelector('#faqQ').value.trim();
    const a = root.querySelector('#faqA').value.trim();
    if (!q || !a) { toast('Question and answer required', 'error'); return; }
    saveFaqs([...(store.config.knowledge.faqs || []), { q, a }]);
  });
  root.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => {
    saveFaqs((store.config.knowledge.faqs || []).filter((f) => f.q !== b.dataset.del));
  }));
  root.querySelector('#polSave').addEventListener('click', async () => {
    try {
      await api.saveConfig(bid, { knowledge: { policies: {
        cancellation: root.querySelector('#polC').value.trim(),
        walkins: root.querySelector('#polW').value.trim(),
        payment: root.querySelector('#polP').value.trim(),
      } } });
      toast('Policies saved', 'success');
      await ctx.refreshAll(); refresh();
    } catch (e) { toast(e.message, 'error'); }
  });
}


/* ---- js/pages/settings.js ---- */
/* ============================================================
   VANTORX AI RECEPTIONIST — pages/settings.js
   Profile settings (persisted server-side), provider matrix,
   and activation gated by the server's fail-closed readiness.
   A 422 from activate shows the exact blockers; nothing is
   activated client-side.
   ============================================================ */

function renderSettings(root, ctx) {
  const { store, refresh } = ctx;
  const cfg = store.config;
  if (!cfg) { root.innerHTML = '<div class="dim">Config not loaded.</div>'; return; }
  const p = cfg.profile;
  const rdy = store.readiness || { checks: [], ready: false, blockers: [] };

  root.innerHTML = `
    <div class="grid-2">
      <section class="card">
        <h3>Receptionist profile</h3>
        <div class="field"><label class="label">Greeting ({business} is replaced automatically)</label><input class="input" id="greeting" value="${esc(p.greeting || '')}" placeholder="Thank you for calling {business}…" /></div>
        <div class="field"><label class="label">Personality</label>
          <select class="input" id="personality">
            ${['warm-professional', 'crisp-efficient', 'friendly-casual'].map((x) => `<option ${p.personality === x ? 'selected' : ''}>${x}</option>`).join('')}
          </select></div>
        <div class="field"><label class="label">Transfer number (human fallback)</label><input class="input" id="transfer" value="${esc(p.transferNumber || '')}" placeholder="+1 …" /></div>
        <div class="field"><label class="label">After hours</label>
          <select class="input" id="afterHours">
            ${['message', 'voicemail', 'transfer'].map((x) => `<option ${p.afterHours === x ? 'selected' : ''}>${x}</option>`).join('')}
          </select></div>
        <div class="row gap wrap" style="margin-top:6px">
          <label class="row gap" style="align-items:center"><input type="checkbox" id="allowBooking" ${p.allowBooking ? 'checked' : ''}/> Allow booking</label>
          <label class="row gap" style="align-items:center"><input type="checkbox" id="allowTransfer" ${p.allowTransfer ? 'checked' : ''}/> Allow transfer</label>
          <label class="row gap" style="align-items:center"><input type="checkbox" id="allowMessages" ${p.allowMessages ? 'checked' : ''}/> Take messages</label>
        </div>
        <button class="btn primary" id="saveProfile" style="margin-top:12px">Save profile</button>
      </section>

      <section class="card">
        <h3>Activation</h3>
        <p class="dim small">The server decides. Activation fails closed (HTTP 422) while any required check below is unmet.</p>
        <div class="list">
          ${rdy.checks.map((c) => `
            <div class="list-row">
              <div>${esc(c.label)}${c.required ? ' <span class="dim small">(required)</span>' : ''}</div>
              <span class="status-pill ${c.pass ? 'status-green' : 'status-dim'}"><span class="sdot"></span>${c.pass ? 'pass' : c.required ? 'BLOCKER' : 'todo'}</span>
            </div>`).join('')}
        </div>
        <div class="row gap" style="margin-top:12px">
          ${cfg.active
            ? `<button class="btn danger" id="deact">■ Deactivate receptionist</button>`
            : `<button class="btn gold" id="act">▲ Activate receptionist</button>`}
        </div>
        <div id="blockerMsg" class="dim small" style="margin-top:8px">${rdy.ready ? '' : `Blockers: ${esc(rdy.blockers.join(', '))}`}</div>
      </section>
    </div>

    <section class="card" style="margin-top:18px">
      <h3>Provider matrix <span class="dim small">— honest integration status</span></h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Capability</th><th>Provider</th><th>Status</th><th>What's needed</th></tr></thead>
        <tbody>
          ${(store.providers || []).map((x) => `
            <tr>
              <td><b>${esc(x.capability)}</b></td>
              <td class="dim">${esc(x.provider || '—')}</td>
              <td>${x.status === 'connected' ? '<span class="status-pill status-green"><span class="sdot"></span>connected</span>' : x.status === 'first-party' ? '<span class="status-pill status-gold"><span class="sdot"></span>first-party</span>' : '<span class="status-pill status-dim"><span class="sdot"></span>NOT CONNECTED</span>'}</td>
              <td class="dim small">${esc(x.note || '')}</td>
            </tr>`).join('')}
        </tbody></table></div>
      <p class="dim small" style="margin-top:8px">Until telephony + LLM + STT + TTS are connected to real providers, voice answering is unavailable — the test console remains the way to exercise the full conversation/booking logic against the real calendar.</p>
    </section>`;

  root.querySelector('#saveProfile').addEventListener('click', async () => {
    try {
      await api.saveConfig(store.business.id, { profile: {
        greeting: root.querySelector('#greeting').value.trim(),
        personality: root.querySelector('#personality').value,
        transferNumber: root.querySelector('#transfer').value.trim(),
        afterHours: root.querySelector('#afterHours').value,
        allowBooking: root.querySelector('#allowBooking').checked,
        allowTransfer: root.querySelector('#allowTransfer').checked,
        allowMessages: root.querySelector('#allowMessages').checked,
      } });
      toast('Profile saved to platform', 'success');
      await ctx.refreshAll(); refresh();
    } catch (e) { toast(e.message, 'error'); }
  });

  const actBtn = root.querySelector('#act');
  if (actBtn) actBtn.addEventListener('click', async () => {
    try {
      await api.activate(store.business.id);
      toast('Receptionist ACTIVATED (server-verified readiness)', 'success');
      await ctx.refreshAll(); refresh();
    } catch (e) {
      if (e.status === 422 && e.data && e.data.blockers) {
        toast(`Blocked by server: ${e.data.blockers.join(', ')}`, 'error');
        const box = root.querySelector('#blockerMsg');
        if (box) box.textContent = `Blockers: ${e.data.blockers.join(', ')}`;
      } else { toast(e.message, 'error'); }
    }
  });
  const deactBtn = root.querySelector('#deact');
  if (deactBtn) deactBtn.addEventListener('click', async () => {
    const ok = await confirmDialog({ title: 'Deactivate receptionist?', message: 'Real callers will no longer be answered; the test console stays available.', confirmText: 'Deactivate', danger: true });
    if (!ok) return;
    try {
      await api.deactivate(store.business.id);
      toast('Receptionist deactivated', 'success');
      await ctx.refreshAll(); refresh();
    } catch (e) { toast(e.message, 'error'); }
  });
}


/* ---- js/app.js ---- */
/* ============================================================
   VANTORX AI RECEPTIONIST — app.js
   Shell + router. Auth-gated: redirects to the portal when not
   signed in. Routes: dashboard/test/calls/appointments/
   knowledge/settings
   ============================================================ */

const PAGES = {
  dashboard: { title: 'Dashboard', icon: '◎', render: renderDashboard },
  test: { title: 'Test Console', icon: '▶', render: renderTest },
  calls: { title: 'Calls', icon: '☏', render: renderCalls },
  appointments: { title: 'Appointments', icon: '🗓', render: renderAppointments },
  knowledge: { title: 'Knowledge', icon: '📖', render: renderKnowledge },
  settings: { title: 'Settings', icon: '⚙', render: renderSettings },
};

function providerChip() {
  const s = store;
  if (!s.config) return '';
  const t = s.config.channels.telephony.status;
  const ok = t === 'connected';
  return `
    <div class="live-pill ${ok ? 'on' : 'off'}" title="${esc(s.config.channels.telephony.note || '')}">
      <span class="pulse"></span>${ok ? 'TELEPHONY LIVE' : 'NOT CONNECTED — SETUP REQUIRED'}
    </div>`;
}

function nav() {
  const unread = store.notifications.filter((n) => !n.read).length;
  return `
    <aside class="sidebar">
      <div class="sidebar-brand">
        <a href="/" title="Back to VantorX portal" style="text-decoration:none;color:inherit;display:flex;gap:10px;align-items:center">
        <span class="brand-mark">V</span>
        <span class="brand-name">VantorX <span class="gold">Voice</span></span>
        </a>
      </div>
      <nav class="nav-list">
        ${Object.entries(PAGES).map(([k, p]) => `
          <a class="nav-link${(location.hash || '#/dashboard') === `#/${k}` ? ' active' : ''}" href="#/${k}">
            <span class="nav-ico">${p.icon}</span>${p.title}
          </a>`).join('')}
      </nav>
      <div class="sidebar-foot">
        ${providerChip()}
        <select class="input small" id="bizSwitch" style="margin-top:8px">
          ${store.businesses.map((b) => `<option value="${b.id}" ${store.business && store.business.id === b.id ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}
        </select>
        <div class="dim small" style="margin-top:6px">${esc(store.user ? store.user.email : '')} · <a href="#" id="lnkLogout" class="dim">sign out</a></div>
      </div>
    </aside>`;
}

function shell() {
  document.getElementById('app').innerHTML = `
    ${nav()}
    <div class="main">
      <header class="topbar">
        <div class="topbar-title" id="pageTitle">Dashboard</div>
        <div class="topbar-actions">
          <span class="dim small" id="bizLabel">${esc(store.business ? store.business.name : '')}</span>
        </div>
      </header>
      <div class="content" id="pageRoot"></div>
    </div>
    <div id="modalHost"></div>`;
  document.getElementById('bizSwitch').addEventListener('change', async (e) => { await switchBusiness(e.target.value); renderRoute(); });
  document.getElementById('lnkLogout').addEventListener('click', async (e) => {
    e.preventDefault();
    await logout().catch(() => {});
    store.user = null;
    renderAuth();
  });
}

function renderAuth() {
  document.getElementById('app').innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0d14;padding:20px;">
      <div style="width:min(440px,100%);background:#101522;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:28px;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
          <span style="font-weight:900;font-size:20px;color:#d4af37;background:rgba(212,175,55,0.15);padding:6px 12px;border-radius:8px;">V</span>
          <div>
            <div style="font-weight:700;font-size:16px;color:#f8fafc;">VantorX Voice</div>
            <div style="font-size:12px;color:#94a3b8;">AI Receptionist Management Console</div>
          </div>
        </div>
        <p style="font-size:13px;color:#94a3b8;margin-bottom:16px;">Sign in with your client credentials to manage Ava's live prompt, emergency routing, and audio test console.</p>
        
        <div style="margin-bottom:12px;">
          <label style="display:block;font-size:12px;color:#cbd5e1;margin-bottom:4px;font-weight:600;">Email Address</label>
          <input type="email" id="rxEmail" class="input" style="width:100%;padding:10px 12px;background:#0b0e17;border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;" placeholder="owner@business.com" />
        </div>
        <div style="margin-bottom:16px;">
          <label style="display:block;font-size:12px;color:#cbd5e1;margin-bottom:4px;font-weight:600;">Password</label>
          <input type="password" id="rxPass" class="input" style="width:100%;padding:10px 12px;background:#0b0e17;border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;" placeholder="••••••••" />
        </div>
        <div id="rxErr" style="color:#f87171;font-size:12px;margin-bottom:12px;"></div>

        <div style="display:flex;gap:10px;margin-bottom:16px;">
          <button class="btn btn-gold" id="rxLoginBtn" style="flex:1;">Sign In →</button>
          <button class="btn btn-ghost" id="rxDemoBtn" style="flex:1;">⚡ Demo Console</button>
        </div>

        <div style="text-align:center;font-size:12px;color:#64748b;border-top:1px solid rgba(255,255,255,0.06);padding-top:14px;">
          <a href="/client-hub/" style="color:#d4af37;text-decoration:none;">Open Client Hub</a> · <a href="/" style="color:#94a3b8;text-decoration:none;">VantorX Portal Home</a>
        </div>
      </div>
    </div>
  `;

  document.getElementById('rxLoginBtn').addEventListener('click', async () => {
    const email = document.getElementById('rxEmail').value.trim();
    const pass = document.getElementById('rxPass').value;
    const errBox = document.getElementById('rxErr');
    errBox.textContent = '';
    if (!email || !pass) { errBox.textContent = 'Enter email and password.'; return; }
    try {
      await api.login(email, pass);
      await boot();
      if (store.user) {
        shell();
        renderRoute();
      } else {
        errBox.textContent = 'Could not load business profile.';
      }
    } catch (e) {
      errBox.textContent = e.message || 'Login failed.';
    }
  });

  document.getElementById('rxDemoBtn').addEventListener('click', () => {
    store.user = { email: 'demo@vantorxsolutions.com', name: 'Demo Contractor' };
    store.business = { id: 'demo_contractor', name: 'Apex Plumbing & HVAC' };
    store.businesses = [store.business];
    store.config = {
      agent_name: 'Ava',
      greeting: 'Thank you for calling Apex Plumbing & HVAC, this is Ava. Are you calling for emergency service or to schedule a standard appointment?',
      channels: { telephony: { status: 'connected', note: 'Live Twilio & Retell AI voice trunking active' } },
      knowledge: { faqs: [{ q: 'What are your hours?', a: 'Monday through Saturday, 7 AM to 7 PM. 24/7 emergency dispatch available.' }] },
    };
    store.calls = [
      { id: 'c1', from: '+15615550192', at: new Date(Date.now() - 3600000).toISOString(), outcome: 'Appointment Booked', summary: 'Customer requested water heater replacement quote. Scheduled for tomorrow 9 AM.' },
      { id: 'c2', from: '+15615550144', at: new Date(Date.now() - 86400000).toISOString(), outcome: 'Transferred', summary: 'Emergency burst pipe in crawl space. Live transferred to owner on-call cell.' }
    ];
    store.appointments = [
      { id: 'a1', customer: 'David Miller', phone: '(561) 555-0192', service: 'Water Heater Replacement', at: new Date(Date.now() + 86400000).toISOString(), status: 'Confirmed' }
    ];
    store.loaded = true;
    shell();
    renderRoute();
    toast('Welcome to Ava Voice Demo Console', 'success');
  });
}

let booted = false;
async function start() {
  if (booted) return;
  booted = true;
  await boot();
  if (!store.user) { renderAuth(); return; }
  shell();
  subscribe(() => {
    const chipHost = document.querySelector('.sidebar-foot');
    if (!chipHost) return;
    const active = location.hash || '#/dashboard';
    document.querySelectorAll('.nav-link').forEach((a) => a.classList.toggle('active', a.getAttribute('href') === active));
  });
  window.addEventListener('hashchange', renderRoute);
  if (!location.hash) location.hash = '#/dashboard';
  renderRoute();
}


function renderRoute() {
  if (!store.user) return;
  const key = (location.hash.replace('#/', '') || 'dashboard').split('?')[0];
  const page = PAGES[key] || PAGES.dashboard;
  document.getElementById('pageTitle').textContent = page.title;
  const root = document.getElementById('pageRoot');
  if (!store.loaded) { root.innerHTML = '<div class="dim">Loading…</div>'; return; }
  page.render(root, { store, refresh: renderRoute, toast, emit, refreshAll });
}

start();


</script>
