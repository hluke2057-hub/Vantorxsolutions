<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overview · VantorX Markets Intelligence</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <a href="/" title="Back to VantorX portal" style="text-decoration:none;color:inherit;display:flex;gap:10px;align-items:center">
      <span class="brand-mark">V</span>
      <div>
        <div class="brand-name">VantorX <span class="gold">Markets</span></div>
        <div class="brand-sub" id="syncStatus">Not synced — connect in Settings</div>
      </div>
      </a>
    </div>

    <nav class="nav">
      <div class="nav-section">Markets</div>
      <div class="nav-item" data-page="overview" id="tour-target-overview"><span class="nav-ico">📊</span> Overview</div>
      <div class="nav-item" data-page="markets"><span class="nav-ico">🎯</span> Market Board</div>
      <div class="nav-section">Intelligence</div>
      <div class="nav-item" data-page="signals" id="tour-target-signals"><span class="nav-ico">🤖</span> AI Signals</div>
      <div class="nav-section">Account</div>
      <div class="nav-item" data-page="portfolio"><span class="nav-ico">💼</span> Portfolio</div>
      <div class="nav-item" data-page="settings" id="tour-target-settings"><span class="nav-ico">⚙️</span> Settings</div>
    </nav>

    <div class="sidebar-foot">
      <div class="demo-chip" id="modeChip">Not connected — no market data</div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ===== MAIN ===== -->
  <div class="main">

    <header class="topbar">
      <button class="burger" id="burger" aria-label="Menu">☰</button>
      <div class="topbar-title" id="pageTitle">Overview</div>
      <div class="topbar-spacer"></div>
      <div class="global-search">
        <input id="globalSearch" placeholder="Search markets…  (press /)" autocomplete="off">
        <div class="search-results" id="searchResults" style="display:none"></div>
      </div>
      <button class="icon-btn" id="notifBtn" aria-label="Notifications">🔔<span class="dot-badge" id="notifDot"></span></button>
      <button class="avatar-btn" id="avatarBtn"><span id="avatarInitials">G</span></button>
    </header>

    <main class="view" id="view"></main>

  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
