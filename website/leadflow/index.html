/* ============================================================
   VANTORX LEADFLOW — utils.js

const STATUSES = ['New', 'Contacted', 'Responded', 'Booked', 'Lost'];
const STATUS_COLORS = {
  New: '#60a5fa', Contacted: '#fbbf24', Responded: '#a78bfa',
  Booked: '#4ade80', Lost: '#f87171'

const SOURCES = ['Phone', 'Website', 'Instagram', 'Facebook', 'TikTok', 'Google', 'Walk-in', 'Referral', 'Manual', 'Other'];

/* ---------- ids ---------- */
let _idCounter = Date.now();
function uid(prefix = 'id') {
  return `${prefix}_${(_idCounter++).toString(36)}${Math.random().toString(36).slice(2, 7)}`;
}

/* ---------- dates ---------- */
function nowISO() { return new Date().toISOString(); }

function daysAgoISO(days, hour = 10) {
  const d = new Date();
  d.setDate(d.getDate() - days);
  d.setHours(hour, Math.floor(Math.random() * 60), 0, 0);
  return d.toISOString();
}

function daysFromNowISO(days, hour = 10, minute = 0) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  d.setHours(hour, minute, 0, 0);
  return d.toISOString();
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function fmtDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' +
    d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function fmtTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

/* Relative label like "2h ago" / "in 3d" */
function relTime(iso) {
  if (!iso) return '—';
  const diff = new Date(iso) - Date.now();
  const abs = Math.abs(diff);
  const mins = Math.round(abs / 60000);
  const hours = Math.round(abs / 3600000);
  const days = Math.round(abs / 86400000);
  let label;
  if (mins < 1) return 'just now';
  if (mins < 60) label = `${mins}m`;
  else if (hours < 24) label = `${hours}h`;
  else label = `${days}d`;
  return diff < 0 ? `${label} ago` : `in ${label}`;
}

function isToday(iso) {
  if (!iso) return false;
  const d = new Date(iso), n = new Date();
  return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
}

function isOverdue(iso) {
  return iso && new Date(iso) < new Date();
}

function isWithinDays(iso, days) {
  if (!iso) return false;
  return (Date.now() - new Date(iso)) / 86400000 <= days;
}

/* ---------- numbers / money ---------- */
function fmtMoney(n) {
  if (n == null || isNaN(n)) return '—';
  return '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
}

function fmtPct(n, digits = 0) {
  return (n * 100).toFixed(digits) + '%';
}

function fmtNum(n) {
  return Number(n || 0).toLocaleString('en-US');
}

/* ---------- lead score (transparent local heuristic) ---------- */
function computeScore(lead, activities = []) {
  let s = 30;
  if (lead.phone) s += 8;
  if (lead.email) s += 8;
  if (lead.estimatedValue > 500) s += 8;
  if (lead.estimatedValue > 2000) s += 6;
  if (lead.status === 'Responded') s += 20;
  if (lead.status === 'Booked') s += 30;
  if (lead.status === 'Lost') s -= 25;
  const replies = activities.filter(a => a.type === 'reply').length;
  s += replies * 10;
  const sent = activities.filter(a => a.type && a.type.includes('sent')).length;
  s += Math.min(sent, 3) * 3;
  if (isWithinDays(lead.createdAt, 7)) s += 6;
  return Math.max(0, Math.min(100, s));
}

function scoreClass(score) {
  if (score >= 70) return 'score-high';
  if (score >= 45) return 'score-mid';
  return 'score-low';
}

/* ---------- template variables ---------- */
function renderTemplate(body, lead, extra = {}) {
  if (!body) return '';
  const business = extra.businessName || 'Your Business';
  const map = {
    first_name: lead?.firstName || 'there',
    last_name: lead?.lastName || '',
    business_name: business,
    service: lead?.serviceInterest || 'your service',
    appointment_time: extra.appointmentTime || 'your upcoming appointment',
    owner_name: extra.ownerName || 'The Team'
  };
  return body.replace(/\{\{(\w+)\}\}/g, (_, key) => map[key] != null ? map[key] : `{{${key}}}`);
}

/* ---------- csv ---------- */
function toCSV(rows, columns) {
  const esc = (v) => {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const header = columns.map(c => c.label).join(',');
  const lines = rows.map(r => columns.map(c => esc(r[c.key])).join(','));
  return [header, ...lines].join('\n');
}

function downloadFile(filename, content, type = 'text/csv') {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (ch === '"') inQ = false;
      else field += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      if (row.some(f => f.trim() !== '')) rows.push(row);
      row = [];
    } else field += ch;
  }
  if (field !== '' || row.length) { row.push(field); if (row.some(f => f.trim() !== '')) rows.push(row); }
  return rows;
}

/* ---------- misc ---------- */
function escapeHTML(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function initials(first = '', last = '') {
  return ((first[0] || '') + (last[0] || '')).toUpperCase() || '?';
}

function debounce(fn, ms = 250) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function countUp(el, target, opts = {}) {
  const dur = opts.duration || 700;
  const start = performance.now();
  const from = 0;
  const suffix = opts.suffix || '';
  const isMoney = opts.money;
  const isPct = opts.pct;
  const fmt = (val) => {
    if (isMoney) return '$' + Math.round(val).toLocaleString('en-US');
    if (isPct) return Math.round(val * 100) + suffix;
    return Math.round(val).toLocaleString('en-US') + suffix;
  };
  let animated = false;
  function frame(t) {
    animated = true;
    const p = Math.min((t - start) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    const val = from + (target - from) * eased;
    el.textContent = fmt(val);
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  /* rAF is throttled or paused in hidden/background tabs — snap to the real
     value so the number is never stuck at zero (falls back within ~1.2s). */
  setTimeout(() => { el.textContent = fmt(target); }, Math.max(dur + 500, 1200));
}

function statusBadge(status) {
  const cls = { New: 'badge-new', Contacted: 'badge-contacted', Responded: 'badge-responded', Booked: 'badge-booked', Lost: 'badge-lost' }[status] || 'badge-archived';
  return `<span class="badge ${cls}">${escapeHTML(status)}</span>`;
}

function daysLabel(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const diff = Math.round((Date.now() - d) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 0) return `In ${Math.abs(diff)}d`;
  if (diff < 7) return `${diff}d ago`;
  return fmtDate(iso);
}

/* ---------- CSV import helper (pure parsing — creates real leads) ---------- */
const FIELD_ALIASES = {
  firstName: ['firstname', 'first', 'given', 'givenname', 'name'],
  lastName: ['lastname', 'last', 'surname', 'family', 'familyname'],
  phone: ['phone', 'mobile', 'cell', 'tel', 'telephone'],
  email: ['email', 'e-mail', 'mail'],
  company: ['company', 'business', 'organisation', 'organization'],
  source: ['source', 'origin', 'channel'],
  serviceInterest: ['service', 'serviceinterest', 'interest'],
  estimatedValue: ['value', 'estimate', 'estimatedvalue'],
  status: ['status', 'stage']
};

function normalizeHeader(h) {
  return String(h || '').toLowerCase().replace(/[^a-z]/g, '');
}

const leadImportService = {
  import(rows, mapping, defaults = {}) {
    const leads = [];
    const errors = [];
    rows.forEach((row, i) => {
      const rec = {};
      mapping.forEach((field, col) => {
        if (!field) return;
        rec[field] = String(row[col] ?? '').trim();
      });
      /* if no mapping was chosen, try to guess from headers */
      if (!Object.keys(rec).length) {
        (rows.__headers || []).forEach((h, col) => {
          const n = normalizeHeader(h);
          for (const [field, aliases] of Object.entries(FIELD_ALIASES)) {
            if (aliases.includes(n)) rec[field] = String(row[col] ?? '').trim();
          }
        });
      }
      const name = [rec.firstName, rec.lastName].filter(Boolean).join(' ');
      if (!name) { errors.push(`Row ${i + 2}: missing name`); return; }
      if (rec.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(rec.email)) { errors.push(`Row ${i + 2}: invalid email`); return; }
      leads.push({
        firstName: rec.firstName || name.split(/\s+/)[0] || '',
        lastName: rec.lastName || name.split(/\s+/).slice(1).join(' ') || '',
        phone: rec.phone || '',
        email: rec.email || '',
        company: rec.company || '',
        source: rec.source || defaults.source || 'Manual',
        serviceInterest: rec.serviceInterest || '',
        estimatedValue: rec.estimatedValue ? Number(String(rec.estimatedValue).replace(/[^0-9.]/g, '')) || null : null,
        status: rec.status || defaults.status || 'New'
      });
    });
    return { leads, errors };
  }
};

/* ============================================================
   MODAL
   Opens a modal. opts: { title, body (html string), wide,
   footer (html string), onOpen(modalEl), onClose() }
   Escape closes. Returns close function.
   ============================================================ */
function openModal(opts) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal ${opts.wide ? 'modal-wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(opts.title || 'Dialog')}">
      <div class="modal-head">
        <div class="modal-title">${esc(opts.title || '')}</div>
        <button class="modal-close" aria-label="Close dialog" data-close>×</button>
      </div>
      <div class="modal-body">${opts.body || ''}</div>
      ${opts.footer ? `<div class="modal-foot">${opts.footer}</div>` : ''}
    </div>`;
  document.body.appendChild(overlay);

  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    overlay.remove();
    document.removeEventListener('keydown', onKey);
    opts.onClose && opts.onClose();
  };
  const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  document.addEventListener('keydown', onKey);
  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });
  overlay.querySelector('[data-close]').addEventListener('click', close);
  /* onOpen is deferred one tick so callers can reference their own `close`
     variable (assigned from this function's return value) inside the callback. */
  if (opts.onOpen) setTimeout(() => opts.onOpen(overlay), 0);
  return close;
}

/* ============================================================
   CONFIRM DIALOG
   Returns Promise<boolean>.
   ============================================================ */
function confirmDialog({ title = 'Are you sure?', message = '', confirmText = 'Confirm', danger = false }) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.style.zIndex = 210;
    overlay.innerHTML = `
      <div class="modal confirm-box" role="alertdialog" aria-modal="true">
        <div class="modal-body">
          <div class="confirm-title">${esc(title)}</div>
          <div class="confirm-msg">${esc(message)}</div>
          <div style="display:flex;justify-content:flex-end;gap:10px">
            <button class="btn btn-ghost" data-cancel>Cancel</button>
            <button class="btn ${danger ? 'btn-danger' : 'btn-gold'}" data-ok>${esc(confirmText)}</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const done = (v) => { overlay.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } if (e.key === 'Enter') { e.stopPropagation(); done(true); } };
    document.addEventListener('keydown', onKey);
    overlay.querySelector('[data-cancel]').addEventListener('click', () => done(false));
    overlay.querySelector('[data-ok]').addEventListener('click', () => done(true));
    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) done(false); });
    overlay.querySelector('[data-ok]').focus();
  });
}

/** Line/area chart. series: {color, points:[{x:Date, y:number}], fill?} */
function lineChart(series, { width = 600, height = 220, labels = [] } = {}) {
  const all = series.flatMap(s => s.points);
  if (!all.length) return '<div style="color:var(--text-dim);padding:30px;text-align:center">No data yet</div>';
  const xs = all.map(p => p.x instanceof Date ? p.x.getTime() : p.x);
  const ys = all.map(p => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const maxY = Math.max(...ys, 1);
  const padL = 34, padR = 12, padT = 14, padB = 26;
  const X = v => padL + ((v - minX) / Math.max(1, maxX - minX)) * (width - padL - padR);
  const Y = v => padT + (1 - v / maxY) * (height - padT - padB);
  const yTicks = 4;
  let gridLines = '';
  for (let i = 0; i <= yTicks; i++) {
    const yv = Math.round(maxY * i / yTicks);
    const y = Y(yv);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="${padL - 6}" y="${y + 3}" fill="rgba(255,255,255,0.35)" font-size="9" text-anchor="end">${yv}</text>`;
  }
  let paths = '';
  series.forEach((s, si) => {
    const pts = [...s.points].sort((a, b) => (a.x instanceof Date ? a.x.getTime() : a.x) - (b.x instanceof Date ? b.x.getTime() : b.x));
    if (!pts.length) return;
    const coords = pts.map(p => `${X(p.x instanceof Date ? p.x.getTime() : p.x)},${Y(p.y)}`);
    const line = `<polyline points="${coords.join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    let area = '';
    if (s.fill) {
      area = `<polygon points="${padL},${Y(0)} ${coords.join(' ')} ${X(maxX)},${Y(0)}" fill="${s.color}" opacity="0.08"/>`;
    }
    const dots = pts.map((p, i) =>
      `<circle cx="${X(p.x instanceof Date ? p.x.getTime() : p.x)}" cy="${Y(p.y)}" r="2.6" fill="${s.color}"><title>${labels[i] || ''}: ${p.y}</title></circle>`
    ).join('');
    paths += area + line + dots;
  });
  let xLabels = '';
  if (labels.length) {
    const step = Math.ceil(labels.length / 7);
    labels.forEach((lb, i) => {
      if (i % step !== 0) return;
      xLabels += `<text x="${X(i * (1000 * 60 * 60 * 24))}" y="${height - 8}" fill="rgba(255,255,255,0.35)" font-size="9" text-anchor="middle">${esc(lb)}</text>`;
    });
  }
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;display:block" role="img" aria-label="Line chart">
    ${gridLines}${paths}${xLabels}</svg>`;
}

/** Donut chart. data: [{label, value, color}] */
function donutChart(data, { size = 170, thickness = 22 } = {}) {
  const total = data.reduce((s, d) => s + d.value, 0);
  if (!total) return '<div style="color:var(--text-dim);padding:30px;text-align:center">No data yet</div>';
  const r = (size - thickness) / 2;
  const cx = size / 2, cy = size / 2;
  const circ = 2 * Math.PI * r;
  let offset = 0;
  const segs = data.filter(d => d.value > 0).map(d => {
    const frac = d.value / total;
    const len = frac * circ;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${thickness}"
      stroke-dasharray="${len} ${circ - len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})">
      <title>${esc(d.label)}: ${d.value} (${Math.round(frac * 100)}%)</title></circle>`;
    offset += len;
    return seg;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Donut chart">
    ${segs}
    <text x="${cx}" y="${cy - 2}" text-anchor="middle" fill="var(--text)" font-size="20" font-weight="800" font-family="Sora,sans-serif">${total}</text>
    <text x="${cx}" y="${cy + 15}" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="9" letter-spacing="1">TOTAL</text>
  </svg>`;
}

/** Horizontal bar list. data: [{label, value, color?}] */
function barList(data, { format = (v) => v } = {}) {
  const max = Math.max(...data.map(d => d.value), 1);
  return data.map(d => `
    <div class="src-row">
      <div class="src-label">${esc(d.label)}</div>
      <div class="src-track"><div class="src-bar" style="width:${(d.value / max) * 100}%;${d.color ? `background:${d.color}` : ''}"></div></div>
      <div class="src-count">${format(d.value)}</div>
    </div>`).join('');
}

/** Vertical bar chart. data: [{label, value, color?}] */
function barChart(data, { width = 600, height = 220 } = {}) {
  const max = Math.max(...data.map(d => d.value), 1);
  const padB = 26, padT = 12;
  const n = data.length || 1;
  const bw = Math.min(46, (width - 20) / n - 12);
  const bars = data.map((d, i) => {
    const x = 14 + i * ((width - 20) / n) + ((width - 20) / n - bw) / 2;
    const h = Math.max(2, (d.value / max) * (height - padB - padT));
    const y = height - padB - h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="${d.color || '#d4af37'}" opacity="0.9"><title>${esc(d.label)}: ${d.value}</title></rect>
      <text x="${x + bw / 2}" y="${height - 8}" fill="rgba(255,255,255,0.4)" font-size="9" text-anchor="middle">${esc(d.label)}</text>
      <text x="${x + bw / 2}" y="${y - 5}" fill="rgba(255,255,255,0.6)" font-size="9" text-anchor="middle">${d.value}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;display:block" role="img" aria-label="Bar chart">${bars}</svg>`;
}

/* ============================================================
   FORM HELPERS
   ============================================================ */
function field({ label, name, type = 'text', value = '', required = false, placeholder = '', options = null, hint = '', full = false }) {
  const req = required ? ' <span class="req">*</span>' : '';
  if (type === 'select') {
    return `<div class="form-group" data-field="${name}" ${full ? 'style="grid-column:1/-1"' : ''}>
      <label class="form-label" for="f_${name}">${label}${req}</label>
      <select class="form-select" id="f_${name}" name="${name}">
        ${options.map(o => `<option value="${esc(o)}" ${o === value ? 'selected' : ''}>${esc(o)}</option>`).join('')}
      </select>${hint ? `<div class="form-hint">${esc(hint)}</div>` : ''}
    </div>`;
  }
  if (type === 'textarea') {
    return `<div class="form-group" data-field="${name}" ${full ? 'style="grid-column:1/-1"' : ''}>
      <label class="form-label" for="f_${name}">${label}${req}</label>
      <textarea class="form-textarea" id="f_${name}" name="${name}" placeholder="${esc(placeholder)}">${esc(value)}</textarea>${hint ? `<div class="form-hint">${esc(hint)}</div>` : ''}
    </div>`;
  }
  return `<div class="form-group" data-field="${name}" ${full ? 'style="grid-column:1/-1"' : ''}>
    <label class="form-label" for="f_${name}">${label}${req}</label>
    <input class="form-input" id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}"/>
    ${hint ? `<div class="form-hint">${esc(hint)}</div>` : ''}
  </div>`;
}

function readForm(container) {
  const data = {};
  container.querySelectorAll('[name]').forEach(el => { data[el.name] = el.value.trim(); });
  return data;
}

/* toggle switch */
function toggle(name, checked, label, sub = '') {
  return `<div class="toggle-row">
    <div><div class="toggle-label">${esc(label)}</div>${sub ? `<div class="toggle-sub">${esc(sub)}</div>` : ''}</div>
    <label class="switch"><input type="checkbox" name="${name}" ${checked ? 'checked' : ''}/><span class="track"></span></label>
  </div>`;
}

  try {

      method,
      credentials: 'same-origin',
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (e) {
    return { ok: false, status: 0, error: 'Platform backend not reachable.' };
  }
  let data = {};
  try { data = await res.json(); } catch { /* empty */ }
  if (!res.ok) return { ok: false, status: res.status, error: data.error || `HTTP ${res.status}`, ...data };
  return { ok: true, status: res.status, ...data };
}

/* ---------------- BOOT & HYDRATION ---------------- */
async function boot() {
  // 1. Try cloud platform session
  try {
    const me = await api('GET', '/api/auth/me');
    if (me.ok && me.user) {
      session.user = me.user;
      const bizR = await api('GET', '/api/businesses');
      const biz = (bizR.rows || [])[0] || null;
      if (biz) {
        session.bizId = biz.id;
        session.business = biz;
        state.isCloudSync = true;
        state.settings = buildSettings(biz, session.user);
        await hydrate();
        return 'ready';
      }
    }
  } catch (e) {
    console.warn('Backend cloud check skipped, using live persistent workspace:', e);
  }

  // 2. Persistent Live Workspace Mode
  loadFromLocal();
  state = {
    ...state,
    signedIn: true,
    isCloudSync: false,
    serverError: null,
    onboarded: true,
    settings: state.settings || buildSettings(null, { name: 'Luke Hamilton' })
  };
  emit();
  return 'ready';
}

async function hydrate() {
  try {
    const [leadsR, apptR, notifR] = await Promise.all([
      api('GET', '/api/leads'),
      api('GET', '/api/appointments'),
      api('GET', '/api/notifications'),
    ]);

    if (leadsR.ok && Array.isArray(leadsR.rows) && leadsR.rows.length) {
      state.leads = leadsR.rows.map(r => ({
        id: r.id,
        firstName: (r.name || '').split(' ')[0] || 'Lead',

        company: '',
        source: r.source || 'Phone',
        serviceInterest: r.notes || 'Emergency Trade Request',
        estimatedValue: r.value || 5000,
        status: r.status ? (r.status.charAt(0).toUpperCase() + r.status.slice(1)) : 'New',
        score: 90,
        tags: ['Cloud Lead'],
        assignedOwner: 'Luke Hamilton',
        notes: [{ text: r.notes || 'Captured in CRM', author: 'System', createdAt: r.createdAt || nowISO() }],
        messages: [],

        updatedAt: r.updatedAt || nowISO(),

  } catch (e) {

    if (lead.notes) {
      lead.notes.forEach(n => acts.push({ id: uid('act'), leadId, type: 'note', text: n.text, at: n.createdAt, by: n.author }));
    }
    if (lead.messages) {
      lead.messages.forEach(m => acts.push({ id: uid('act'), leadId, type: m.sender === 'user' ? 'sms_sent' : 'sms_received', text: m.text, at: m.time, by: m.sender }));
    }
  }
  return acts.sort((a, b) => new Date(b.at) - new Date(a.at));
}

function leadAppointments(leadId) { return state.appointments.filter(a => a.leadId === leadId); }
function leadTasks(leadId) { return state.tasks.filter(t => t.leadId === leadId); }

/* ---------------- FULL MUTATIONS ---------------- */

async function addLead(data) {
  const firstName = (data.firstName || 'New').trim();
  const lastName = (data.lastName || 'Lead').trim();
  const newLead = {
    id: uid('lead'),
    firstName,
    lastName,
    phone: data.phone || '',
    email: data.email || '',
    company: data.company || '',
    source: data.source || 'Manual Input',
    serviceInterest: data.serviceInterest || 'General Trade Inquiry',
    estimatedValue: Number(data.estimatedValue) || 4500,
    status: data.status || 'New',
    score: 85,
    tags: Array.isArray(data.tags) ? data.tags : (data.tags ? [data.tags] : ['New Lead']),
    assignedOwner: data.assignedOwner || (state.settings ? state.settings.ownerName : 'Luke Hamilton'),
    notes: data.notes ? [{ text: data.notes, author: 'User', createdAt: nowISO() }] : [],
    messages: [],
    preferredChannel: 'SMS',
    createdAt: nowISO(),
    updatedAt: nowISO(),
    lastContactAt: null,
    nextFollowUpAt: daysFromNowISO(1, 10),
    automationActive: true,
    archived: false
  };

  state.leads.unshift(newLead);
  saveToLocal();
  emit();

  // Write-through to server if online
  if (state.isCloudSync && session.bizId) {
    try {
      await api('POST', '/api/leads', {
        businessId: session.bizId,
        name: `${firstName} ${lastName}`,
        phone: newLead.phone,
        email: newLead.email,
        source: newLead.source,
        notes: newLead.serviceInterest,
        value: newLead.estimatedValue
      });
    } catch(e){}
  }

  return { ok: true, lead: newLead };
}

async function updateLead(id, patch, meta = {}) {
  const lead = getLead(id);
  if (!lead) return { ok: false, error: 'Lead not found.' };

  Object.assign(lead, patch);
  lead.updatedAt = nowISO();

  saveToLocal();
  emit();

  // Write-through to server if online
  if (state.isCloudSync) {
    try {
      await api('PATCH', `/api/leads/${encodeURIComponent(id)}`, {
        name: `${lead.firstName} ${lead.lastName}`,
        phone: lead.phone,
        email: lead.email,
        status: lead.status.toLowerCase(),
        notes: lead.notes && lead.notes.length ? lead.notes[lead.notes.length - 1].text : undefined
      });
    } catch(e){}
  }

  return { ok: true, lead };
}

async function changeStatus(id, newStatus) {
  const lead = getLead(id);
  if (!lead) return { ok: false, error: 'Lead not found.' };

  lead.status = newStatus;
  lead.updatedAt = nowISO();

  // If moved to Won/Completed, trigger review funnel toast
  if (newStatus === 'Booked' || newStatus === 'Won') {
    toast(`🎉 Lead moved to ${newStatus}! 5-Star Review Request unlocked.`, 'success');
  }

  saveToLocal();
  emit();

  if (state.isCloudSync) {
    try { await api('PATCH', `/api/leads/${encodeURIComponent(id)}`, { status: newStatus.toLowerCase() }); } catch(e){}
  }

  return { ok: true };
}

async function addNote(leadId, text, author = 'Luke Hamilton') {
  const lead = getLead(leadId);
  if (!lead || !text.trim()) return { ok: false, error: 'Write note first.' };

  if (!lead.notes) lead.notes = [];
  lead.notes.push({ text: text.trim(), author, createdAt: nowISO() });
  lead.updatedAt = nowISO();

  saveToLocal();
  emit();
  return { ok: true };
}

async function sendMessage(leadId, text, channel = 'SMS') {
  const lead = getLead(leadId);
  if (!lead || !text.trim()) return { ok: false, error: 'Message cannot be empty.' };

  if (!lead.messages) lead.messages = [];
  lead.messages.push({ sender: 'user', text: text.trim(), time: nowISO(), channel });
  lead.lastContactAt = nowISO();
  lead.updatedAt = nowISO();

  // Log activity
  state.activities.unshift({
    id: uid('act'),
    leadId,
    type: 'sms_sent',
    channel: 'SMS',
    message: text.trim(),
    createdAt: nowISO(),
    createdBy: 'Luke Hamilton'
  });

  saveToLocal();
  emit();
  toast(`💬 ${channel} sent to ${lead.firstName} (${lead.phone})!`, 'success');
  return { ok: true };
}

async function deleteLead(id) {
  state.leads = state.leads.filter(l => l.id !== id);
  saveToLocal();
  emit();
  if (state.isCloudSync) {
    try { await api('DELETE', `/api/leads/${encodeURIComponent(id)}`); } catch(e){}
  }
  return { ok: true };
}

async function duplicateLead(id) {
  const src = getLead(id);
  if (!src) return { ok: false, error: 'Lead not found.' };
  return addLead({
    firstName: `${src.firstName} (Copy)`,
    lastName: src.lastName,
    phone: src.phone,
    email: src.email,
    company: src.company,
    source: src.source,
    serviceInterest: src.serviceInterest,
    estimatedValue: src.estimatedValue,
    status: 'New'
  });
}

async function archiveLead(id, archived = true) {
  const lead = getLead(id);
  if (!lead) return { ok: false };
  lead.archived = archived;
  saveToLocal();
  emit();
  return { ok: true };
}

function bulkUpdate(ids, patch) {

  saveToLocal();
  emit();
  return { ok: true };
}

function renderDashboard(root) {

  const rate = total ? respondedCount / total : 0;
  const convRate = total ? conversion / total : 0;

  const activePipelineValue = leads.filter(l => l.status !== 'Lost').reduce((sum, l) => sum + (Number(l.estimatedValue) || 0), 0);
  const closedRevenue = leads.filter(l => l.status === 'Booked').reduce((sum, l) => sum + (Number(l.estimatedValue) || 0), 0);
  const avaCallsCount = leads.filter(l => l.source === 'Ava 24/7 Voice AI' || l.callRecording).length;

  const dueTasks = s.tasks.filter(t => !t.completed);
  const overdue = dueTasks.filter(t => isOverdue(t.dueAt));
  const todayTasks = dueTasks.filter(t => !isOverdue(t.dueAt) && isTodayStr(t.dueAt));
  const upcoming = dueTasks.filter(t => !isOverdue(t.dueAt) && !isTodayStr(t.dueAt));
  const sentCount = s.activities.filter(a => a.type === 'sms_sent' || a.type === 'email_sent').length;

  const weekLeads = leads.filter(l => new Date(l.createdAt) > Date.now() - 7 * 86400000).length;
  const monthConversions = leads.filter(l => l.status === 'Booked' && new Date(l.updatedAt) > Date.now() - 30 * 86400000).length;

  root.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Executive Command Center</div>
        <div class="page-subtitle">${esc(s.settings?.business?.name || 'VantorX Commercial Workspace')} · ${esc(new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }))}</div>
      </div>
      <div class="page-header-actions">
        <button class="btn btn-gold btn-sm" id="dashTestAvaBtn" style="font-weight:700">⚡ Test Ava Call Intake</button>
        <button class="btn btn-ghost btn-sm" data-action="quick-add">+ Quick Add Lead</button>
      </div>
    </div>

    <!-- METRICS GRID -->
    <div class="metrics-grid">
      <div class="card metric-card card-hover" style="border-left:3px solid var(--gold)">
        <div class="metric-label">Active Pipeline Value</div>
        <div class="metric-value" style="color:var(--gold-bright);font-weight:800;font-size:1.65rem">${fmtMoney(activePipelineValue)}</div>
      </div>
      <div class="card metric-card card-hover" style="border-left:3px solid #4ade80">
        <div class="metric-label">Closed / Won Revenue</div>
        <div class="metric-value" style="color:#4ade80;font-weight:800;font-size:1.65rem">${fmtMoney(closedRevenue)}</div>
      </div>
      ${metricCard('Total Leads', total)}
      ${metricCard('New Leads', count('New'))}
      ${metricCard('Booked Jobs', conversion)}
      <div class="card metric-card card-hover" style="border-left:3px solid #60a5fa">
        <div class="metric-label">Ava AI Calls Handled</div>
        <div class="metric-value" style="color:#60a5fa;font-weight:800;font-size:1.65rem">${avaCallsCount}</div>
      </div>
    </div>

    <div class="dash-grid">
      <!-- PERFORMANCE CHART -->
      <div class="card">
        <div class="panel-head">
          <div class="panel-title">Inbound Lead Velocity</div>
          <div style="display:flex;gap:8px;align-items:center">
            <div class="chart-toggle" id="perfMetric">
              <button data-metric="new" class="active">New leads</button>
              <button data-metric="replies">Replies</button>
              <button data-metric="bookings">Bookings</button>
              <button data-metric="conversions">Conversions</button>
            </div>
            <div class="range-toggle" id="perfRange">
              <button data-range="7">7d</button>
              <button data-range="30" class="active">30d</button>
              <button data-range="90">90d</button>
            </div>
          </div>
        </div>
        <div class="panel-body"><div id="perfChart" class="chart-canvas"></div></div>
      </div>

      <!-- PIPELINE SUMMARY -->
      <div class="card">
        <div class="panel-head"><div class="panel-title">Pipeline Value Summary</div></div>
        <div class="panel-body">
          ${STATUSES.map(st => {
            const stLeads = leads.filter(l => l.status === st);
            const n = stLeads.length;
            const stVal = stLeads.reduce((sum, l) => sum + (Number(l.estimatedValue) || 0), 0);
            return `<div class="psum-row">
              <div class="psum-label" style="display:flex;align-items:center;gap:6px">
                <span>${st}</span>

        <div class="panel-body">

        </div>
      </div>

    <div class="card">
      <div class="panel-head">
        <div class="panel-title">Recent CRM Activity & Dispatch Feed</div>

    simulateAvaCall();
    renderDashboard(root);
  });

  /* ---- animated count-ups ---- */
  root.querySelectorAll('.metric-value[data-count]').forEach(el => {
    const target = Number(el.dataset.count);
    const type = el.dataset.type;
    countUp(el, target, { pct: type === 'pct', suffix: type === 'pct' ? '%' : '' });
  });

  /* ---- performance chart ---- */
  const chartState = { metric: 'new', range: 30 };
  function drawChart() {
    const days = chartState.range;
    const labels = [], pts = { new: [], replies: [], bookings: [], conversions: [] };
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i); d.setHours(12, 0, 0, 0);
      labels.push(d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
      const next = new Date(d); next.setDate(next.getDate() + 1);
      const inDay = (iso) => { const t = new Date(iso); return t >= d && t < next; };
      pts.new.push({ x: d, y: leads.filter(l => inDay(l.createdAt)).length });
      pts.replies.push({ x: d, y: leads.filter(l => inDay(l.lastContactAt) && ['Responded', 'Booked'].includes(l.status)).length });
      pts.bookings.push({ x: d, y: s.appointments.filter(a => inDay(a.startTime)).length });
      pts.conversions.push({ x: d, y: leads.filter(l => inDay(l.updatedAt) && l.status === 'Booked').length });
    }
    const color = { new: '#60a5fa', replies: '#a78bfa', bookings: '#4ade80', conversions: '#f0d060' }[chartState.metric];
    const chartEl = document.getElementById('perfChart');
    if (chartEl) {
      chartEl.innerHTML = lineChart([{ color, points: pts[chartState.metric], fill: true }], { labels });
    }
  }
  drawChart();

  root.querySelector('#perfMetric')?.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    root.querySelectorAll('#perfMetric button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); chartState.metric = b.dataset.metric; drawChart();
  });
  root.querySelector('#perfRange')?.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    root.querySelectorAll('#perfRange button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); chartState.range = Number(b.dataset.range); drawChart();
  });
}

function metricCard(label, value, type = '', _icon = '') {
  const display = type === 'pct' ? '0%' : '0';
  return `<div class="card metric-card card-hover">
    <div class="metric-label">${label}</div>
    <div class="metric-value" data-count="${value}" data-type="${type}">${display}</div>
  </div>`;
}

function followUpRows(tasks, s) {
  if (!tasks.length) {
    return `<div style="text-align:center;color:var(--text-dim);padding:24px 0">No follow-ups due. All dispatch schedules are caught up. 🎉</div>`;
  }
  return tasks.map(t => {
    const lead = getLead(t.leadId);
    const overdueTask = isOverdue(t.dueAt);
    return `<div class="fu-row">
      <div class="fu-main">
        <div class="fu-name" data-open-lead="${t.leadId}">${esc(lead ? lead.firstName + ' ' + lead.lastName : 'Unknown')}</div>
        <div class="fu-meta">${esc(t.type || 'Task')} · ${esc(t.assignedOwner || 'Staff')} · <span style="color:${overdueTask ? 'var(--red)' : 'inherit'}">${overdueTask ? 'Overdue' : 'Due'} ${relTime(t.dueAt)}</span></div>
      </div>
      <button class="btn btn-ghost btn-sm" data-complete-task="${t.id}">✓</button>
      <button class="btn btn-gold btn-sm" data-open-lead="${t.leadId}">Open</button>
    </div>`;
  }).join('');
}

function hotLeadRows(leads) {
  const hot = [...leads].filter(l => l.status !== 'Lost')
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 5);
  if (!hot.length) return '<div style="color:var(--text-dim);padding:20px 0">No active leads right now.</div>';
  return hot.map(l => {
    const isAva = l.source === 'Ava 24/7 Voice AI' || l.callRecording;
    return `
    <div class="hot-row" style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-soft)">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="badge ${l.status === 'New' ? 'badge-new' : 'badge-hot'}" style="font-size:11px">${l.status}</span>
        <div>
          <div class="fu-name" data-open-lead="${l.id}" style="cursor:pointer;font-weight:600">${esc(l.firstName)} ${esc(l.lastName)}</div>
          <div class="fu-meta" style="font-size:0.75rem;color:var(--text-dim)">
            ${esc(l.serviceInterest || l.source)} ${l.estimatedValue ? `· <span style="color:var(--gold-bright);font-weight:700">${fmtMoney(l.estimatedValue)}</span>` : ''}
          </div>
        </div>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        ${isAva ? '<span class="badge" style="background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.35);color:#60a5fa;font-size:10.5px">📞 Ava Call</span>' : ''}
        <button class="btn btn-ghost btn-sm" data-open-lead="${l.id}">Open</button>
      </div>
    </div>`;
  }).join('');
}

function activityRows(activities, s, { compact = true } = {}) {
  const ICONS = {
    lead_created: '✨', lead_updated: '✏️', status_changed: '🔀', note_added: '📝',
    sms_sent: '💬', email_sent: '📧', reply: '⚡', automation_started: '▶️',
    automation_stopped: '⏸️', appointment_booked: '📅', lead_archived: '📦', lead_deleted: '🗑️',
    sms_drafted: '✍️', email_drafted: '✉️', followup_scheduled: '⏰'
  };
  if (!activities.length) return '<div style="color:var(--text-dim);padding:20px 0">No activity yet.</div>';
  return activities.map(a => {
    const lead = getLead(a.leadId);
    return `<div class="act-row">
      <div class="act-ico">${ICONS[a.type] || '•'}</div>
      <div style="flex:1;min-width:0">
        <div class="act-text">
          ${lead ? `<strong style="cursor:pointer" data-open-lead="${lead.id}">${esc(lead.firstName)} ${esc(lead.lastName)}</strong> · ` : ''}
          ${describeActivity(a)}
        </div>
        <div class="act-time">${esc(a.createdBy || 'System')} · ${relTime(a.createdAt)}</div>
      </div>
    </div>`;
  }).join('');
}

function describeActivity(a) {
  switch (a.type) {
    case 'lead_created': return 'Opportunity created';
    case 'lead_updated': return 'Opportunity details updated';
    case 'status_changed': return a.message ? `Pipeline Stage: ${esc(a.message)}` : 'Stage updated';
    case 'note_added': return 'Field note added' + (a.message ? ` — “${esc(a.message)}”` : '');
    case 'sms_sent': return a.message ? `SMS dispatched: “${esc(a.message)}”` : 'SMS dispatched';
    case 'email_sent': return a.message ? `Email sent: “${esc(a.message)}”` : 'Email sent';
    case 'reply': return a.message ? `Inbound reply: “${esc(a.message)}”` : 'Reply received';
    case 'automation_started': return 'Sequence started' + (a.message ? ` — ${esc(a.message)}` : '');
    case 'automation_stopped': return 'Sequence stopped';
    case 'appointment_booked': return a.message ? `Inspection walkthrough scheduled — ${esc(a.message)}` : 'Walkthrough scheduled';
    case 'lead_archived': return 'Lead archived';
    case 'lead_deleted': return 'Lead removed';
    case 'followup_scheduled': return a.message || 'Follow-up scheduled';
    default: return esc(a.type?.replace(/_/g, ' ') || 'Event');
  }
}

function isTodayStr(iso) {
  const d = new Date(iso), n = new Date();
  return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
}


/* ---- js/pages/leads.js ---- */
/* ============================================================
   VANTORX LEADFLOW — pages/leads.js
   CRM table + search + filters + sort + bulk + add/edit + CSV.
   ============================================================ */

const filterState = { search: '', status: '', source: '', owner: '', due: '', booked: '', sort: 'newest' };

function renderLeads(root) {
  root.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Leads</div>
        <div class="page-subtitle">Every lead in one place — search, filter, and act.</div>
      </div>
      <div class="page-header-actions">
        <button class="btn btn-ghost" data-action="import-csv">⬆ Import CSV</button>
        <button class="btn btn-ghost" data-action="export-csv">⬇ Export</button>
        <button class="btn btn-gold" data-action="add-lead">+ Add Lead</button>
      </div>
    </div>

    <div class="filter-bar">
      <input class="search-input" id="leadSearch" placeholder="Search name, phone, email, company, notes…" value="${esc(filterState.search)}"/>
      <select class="select-input" id="fStatus">
        <option value="">All statuses</option>
        ${STATUSES.map(st => `<option ${filterState.status === st ? 'selected' : ''}>${st}</option>`).join('')}
      </select>
      <select class="select-input" id="fSource">
        <option value="">All sources</option>
        ${SOURCES.map(sr => `<option ${filterState.source === sr ? 'selected' : ''}>${sr}</option>`).join('')}
      </select>
      <select class="select-input" id="fOwner">
        <option value="">All owners</option>
        ${ownerOptions()}
      </select>
      <select class="select-input" id="fBooked">
        <option value="">Replied or not</option>
        <option value="replied" ${filterState.booked === 'replied' ? 'selected' : ''}>Replied</option>
        <option value="noreply" ${filterState.booked === 'noreply' ? 'selected' : ''}>No reply</option>
      </select>
      <select class="select-input" id="fSort">
        <option value="newest" ${filterState.sort === 'newest' ? 'selected' : ''}>Newest</option>
        <option value="oldest" ${filterState.sort === 'oldest' ? 'selected' : ''}>Oldest</option>
        <option value="name" ${filterState.sort === 'name' ? 'selected' : ''}>Name</option>
        <option value="score" ${filterState.sort === 'score' ? 'selected' : ''}>Score</option>
        <option value="lastContact" ${filterState.sort === 'lastContact' ? 'selected' : ''}>Last contact</option>
        <option value="nextFollowUp" ${filterState.sort === 'nextFollowUp' ? 'selected' : ''}>Next follow-up</option>
      </select>
      <span class="result-count" id="leadCount"></span>
    </div>

    <div id="bulkBar"></div>
    <div class="card table-wrap"><div id="leadTable"></div></div>
  `;

  const rerenderTable = () => renderTable(root);
  root.querySelector('#leadSearch').addEventListener('input', debounce((e) => { filterState.search = e.target.value; rerenderTable(); }, 200));
  root.querySelector('#fStatus').addEventListener('change', e => { filterState.status = e.target.value; rerenderTable(); });
  root.querySelector('#fSource').addEventListener('change', e => { filterState.source = e.target.value; rerenderTable(); });
  root.querySelector('#fOwner').addEventListener('change', e => { filterState.owner = e.target.value; rerenderTable(); });
  root.querySelector('#fBooked').addEventListener('change', e => { filterState.booked = e.target.value; rerenderTable(); });
  root.querySelector('#fSort').addEventListener('change', e => { filterState.sort = e.target.value; rerenderTable(); });

  root.querySelector('[data-action="add-lead"]').addEventListener('click', () => openLeadForm(null, rerenderTable));
  root.querySelector('[data-action="export-csv"]').addEventListener('click', exportCSV);
  root.querySelector('[data-action="import-csv"]').addEventListener('click', openImport);

  renderTable(root);
}

function ownerOptions() {
  return getState().settings.team.map(m => `<option ${filterState.owner === m.name ? 'selected' : ''}>${esc(m.name)}</option>`).join('');
}

function filteredLeads() {
  const s = getState();
  let leads = s.leads.filter(l => !l.archived);
  const q = filterState.search.toLowerCase();
  if (q) {
    leads = leads.filter(l =>
      `${l.firstName} ${l.lastName}`.toLowerCase().includes(q) ||
      (l.phone || '').toLowerCase().includes(q) ||
      (l.email || '').toLowerCase().includes(q) ||
      (l.company || '').toLowerCase().includes(q) ||
      (l.source || '').toLowerCase().includes(q) ||
      (l.notes || []).some(n => n.text.toLowerCase().includes(q))
    );
  }
  if (filterState.status) leads = leads.filter(l => l.status === filterState.status);
  if (filterState.source) leads = leads.filter(l => l.source === filterState.source);
  if (filterState.owner) leads = leads.filter(l => l.assignedOwner === filterState.owner);
  if (filterState.booked === 'replied') leads = leads.filter(l => ['Responded', 'Booked'].includes(l.status));
  if (filterState.booked === 'noreply') leads = leads.filter(l => !['Responded', 'Booked'].includes(l.status));

  const sorters = {
    newest: (a, b) => new Date(b.createdAt) - new Date(a.createdAt),
    oldest: (a, b) => new Date(a.createdAt) - new Date(b.createdAt),
    name: (a, b) => `${a.firstName}${a.lastName}`.localeCompare(`${b.firstName}${b.lastName}`),
    score: (a, b) => b.score - a.score,
    lastContact: (a, b) => new Date(b.lastContactAt || 0) - new Date(a.lastContactAt || 0),
    nextFollowUp: (a, b) => new Date(a.nextFollowUpAt || 8e15) - new Date(b.nextFollowUpAt || 8e15)
  };
  return leads.sort(sorters[filterState.sort] || sorters.newest);
}

function renderTable(root) {
  const s = getState();
  const tableEl = root.querySelector('#leadTable');
  const countEl = root.querySelector('#leadCount');
  const bulkEl = root.querySelector('#bulkBar');
  const leads = filteredLeads();
  countEl.textContent = `${leads.length} lead${leads.length === 1 ? '' : 's'}`;

  if (!leads.length) {
    tableEl.innerHTML = emptyState({
      icon: '🔍',
      title: 'No leads match',
      message: 'Try clearing filters, or add your first lead to get started.',
      actionHTML: '<button class="btn btn-gold" data-action="add-lead-empty">+ Add Lead</button>'
    });
    tableEl.querySelector('[data-action="add-lead-empty"]')?.addEventListener('click', () => openLeadForm(null, () => renderTable(root)));
    bulkEl.innerHTML = '';
    return;
  }

  const selected = new Set(s.selectedLeadIds);
  tableEl.innerHTML = `
    <table>
      <thead><tr>
        <th style="width:34px"><input type="checkbox" class="checkbox" id="checkAll" ${selected.size && selected.size === leads.length ? 'checked' : ''}/></th>
        <th>Name</th><th>Phone</th><th>Source</th><th>Service</th><th>Status</th>
        <th>Score</th><th>Last contact</th><th>Next follow-up</th><th>Owner</th><th>Created</th><th></th>
      </tr></thead>
      <tbody>
        ${leads.map(l => {
          const isSel = selected.has(l.id);
          const due = l.nextFollowUpAt && new Date(l.nextFollowUpAt) < new Date();
          return `<tr class="${isSel ? 'selected' : ''}" data-lead-row="${l.id}">
            <td><input type="checkbox" class="checkbox row-check" data-id="${l.id}" ${isSel ? 'checked' : ''}/></td>
            <td><div class="lead-name" data-open-lead="${l.id}">${esc(l.firstName)} ${esc(l.lastName)}</div><div class="lead-sub">${esc(l.email || l.phone || '')}</div></td>
            <td class="cell-dim">${esc(l.phone || '—')}</td>
            <td class="cell-dim">${esc(l.source)}</td>
            <td class="cell-dim">${esc(l.serviceInterest || '—')}</td>
            <td>${statusBadge(l.status)}</td>
            <td>${l.score != null ? `<span class="score-pill ${l.score >= 70 ? 'score-high' : l.score >= 45 ? 'score-mid' : 'score-low'}">${l.score}</span>` : '<span class="cell-dim">—</span>'}</td>
            <td class="cell-dim">${l.lastContactAt ? fmtDate(l.lastContactAt) : '—'}</td>
            <td class="cell-dim" ${due ? 'style="color:var(--red)"' : ''}>${l.nextFollowUpAt ? fmtDate(l.nextFollowUpAt) : '—'}</td>
            <td class="cell-dim">${esc(l.assignedOwner)}</td>
            <td class="cell-dim">${fmtDate(l.createdAt)}</td>
            <td><div class="cell-actions">
              <button class="row-actions-btn" data-open-lead="${l.id}" title="Open profile">↗</button>
              <button class="row-actions-btn" data-edit-lead="${l.id}" title="Edit">✎</button>
              <button class="row-actions-btn" data-sms-lead="${l.id}" title="Generate message">✦</button>
            </div></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;

  /* bulk bar */
  bulkEl.innerHTML = selected.size ? `
    <div class="bulk-bar">
      <strong>${selected.size} selected</strong>
      <select class="select-input" id="bulkStatus">
        <option value="">Change status…</option>${STATUSES.map(st => `<option>${st}</option>`).join('')}
      </select>
      <select class="select-input" id="bulkOwner">
        <option value="">Assign owner…</option>${s.settings.team.map(m => `<option>${esc(m.name)}</option>`).join('')}
      </select>
      <button class="btn btn-ghost btn-sm" data-bulk="tag">+ Tag</button>
      <button class="btn btn-ghost btn-sm" data-bulk="followup">⏰ Schedule follow-up</button>
      <button class="btn btn-ghost btn-sm" data-bulk="start-auto">▶ Start automation</button>
      <button class="btn btn-ghost btn-sm" data-bulk="stop-auto">⏸ Stop automation</button>
      <button class="btn btn-ghost btn-sm" data-bulk="archive">📦 Archive</button>
      <button class="btn btn-danger btn-sm" data-bulk="delete">🗑 Delete</button>
      <button class="btn btn-ghost btn-sm" data-bulk="clear">Clear</button>
    </div>` : '';

  /* ---- wiring ---- */
  tableEl.querySelector('#checkAll').addEventListener('change', (e) => {
    const ids = leads.map(l => l.id);
    ids.forEach(id => toggleLeadSelected(id, e.target.checked));
    renderTable(root);
  });
  tableEl.querySelectorAll('.row-check').forEach(cb => {
    cb.addEventListener('change', (e) => {
      e.stopPropagation();
      toggleLeadSelected(cb.dataset.id, cb.checked);
      renderTable(root);
    });
  });
  tableEl.querySelectorAll('[data-open-lead]').forEach(el =>
    el.addEventListener('click', (e) => { e.stopPropagation(); window.LeadFlow.openLead(el.dataset.openLead); }));
  tableEl.querySelectorAll('[data-edit-lead]').forEach(el =>
    el.addEventListener('click', (e) => { e.stopPropagation(); openLeadForm(el.dataset.editLead, () => renderTable(root)); }));
  tableEl.querySelectorAll('[data-sms-lead]').forEach(el =>
    el.addEventListener('click', (e) => { e.stopPropagation(); window.LeadFlow.openAIAssistant(el.dataset.smsLead); }));

  bulkEl.querySelectorAll('[data-bulk]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const ids = [...selected];
      const action = btn.dataset.bulk;
      const { bulkChangeStatus, bulkAssign, bulkTag, bulkFollowUp, bulkAutomation, bulkArchive, bulkDelete } = bulkHelpers();
      if (action === 'status') return;
      if (action === 'tag') return bulkTag(ids, () => renderTable(root));
      if (action === 'followup') return bulkFollowUp(ids, () => renderTable(root));
      if (action === 'start-auto') return bulkAutomation(ids, true, () => renderTable(root));
      if (action === 'stop-auto') return bulkAutomation(ids, false, () => renderTable(root));
      if (action === 'archive') return bulkArchive(ids, () => { clearSelectionLocal(); renderTable(root); });
      if (action === 'delete') return bulkDelete(ids, () => { clearSelectionLocal(); renderTable(root); });
    });
  });
  const bulkStatus = bulkEl.querySelector('#bulkStatus');
  const bulkOwner = bulkEl.querySelector('#bulkOwner');
  if (bulkStatus) bulkStatus.addEventListener('change', async (e) => {
    if (!e.target.value) return;
    const { bulkChangeStatus } = bulkHelpers();
    await bulkChangeStatus([...selected], e.target.value);
    clearSelectionLocal(); renderTable(root);
  });
  if (bulkOwner) bulkOwner.addEventListener('change', async (e) => {
    if (!e.target.value) return;
    const { bulkAssign } = bulkHelpers();
    await bulkAssign([...selected], e.target.value);
    clearSelectionLocal(); renderTable(root);
  });

  function clearSelectionLocal() { clearSelection(); }
}

/* ---------- bulk helpers ---------- */
function bulkHelpers() {
  return {
    async bulkChangeStatus(ids, status) {
      for (const id of ids) await changeStatus(id, status);
      toast(`${ids.length} lead${ids.length > 1 ? 's' : ''} → ${status} (saved on server)`);
    },
    async bulkAssign(ids, owner) {
      bulkUpdate(ids, { assignedOwner: owner });
    },
    async bulkTag(ids, rerender) {
      toast('Tags are not tracked on the platform yet.', 'info');
    },
    async bulkFollowUp(ids, rerender) {
      const close = openModal({
        title: 'Schedule follow-up',
        body: `<div class="form-group"><label class="form-label">Date & time</label><input class="form-input" id="bulkFU" type="datetime-local" value="${toLocalInputValue(daysFromNowISO(1))}"/></div>`,
        footer: `<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn btn-gold" data-ok>Schedule</button>`,
        onOpen(modal) {
          modal.querySelector('[data-cancel]').addEventListener('click', close);
          modal.querySelector('[data-ok]').addEventListener('click', () => {
            const v = modal.querySelector('#bulkFU').value;
            if (!v) return;
            ids.forEach(id => scheduleFollowUp(id, new Date(v).toISOString()));
            close(); toast(`Follow-up scheduled for ${ids.length} leads`); rerender();
          });
        }
      });
    },
    async bulkAutomation(ids, start, rerender) {
      const autos = getState().automations;
      if (!autos.length) { toast('No automations yet — create one first', 'error'); return; }
      const close = openModal({
        title: start ? 'Start automation' : 'Stop automation',
        body: start
          ? `<div class="form-group"><label class="form-label">Sequence</label><select class="form-select" id="bulkAuto">${autos.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div>`
          : `<p style="color:var(--text-soft)">Stop automation for ${ids.length} lead${ids.length > 1 ? 's' : ''}?</p>`,
        footer: `<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn btn-gold" data-ok>${start ? 'Start' : 'Stop'}</button>`,
        onOpen(modal) {
          modal.querySelector('[data-cancel]').addEventListener('click', close);
          modal.querySelector('[data-ok]').addEventListener('click', () => {
            ids.forEach(id => {
              if (start) { const autoId = modal.querySelector('#bulkAuto')?.value || autos[0].id; updateLead(id, { automationId: autoId, automationActive: true }); }
              else updateLead(id, { automationActive: false });
            });
            close(); toast(start ? 'Automation started' : 'Automation stopped'); rerender();
          });
        }
      });
    },
    async bulkArchive(ids, rerender) {
      const r = await archiveLead(ids[0], true);
      toast(r && r.error ? r.error : `${ids.length} lead${ids.length > 1 ? 's' : ''} archived`, r && r.error ? 'info' : undefined);
      rerender();
    },
    async bulkDelete(ids, rerender) {
      const ok = await confirmDialog({ title: `Delete ${ids.length} lead${ids.length > 1 ? 's' : ''}?`, message: 'This permanently removes the leads and their activity from the platform server. This cannot be undone.', confirmText: 'Delete forever', danger: true });
      if (!ok) return;
      for (const id of ids) await deleteLead(id);
      toast(`${ids.length} lead${ids.length > 1 ? 's' : ''} deleted from the server`, 'info'); rerender();
    }
  };
}

/* ---------- add / edit lead ---------- */
function openLeadForm(leadId, onSaved) {
  const s = getState();
  const lead = leadId ? getLead(leadId) : null;
  const sources = [...new Set([...SOURCES, ...s.leads.map(l => l.source)])];
  const body = `
    <div class="form-row">
      ${field({ label: 'First name', name: 'firstName', value: lead?.firstName || '', required: true })}
      ${field({ label: 'Last name', name: 'lastName', value: lead?.lastName || '', required: true })}
    </div>
    <div class="form-row">
      ${field({ label: 'Phone', name: 'phone', type: 'tel', value: lead?.phone || '', placeholder: '(813) 555-0100' })}
      ${field({ label: 'Email', name: 'email', type: 'email', value: lead?.email || '', placeholder: 'name@example.com' })}
    </div>
    <div class="form-row">
      ${field({ label: 'Company', name: 'company', value: lead?.company || '' })}
      ${field({ label: 'Lead source', name: 'source', type: 'select', options: sources, value: lead?.source || 'Manual' })}
    </div>
    <div class="form-row">
      ${field({ label: 'Service interest', name: 'serviceInterest', value: lead?.serviceInterest || '', placeholder: 'e.g. Haircut + Beard' })}
      ${field({ label: 'Estimated value ($)', name: 'estimatedValue', type: 'number', value: lead?.estimatedValue ?? '' })}
    </div>
    <div class="form-row">
      ${field({ label: 'Status', name: 'status', type: 'select', options: STATUSES, value: lead?.status || 'New' })}
      ${field({ label: 'Preferred channel', name: 'preferredChannel', type: 'select', options: ['SMS', 'Email'], value: lead?.preferredChannel || 'SMS' })}
    </div>
    <div class="form-row">
      ${field({ label: 'Assigned owner', name: 'assignedOwner', type: 'select', options: s.settings.team.map(m => m.name), value: lead?.assignedOwner || s.settings.leadSettings.defaultOwner })}
      ${field({ label: 'Tags (comma separated)', name: 'tags', value: (lead?.tags || []).join(', '), placeholder: 'vip, high-value' })}
    </div>
    ${field({ label: 'Notes', name: 'notes', type: 'textarea', value: '', placeholder: lead ? 'Add a note (appended to existing notes)…' : 'Anything worth remembering…', full: true })}
  `;

  const close = openModal({
    title: lead ? `Edit ${lead.firstName} ${lead.lastName}` : 'Add Lead',
    wide: true,
    body,
    footer: `${lead ? `<button class="btn btn-danger" data-del style="margin-right:auto">Delete</button>` : ''}
      <button class="btn btn-ghost" data-cancel>Cancel</button>
      <button class="btn btn-gold" data-save>${lead ? 'Save changes' : 'Add lead'}</button>`,
    onOpen(modal) {
      modal.querySelector('[data-cancel]').addEventListener('click', close);
      const delBtn = modal.querySelector('[data-del]');
      if (delBtn) delBtn.addEventListener('click', async () => {
        const ok = await confirmDialog({ title: 'Delete this lead?', message: 'This permanently removes the lead and its history. This cannot be undone.', confirmText: 'Delete forever', danger: true });
        if (ok) { deleteLead(leadId); close(); toast('Lead deleted from the server', 'info'); onSaved && onSaved(); }
      });
      modal.querySelector('[data-save]').addEventListener('click', async () => {
        const data = readForm(modal);
        /* validation */
        const errors = [];
        if (!data.firstName && !data.lastName) errors.push(['firstName', 'Name is required']);
        if (!data.phone && !data.email) errors.push(['phone', 'Phone or email is required']);
        if (data.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) errors.push(['email', 'That email does not look valid']);
        if (data.phone && data.phone.replace(/\D/g, '').length < 7) errors.push(['phone', 'That phone number looks too short']);
        modal.querySelectorAll('.form-error').forEach(e => e.remove());
        modal.querySelectorAll('.invalid').forEach(e => e.classList.remove('invalid'));
        if (errors.length) {
          errors.forEach(([name, msg]) => {
            const fg = modal.querySelector(`[data-field="${name}"]`);
            if (fg) {
              fg.querySelector('.form-input')?.classList.add('invalid');
              const err = document.createElement('div');
              err.className = 'form-error'; err.textContent = msg;
              fg.appendChild(err);
            }
          });
          return;
        }
        const patch = {
          firstName: data.firstName, lastName: data.lastName,
          phone: data.phone, email: data.email, company: data.company,
          source: data.source, serviceInterest: data.serviceInterest,
          estimatedValue: data.estimatedValue ? Number(data.estimatedValue) : null,
          status: data.status, preferredChannel: data.preferredChannel,
          assignedOwner: data.assignedOwner,
          tags: data.tags ? data.tags.split(',').map(t => t.trim().toLowerCase()).filter(Boolean) : []
        };
        if (lead) {
          const noteText = data.notes;
          delete patch.notes;
          await updateLead(lead.id, patch);
          if (noteText) await addNote(lead.id, noteText);
          toast('Lead updated on the server');
        } else {
          const out = await addLead(patch);
          if (!out.ok) { toast(out.error || 'Could not add lead', 'error'); return; }
          if (data.notes) await addNote(out.lead.id, data.notes);
          toast('Lead added to the platform');
        }
        close();
        onSaved && onSaved();
      });
    }
  });
  return close;
}

/* ---------- CSV import ---------- */
function openImport() {
  const close = openModal({
    title: 'Import Leads from CSV',
    wide: true,
    body: `
      <div class="form-group">
        <label class="form-label">CSV file</label>
        <input class="form-input" type="file" id="csvFile" accept=".csv,text/csv"/>
        <div class="form-hint">First row is treated as headers. You will map columns before import.</div>
      </div>
      <div id="csvPreview"></div>`,
    footer: `<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn btn-gold" data-go id="csvGo" disabled>Continue</button>`,
    onOpen(modal) {
      modal.querySelector('[data-cancel]').addEventListener('click', close);
      const fileInput = modal.querySelector('#csvFile');
      const goBtn = modal.querySelector('#csvGo');
      let parsed = null;
      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const rows = parseCSV(reader.result);
          if (rows.length < 2) {
            modal.querySelector('#csvPreview').innerHTML = '<div class="form-error">That file appears to be empty.</div>';
            return;
          }
          parsed = rows;
          renderMapping(modal, rows, goBtn);
        };
        reader.readAsText(file);
      });
      goBtn.addEventListener('click', () => {
        if (!parsed) return;
        doImport(modal, parsed, close);
      });
    }
  });
}

function renderMapping(modal, rows, goBtn) {
  const headers = rows[0];
  const sample = rows.slice(1, 6);
  const targetFields = ['firstName', 'lastName', 'phone', 'email', 'company', 'source', 'serviceInterest', 'estimatedValue', 'status'];
  modal.querySelector('#csvPreview').innerHTML = `
    <div class="form-label" style="margin-bottom:8px">Map columns</div>
    <div class="table-wrap" style="border:1px solid var(--border);border-radius:10px">
      <table>
        <thead><tr>${headers.map((h, i) => `<th>
          <select class="select-input" data-map="${i}" style="min-width:120px">
            <option value="">— skip —</option>
            ${targetFields.map(tf => `<option value="${tf}">${tf}</option>`).join('')}
          </select>
          <div style="font-weight:400;text-transform:none;letter-spacing:0;margin-top:4px;color:var(--text-dim)">“${esc(h)}”</div>
        </th>`).join('')}</tr></thead>
        <tbody>${sample.map(r => `<tr>${r.map(c => `<td class="cell-dim">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
    </div>
    <div class="form-hint" style="margin-top:8px">Showing first ${sample.length} data rows.</div>`;
  goBtn.disabled = false;
  goBtn.textContent = 'Import';
  goBtn.dataset.stage = 'import';
  goBtn.onclick = async () => {
    const mapping = [...modal.querySelectorAll('[data-map]')].map(sel => sel.value);
    const defaults = { source: 'Manual', status: 'New' };
    const { leads, errors } = leadImportService.import(rows.slice(1), mapping, defaults);
    const s = getState();
    const existing = new Set(s.leads.map(l => `${l.firstName}|${l.lastName}|${l.phone}|${l.email}`.toLowerCase()));
    let added = 0, skipped = 0;
    for (const l of leads) {
      const key = `${l.firstName}|${l.lastName}|${l.phone}|${l.email}`.toLowerCase();
      if (existing.has(key)) { skipped++; continue; }
      const out = await addLead(l);
      if (out.ok) added++; else skipped++;
    }
    close();
    if (errors.length) toast(`Imported ${added}${skipped ? `, skipped ${skipped}` : ''} — ${errors.length} rows had errors`, 'info');
    else toast(`Imported ${added} leads to the platform${skipped ? `, skipped ${skipped} duplicates` : ''}`);
    window.LeadFlow.navigate('leads');
  };
}

  /* handled in renderMapping onclick — kept for structure */
}

/* ---------- CSV export ---------- */
function exportCSV() {
  const leads = filteredLeads();
  const csv = toCSV(leads.map(l => ({
    firstName: l.firstName, lastName: l.lastName, phone: l.phone, email: l.email,
    company: l.company, source: l.source, serviceInterest: l.serviceInterest,
    estimatedValue: l.estimatedValue ?? '', status: l.status, score: l.score,
    tags: l.tags.join('; '), assignedOwner: l.assignedOwner,
    lastContactAt: l.lastContactAt ? fmtDate(l.lastContactAt) : '',
    nextFollowUpAt: l.nextFollowUpAt ? fmtDate(l.nextFollowUpAt) : '',
    createdAt: fmtDate(l.createdAt)
  })), [
    { key: 'firstName', label: 'First Name' }, { key: 'lastName', label: 'Last Name' },
    { key: 'phone', label: 'Phone' }, { key: 'email', label: 'Email' },
    { key: 'company', label: 'Company' }, { key: 'source', label: 'Source' },
    { key: 'serviceInterest', label: 'Service Interest' }, { key: 'estimatedValue', label: 'Estimated Value' },
    { key: 'status', label: 'Status' }, { key: 'score', label: 'Score' },
    { key: 'tags', label: 'Tags' }, { key: 'assignedOwner', label: 'Owner' },
    { key: 'lastContactAt', label: 'Last Contact' }, { key: 'nextFollowUpAt', label: 'Next Follow-Up' },
    { key: 'createdAt', label: 'Created' }
  ]);
  downloadFile(`vantorx-leads-${new Date().toISOString().slice(0, 10)}.csv`, csv);
  toast(`Exported ${leads.length} leads to CSV`);
}

function toLocalInputValue(iso) {
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

  root.querySelectorAll('.quick-tpl-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tpl = btn.dataset.tpl;
      if (tpl === 'speed') {
        smsInput.value = `Hey ${lead.firstName}, this is Luke with VantorX. Saw your emergency request for ${leadSvc}. Our crew can be on-site in 45 minutes. Are you home right now?`;
      } else if (tpl === 'confirm') {
        smsInput.value = `Hey ${lead.firstName}, confirming our inspection walkthrough for tomorrow at 10:00 AM. Our lead technician will call you 15 minutes before arrival.`;
      } else if (tpl === 'quote') {
        smsInput.value = `Hey ${lead.firstName}, following up on the ${leadValStr} estimate we sent over for ${leadSvc}. Any questions before we lock in materials and schedule your crew?`;
      } else if (tpl === 'review') {
        smsInput.value = `Hey ${lead.firstName}, thank you for trusting our crew with your ${leadSvc}! Could you take 30 seconds to drop us a quick 5-star Google review? https://g.page/r/vantorx-review`;
      }
      smsInput.focus();
    });
  });

  // Send SMS
  root.querySelector('#sendSmsBtn')?.addEventListener('click', async () => {
    const text = smsInput.value.trim();
    if (!text) { toast('Please write a message before sending', 'error'); return; }
    await sendMessage(leadId, text, 'SMS');
    renderProfile(root, leadId);
  });
}
