  <style>
    :root {
      --bg: #000000;
      --card-bg: #0a0a0a;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --lime: #a3e635;
      --amber: #facc15;
      --text: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050505;
      color: var(--text);
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .header-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(163, 230, 53, 0.12);
      border: 1px solid rgba(163, 230, 53, 0.3);
      color: var(--lime);
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 10px var(--lime);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .reel-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      aspect-ratio: 9 / 16;
      background: #000000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000000;
    }

    .controls-bar {
      width: 100%;
      max-width: 440px;
      background: #0d0d0d;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .timeline-scrubber {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      min-width: 45px;
    }

    input[type="range"] {
      flex: 1;
      height: 6px;
      background: #262626;
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 8px var(--lime);
      cursor: pointer;
    }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      background: #1a1a1a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: #262626;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-primary {
      background: var(--lime);
      color: #000000;
      border-color: var(--lime);
    }

    .btn-primary:hover {
      background: #bbf451;
      box-shadow: 0 0 15px rgba(163, 230, 53, 0.4);
    }

    // Helper: Draw Taskless Top HUD Metrics
    function drawTopHUD(t, statLeft, labelRight) {
      const W = 1080;
      ctx.save();

      // Top Left Stat
      ctx.font = '800 48px "Space Grotesk", sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'left';
      ctx.fillText(statLeft, 60, 110);

      // Top Right Monospace Label
      ctx.font = '700 24px "JetBrains Mono", monospace';
      ctx.fillStyle = '#38bdf8'; // glowing cyan
      ctx.textAlign = 'right';
      ctx.fillText(labelRight, W - 60, 105);

      // Subtle horizontal rule
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(60, 140);
      ctx.lineTo(W - 60, 140);
      ctx.stroke();

      ctx.restore();
    }

    // Helper: Draw Kinetic Captions
    function drawCaptions(t) {
      const W = 1080;
      const cap = subtitles.find(c => t >= c.start && t < c.end);
      if (!cap) return;

      ctx.save();
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '800 52px "Space Grotesk", sans-serif';

      // Measure total width
      const words = cap.words;
      const wordSpacings = words.map(w => ctx.measureText(w.w + ' ').width);
      const totalW = wordSpacings.reduce((a, b) => a + b, 0);

      // If text is too wide for one line, wrap it
      let lineWords = [];
      let currentLineWidth = 0;
      let lines = [];

      words.forEach((item, idx) => {
        const w = wordSpacings[idx];
        if (currentLineWidth + w > 940 && lineWords.length > 0) {
          lines.push(lineWords);
          lineWords = [item];
          currentLineWidth = w;
        } else {
          lineWords.push(item);
          currentLineWidth += w;
        }
      });
      if (lineWords.length > 0) lines.push(lineWords);

      // Draw lines centered at y = 1620
      const startY = 1620 - ((lines.length - 1) * 35);

      lines.forEach((line, lIdx) => {
        const lineW = line.reduce((acc, item) => acc + ctx.measureText(item.w + ' ').width, 0);
        let curX = (W / 2) - (lineW / 2);
        const y = startY + (lIdx * 70);

        line.forEach(item => {
          const isActive = (t >= item.s && t < item.e);
          const txt = item.w;
          const wordW = ctx.measureText(txt + ' ').width;

          // Shadow (crisp black drop shadow)
          ctx.save();
          ctx.shadowBlur = 0;
          ctx.shadowColor = 'transparent';
          ctx.fillStyle = 'rgba(0, 0, 0, 0.95)';
          ctx.fillText(txt, curX + (wordW/2) + 2, y + 2);
          ctx.restore();

          // Word color: Active is neon amber, inactive is bright white
          if (isActive) {
            ctx.save();
            ctx.fillStyle = '#facc15';
            ctx.shadowColor = 'rgba(250, 204, 21, 0.65)';
            ctx.shadowBlur = 18;
            ctx.fillText(txt, curX + (wordW/2), y);
            ctx.restore();
          } else {
            ctx.save();
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(txt, curX + (wordW/2), y);
            ctx.restore();
          }

          curX += wordW;
        });
      });

      ctx.restore();
    }

    // --- MAIN RENDER LOOP ---
    function renderFrame(t) {
      const W = 1080;
      const H = 1920;

      // 1. Identity transform reset & Pitch-black void
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);

      // Subtle Taskless technical grid
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let x = 60; x < W; x += 120) {
        ctx.beginPath();
        ctx.moveTo(x, 140);
        ctx.lineTo(x, H - 240);
        ctx.stroke();
      }
      for (let y = 200; y < H - 240; y += 120) {
        ctx.beginPath();
        ctx.moveTo(60, y);
        ctx.lineTo(W - 60, y);
        ctx.stroke();
      }
      ctx.restore();

      // ==========================================
      // SCENE 1 (0.0s - 6.5s): 20 JUNK SETS VS 2 SETS FAILURE
      // ==========================================
      if (t < 6.5) {
        const p = t / 6.5;
        drawTopHUD(t, '20 SETS VS 2 SETS', '// MECHANICAL TENSION RATIO');

        // Main comparison graph
        const originX = 160;
        const originY = 1250;
        const graphW = 760;
        const graphH = 680;

        // Axes
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(originX, originY - graphH);
        ctx.lineTo(originX, originY);
        ctx.lineTo(originX + graphW, originY);
        ctx.stroke();

        // Axis Labels
        ctx.font = '700 22px "JetBrains Mono", monospace';
        ctx.fillStyle = '#94a3b8';
        ctx.textAlign = 'right';
        ctx.fillText('STIMULUS %', originX - 15, originY - graphH + 30);
        ctx.textAlign = 'center';
        ctx.fillText('SETS PERFORMED', originX + graphW / 2, originY + 50);

        // Curve 1: 20 Junk Sets (Rises then flatlines / Cortisol spikes)
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 6;
        ctx.beginPath();
        for (let i = 0; i <= 20; i++) {
          const gx = originX + (i / 20) * graphW;
          // Stimulus plateaus at set 3-4, then systemic fatigue overwhelms
          const stimulus = Math.min(0.65, (i / 5) * 0.65) - (i > 6 ? (i - 6) * 0.025 : 0);
          const gy = originY - stimulus * graphH;
          if (i === 0) ctx.moveTo(gx, gy);
          else ctx.lineTo(gx, gy);
        }
        ctx.stroke();

        // Curve 2: 2 Sets to True Failure (Peaks straight to 100% stimulus)
        const progressX = Math.min(1, t / 3.5);
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 8;
        ctx.beginPath();
        for (let i = 0; i <= 4; i++) {
          const frac = i / 4;
          if (frac > progressX) break;
          const gx = originX + (i / 20) * graphW;
          const stimulus = Math.min(0.96, (i / 2) * 0.95);
          const gy = originY - stimulus * graphH;
          if (i === 0) ctx.moveTo(gx, gy);
          else ctx.lineTo(gx, gy);
        }
        ctx.stroke();

        // Stat Callout Cards
        ctx.save();
        // Red Junk Set Warning Card
        ctx.fillStyle = 'rgba(239, 68, 68, 0.08)';
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(140, 260, 380, 210, 16);
        ctx.fill();
        ctx.stroke();

        ctx.font = '800 28px "Space Grotesk"';
        ctx.fillStyle = '#ef4444';
        ctx.textAlign = 'left';
        ctx.fillText('20 JUNK SETS', 170, 310);
        ctx.font = '600 20px "JetBrains Mono"';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('• 2.5 Hrs in Gym', 170, 360);
        ctx.fillText('• High Joint Wear', 170, 400);
        ctx.fillStyle = '#f87171';
        ctx.fillText('• 60% Junk Fatigue', 170, 440);

        // Green 2-Set Card
        ctx.fillStyle = 'rgba(16, 185, 129, 0.08)';
        ctx.strokeStyle = 'rgba(16, 185, 129, 0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(560, 260, 380, 210, 16);
        ctx.fill();
        ctx.stroke();

        ctx.font = '800 28px "Space Grotesk"';
        ctx.fillStyle = '#10b981';
        ctx.fillText('2-SET FAILURE', 590, 310);
        ctx.font = '600 20px "JetBrains Mono"';

    // --- CONTROLLER LOGIC ---
    function formatTime(s) {
      const mins = Math.floor(s / 60);
      const secs = Math.floor(s % 60);
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function update() {
      if (isPlaying) {
        currentTime = audio.currentTime;
        if (currentTime >= TOTAL_DURATION) {
          currentTime = TOTAL_DURATION;
          pause();
        }
        timeSlider.value = currentTime;
        timeCurrent.textContent = formatTime(currentTime);
      }
      renderFrame(currentTime);
      if (isPlaying) {
        animFrameId = requestAnimationFrame(update);
      }
    }

    function play() {
      isPlaying = true;
      playBtn.textContent = '⏸ Pause';
      audio.play();
      animFrameId = requestAnimationFrame(update);
    }

    function pause() {
      isPlaying = false;
      playBtn.textContent = '▶ Play';
      audio.pause();
      if (animFrameId) cancelAnimationFrame(animFrameId);
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) pause();
      else play();
    });

    restartBtn.addEventListener('click', () => {
      pause();
      currentTime = 0;
      audio.currentTime = 0;
      timeSlider.value = 0;
      timeCurrent.textContent = '00:00';
      renderFrame(0);
    });

    timeSlider.addEventListener('input', (e) => {
      currentTime = parseFloat(e.target.value);
      audio.currentTime = currentTime;
      timeCurrent.textContent = formatTime(currentTime);
      renderFrame(currentTime);
    });

    document.getElementById('jumpBeforeAfter').addEventListener('click', () => {
      currentTime = 8.5;
      audio.currentTime = 8.5;
      timeSlider.value = 8.5;
      timeCurrent.textContent = formatTime(8.5);
      renderFrame(8.5);
    });

    document.getElementById('jumpCta').addEventListener('click', () => {
      currentTime = 56.0;
      audio.currentTime = 56.0;
      timeSlider.value = 56.0;
      timeCurrent.textContent = formatTime(56.0);
      renderFrame(56.0);
    });

    // Initial draw
    window.addEventListener('load', () => {
      renderFrame(0);
    });
    setTimeout(() => renderFrame(0), 200);
  </script>
</body>
</html>
