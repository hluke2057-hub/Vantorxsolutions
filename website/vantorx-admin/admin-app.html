<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VantorX Admin — Internal Operations Console</title>
<style>/* ============================================================
   VANTORX CLIENT HUB — styles.css
   Premium dark SaaS design system (shared VantorX tokens)
   ============================================================ */

:root {
  --bg: #0a0a0d;
  --bg-soft: #101014;
  --bg-card: #14141a;
  --bg-hover: #1b1b22;
  --border: rgba(255, 255, 255, 0.08);
  --border-soft: rgba(255, 255, 255, 0.05);
  --gold: #d4af37;
  --gold-bright: #f0d060;
  --gold-dim: rgba(212, 175, 55, 0.14);
  --text: #f0efe9;
  --text-soft: #a8a699;
  --text-dim: #6d6b60;
  --green: #4ade80;
  --green-dim: rgba(74, 222, 128, 0.12);
  --blue: #60a5fa;
  --blue-dim: rgba(96, 165, 250, 0.12);
  --purple: #a78bfa;
  --purple-dim: rgba(167, 139, 250, 0.12);
  --red: #f87171;
  --red-dim: rgba(248, 113, 113, 0.12);
  --orange: #fbbf24;
  --orange-dim: rgba(251, 191, 36, 0.12);
  --teal: #2dd4bf;
  --teal-dim: rgba(45, 212, 191, 0.12);
  --radius: 12px;
  --radius-lg: 16px;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  --font-display: 'Sora', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;
  --sidebar-w: 248px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

::selection { background: var(--gold-dim); color: var(--gold-bright); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }

/* ============================================================
   APP SHELL
   ============================================================ */

.app { display: flex; height: 100vh; overflow: hidden; }

.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--bg-soft);
  border-right: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  padding: 18px 14px;
  gap: 4px;
  z-index: 40;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 18px;
  user-select: none;
}
.brand-mark {
  width: 34px; height: 34px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--gold) 0%, #9a7b1f 100%);
  display: grid; place-items: center;
  color: #0a0a0d;
  font-weight: 800;
  font-family: var(--font-display);
  font-size: 0.95rem;
  box-shadow: 0 0 18px rgba(212, 175, 55, 0.35);
}
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.06em; }
.brand-name .gold { color: var(--gold-bright); }
.brand-sub { font-size: 0.68rem; color: var(--text-dim); letter-spacing: 0.14em; text-transform: uppercase; }

.nav-section-label {
  font-size: 0.66rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 12px 10px 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 12px;
  border-radius: 9px;
  color: var(--text-soft);
  text-decoration: none;
  border: 1px solid transparent;
  transition: background 0.15s var(--ease), color 0.15s var(--ease);
  background: none;
  width: 100%;
  text-align: left;
  font-size: 0.88rem;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active {
  background: var(--gold-dim);
  color: var(--gold-bright);
  border-color: rgba(212, 175, 55, 0.25);
}
.nav-item .ico { width: 20px; text-align: center; font-size: 1rem; }
.nav-item .nav-badge {
  margin-left: auto;
  background: var(--gold);
  color: #0a0a0d;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 99px;
}
.nav-item .nav-badge.red { background: var(--red); color: #fff; }

.sidebar-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.sidebar-biz {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-card);
  cursor: pointer;
  transition: border-color 0.15s var(--ease);
}
.sidebar-biz:hover { border-color: rgba(212, 175, 55, 0.4); }
.biz-avatar {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--gold-dim);
  color: var(--gold-bright);
  display: grid; place-items: center;
  font-weight: 700; font-size: 0.8rem;
}
.biz-name { font-size: 0.82rem; font-weight: 600; }
.biz-plan { font-size: 0.68rem; color: var(--text-dim); }
.biz-caret { margin-left: auto; color: var(--text-dim); font-size: 0.7rem; }

.demo-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border-radius: 99px;
  border: 1px solid rgba(251, 191, 36, 0.35);
  background: var(--orange-dim);
  color: var(--orange);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  width: fit-content;
}
.demo-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--orange); animation: pulse-dot 2s infinite; }
@keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

/* ---------- topbar ---------- */

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.topbar {
  height: 58px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 22px;
  border-bottom: 1px solid var(--border-soft);
  background: rgba(10, 10, 13, 0.8);
  backdrop-filter: blur(12px);
  z-index: 30;
}
.topbar-title { font-family: var(--font-display); font-weight: 600; font-size: 1rem; }
.topbar-spacer { flex: 1; }

.icon-btn {
  position: relative;
  width: 36px; height: 36px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-soft);
  display: grid; place-items: center;
  font-size: 1rem;
  transition: all 0.15s var(--ease);
}
.icon-btn:hover { color: var(--gold-bright); border-color: rgba(212, 175, 55, 0.4); }
.icon-btn .dot-badge {
  position: absolute; top: 6px; right: 6px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--red);
  border: 2px solid var(--bg-soft);
  display: none;
}
.icon-btn .dot-badge.show { display: block; }

.topbar-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 7px 12px;
  width: 300px;
  color: var(--text-dim);
}
.topbar-search input {
  background: none; border: none; outline: none;
  color: var(--text);
  width: 100%;
  font-size: 0.85rem;
}
.topbar-search kbd {
  font-family: inherit;
  font-size: 0.66rem;
  color: var(--text-dim);
  border: 1px solid var(--border);
  padding: 1px 6px;
  border-radius: 5px;
}

.avatar-btn {
  display: flex; align-items: center; gap: 9px;
  padding: 5px 10px 5px 6px;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  transition: border-color 0.15s var(--ease);
}
.avatar-btn:hover { border-color: rgba(212, 175, 55, 0.4); }
.avatar-circle {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), #9a7b1f);
  color: #0a0a0d;
  display: grid; place-items: center;
  font-weight: 800; font-size: 0.72rem;
}
.avatar-name { font-size: 0.8rem; font-weight: 600; }
.avatar-caret { color: var(--text-dim); font-size: 0.65rem; }

.content {
  flex: 1;
  overflow-y: auto;
  padding: 26px 28px 60px;

}
.page { max-width: 1200px; margin: 0 auto; animation: page-in 0.3s var(--ease); }
@keyframes page-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.page-head { margin-bottom: 22px; }
.page-title { font-family: var(--font-display); font-size: 1.45rem; font-weight: 700; letter-spacing: -0.01em; }
.page-sub { color: var(--text-soft); font-size: 0.9rem; margin-top: 4px; }

/* ============================================================
   COMPONENTS
   ============================================================ */

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
}
.card-title {
  font-size: 0.95rem;
  font-weight: 700;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title .link { margin-left: auto; }

.link-btn {
  background: none; border: none;
  color: var(--gold);
  font-size: 0.8rem;
  font-weight: 600;
  padding: 2px 4px;
  border-radius: 6px;
  transition: color 0.15s;
}
.link-btn:hover { color: var(--gold-bright); text-decoration: underline; }

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 15px;
  border-radius: 9px;
  font-size: 0.84rem;
  font-weight: 600;
  border: 1px solid transparent;
  transition: all 0.15s var(--ease);
  text-decoration: none;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-gold { background: linear-gradient(135deg, var(--gold), #b8942a); color: #0a0a0d; }
.btn-gold:hover:not(:disabled) { filter: brightness(1.12); box-shadow: 0 4px 18px rgba(212, 175, 55, 0.3); }
.btn-ghost { background: var(--bg-card); border-color: var(--border); color: var(--text-soft); }
.btn-ghost:hover:not(:disabled) { color: var(--text); border-color: rgba(255,255,255,0.2); }
.btn-sm { padding: 5px 11px; font-size: 0.78rem; border-radius: 8px; }
.btn-red { background: var(--red-dim); color: var(--red); border-color: rgba(248, 113, 113, 0.3); }
.btn-red:hover:not(:disabled) { background: rgba(248, 113, 113, 0.2); }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 0.72rem;
  font-weight: 600;
  background: var(--bg-hover);
  border: 1px solid var(--border);
  color: var(--text-soft);
}

.status-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 0.72rem;
  font-weight: 700;
}
.status-pill .sdot { width: 6px; height: 6px; border-radius: 50%; }
.status-green { background: var(--green-dim); color: var(--green); }
.status-green .sdot { background: var(--green); }
.status-gold { background: var(--gold-dim); color: var(--gold-bright); }
.status-gold .sdot { background: var(--gold-bright); }
.status-blue { background: var(--blue-dim); color: var(--blue); }
.status-blue .sdot { background: var(--blue); }
.status-purple { background: var(--purple-dim); color: var(--purple); }
.status-purple .sdot { background: var(--purple); }
.status-red { background: var(--red-dim); color: var(--red); }
.status-red .sdot { background: var(--red); }
.status-orange { background: var(--orange-dim); color: var(--orange); }
.status-orange .sdot { background: var(--orange); }
.status-dim { background: var(--bg-hover); color: var(--text-dim); }
.status-dim .sdot { background: var(--text-dim); }

/* ---------- KPI grid ---------- */

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 22px;
}
.kpi {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 15px 16px;
  transition: border-color 0.2s var(--ease), transform 0.2s var(--ease);
}
.kpi:hover { border-color: rgba(212, 175, 55, 0.3); transform: translateY(-2px); }
.kpi-label { font-size: 0.72rem; color: var(--text-dim); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
.kpi-value { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; margin-top: 5px; }
.kpi-hint { font-size: 0.72rem; color: var(--text-soft); margin-top: 2px; }
.kpi.accent-gold { border-color: rgba(212, 175, 55, 0.35); }

/* ---------- tables ---------- */

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th {
  text-align: left;
  font-size: 0.68rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  font-weight: 600;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td { padding: 10px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr { transition: background 0.12s; }
tbody tr:hover { background: var(--bg-hover); }
tr[data-clickable] { cursor: pointer; }

.cell-main { font-weight: 600; }
.cell-dim { color: var(--text-dim); font-size: 0.78rem; }

.score-bar { width: 54px; height: 5px; background: var(--bg-hover); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 7px; }
.score-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-bright)); border-radius: 3px; }

/* ---------- lists ---------- */

.list-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 4px;
  border-bottom: 1px solid var(--border-soft);
}
.list-row:last-child { border-bottom: none; }
.row-ico {
  width: 34px; height: 34px;
  border-radius: 9px;
  display: grid; place-items: center;
  font-size: 0.95rem;
  flex-shrink: 0;
}
.row-main { min-width: 0; flex: 1; }
.row-title { font-size: 0.86rem; font-weight: 600; }
.row-sub { font-size: 0.76rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-time { font-size: 0.72rem; color: var(--text-dim); white-space: nowrap; }

/* ---------- forms ---------- */

.form-group { margin-bottom: 15px; }
.form-label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-soft); margin-bottom: 6px; }
.form-label .req { color: var(--gold); }
.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
  padding: 9px 12px;
  font-size: 0.86rem;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: rgba(212, 175, 55, 0.5);
  box-shadow: 0 0 0 3px var(--gold-dim);
}
.form-textarea { resize: vertical; min-height: 110px; }
.form-hint { font-size: 0.74rem; color: var(--text-dim); margin-top: 5px; }
.form-error { color: var(--red); font-size: 0.76rem; margin-top: 5px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

.toggle {
  position: relative;
  width: 40px; height: 22px;
  background: var(--bg-hover);
  border: 1px solid var(--border);
  border-radius: 99px;
  cursor: pointer;
  transition: background 0.2s var(--ease);
  flex-shrink: 0;
}
.toggle::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--text-soft);
  transition: transform 0.2s var(--ease), background 0.2s;
}
.toggle.on { background: var(--gold-dim); border-color: rgba(212, 175, 55, 0.4); }
.toggle.on::after { transform: translateX(18px); background: var(--gold-bright); }

/* ---------- tabs ---------- */

.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 18px;
  overflow-x: auto;
}
.tab {
  background: none;
  border: none;
  color: var(--text-soft);
  padding: 9px 14px;
  font-size: 0.84rem;
  font-weight: 600;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
  transition: color 0.15s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--gold-bright); border-bottom-color: var(--gold); }
.tab .tab-count { font-size: 0.7rem; color: var(--text-dim); margin-left: 5px; }

.filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.select-input {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
  padding: 8px 12px;
  font-size: 0.82rem;
  outline: none;
}
.select-input:focus { border-color: rgba(212, 175, 55, 0.5); }
.search-input {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
  padding: 8px 12px;
  font-size: 0.82rem;
  outline: none;
  min-width: 220px;
}
.search-input:focus { border-color: rgba(212, 175, 55, 0.5); }
.result-count { font-size: 0.78rem; color: var(--text-dim); margin-left: auto; }

.seg {
  display: inline-flex;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 3px;
  gap: 2px;
}
.seg button {
  background: none; border: none;
  color: var(--text-soft);
  padding: 6px 13px;
  border-radius: 7px;
  font-size: 0.78rem;
  font-weight: 600;
  transition: all 0.15s;
}
.seg button.active { background: var(--gold-dim); color: var(--gold-bright); }

/* ---------- modal / drawer ---------- */

.modal-overlay, .drawer-overlay {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(3px);
  z-index: 100;
  animation: fade-in 0.18s var(--ease);
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

.modal {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(560px, calc(100vw - 40px));
  max-height: min(82vh, 720px);
  overflow-y: auto;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  z-index: 101;
  animation: modal-in 0.22s var(--ease);
}
@keyframes modal-in { from { opacity: 0; transform: translate(-50%, -48%) scale(0.97); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
.modal-head {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
  background: var(--bg-card);
  z-index: 2;
}
.modal-title { font-family: var(--font-display); font-weight: 700; font-size: 1rem; }
.modal-body { padding: 20px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 9px; }
.modal-x { margin-left: auto; }

.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(480px, 94vw);
  background: var(--bg-card);
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow);
  z-index: 101;
  display: flex;
  flex-direction: column;
  animation: drawer-in 0.24s var(--ease);
}
@keyframes drawer-in { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
.drawer-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 9px; justify-content: flex-end; }

/* ---------- toast ---------- */

.toast-zone { position: fixed; bottom: 22px; right: 22px; display: flex; flex-direction: column; gap: 9px; z-index: 200; }
.toast {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--gold);
  border-radius: 10px;
  padding: 11px 16px;
  font-size: 0.84rem;
  box-shadow: var(--shadow);
  animation: toast-in 0.25s var(--ease);
  max-width: 380px;
}
.toast.success { border-left-color: var(--green); }
.toast.error { border-left-color: var(--red); }
.toast.info { border-left-color: var(--blue); }
.toast.leaving { animation: toast-out 0.25s var(--ease) forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }

/* ---------- empty / skeleton ---------- */

function esc(s) {
  return String(s ?? '')
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;').replaceAll("'", '&#39;');
}

function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}

function fmtDateTime(iso) {
  return `${fmtDate(iso)} · ${fmtTime(iso)}`;
}

function fmtDuration(sec) {
  if (sec == null) return '—';
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}m ${String(s).padStart(2, '0')}s`;
}

function relTime(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const min = Math.round(diff / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return `${min}m ago`;
  const h = Math.round(min / 60);
  if (h < 24) return `${h}h ago`;
  const d = Math.round(h / 24);
  if (d < 7) return `${d}d ago`;
  return fmtDate(iso);
}

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };

function uid(prefix = 'id') {
  return `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;

/* Deterministic PRNG so demo data is stable across reloads until edited */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

function groupBy(arr, keyFn) {
  return arr.reduce((acc, item) => {
    const k = keyFn(item);
    (acc[k] = acc[k] || []).push(item);
    return acc;
  }, {});
}

function monthLabel(y, m) {

}

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

/* ---- js/realapi.js ---- */
/* ============================================================
   VANTORX ADMIN — realapi.js
   The ONLY data layer of the admin console. Every page talks to
   the platform server (same origin, cookie session). There is no
   demo store: if the server is unreachable, pages show an honest
   error — they never fall back to fake data.
   ============================================================ */

async function api(method, path, body) {
  let res;
  try {
    res = await fetch(path, {
      method,
      credentials: 'same-origin',
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch {
    return { status: 0, error: 'Platform backend not reachable. Please check your connection and reload.' };
  }
  let data = {};
  try { data = await res.json(); } catch { /* empty body */ }
  if (!res.ok) return { status: res.status, error: data.error || `HTTP ${res.status}`, ...data };
  return { status: res.status, ...data };
}

const getMe = () => api('GET', '/api/auth/me');
const login = (email, password) => api('POST', '/api/auth/login', { email, password });
const logout = () => api('POST', '/api/auth/logout', {});

/* ---------- toast ---------- */

let toastZone;
function ensureToastZone() {
  if (!toastZone) {
    toastZone = document.createElement('div');
    toastZone.className = 'toast-zone';
    document.body.appendChild(toastZone);
  }
  return toastZone;
}

function toast(msg, kind = 'success') {
  const zone = ensureToastZone();
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  const icon = kind === 'success' ? '✓' : kind === 'error' ? '✕' : 'ℹ';
  el.innerHTML = `<span style="font-weight:800;color:var(--gold-bright)">${icon}</span><span>${esc(msg)}</span>`;
  zone.appendChild(el);
  setTimeout(() => {
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 260);
  }, 3400);
}

/* ---------- modal / drawer ----------
   onOpen fires after the caller has received { close } so callbacks
   can safely reference close (avoids TDZ issues). */

function openModal({ title, body, footer, onOpen, wide }) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const modal = document.createElement('div');
  modal.className = 'modal';
  if (wide) modal.style.width = 'min(720px, calc(100vw - 40px))';
  modal.innerHTML = `
    <div class="modal-head">
      <div class="modal-title">${title}</div>
      <button class="icon-btn modal-x" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">${body}</div>
    ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
  `;
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  const api = { overlay, modal };
  let closeFn = () => {};
  api.close = () => closeFn();

  closeFn = () => { overlay.remove(); document.removeEventListener('keydown', onKey); };
  function onKey(e) { if (e.key === 'Escape') closeFn(); }
  document.addEventListener('keydown', onKey);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeFn(); });
  modal.querySelector('.modal-x').addEventListener('click', closeFn);

  if (onOpen) queueMicrotask(() => onOpen(api));
  return api;
}

function openDrawer({ title, body, footer, onOpen }) {
  const overlay = document.createElement('div');
  overlay.className = 'drawer-overlay';
  const drawer = document.createElement('div');
  drawer.className = 'drawer';
  drawer.innerHTML = `
    <div class="drawer-head">
      <div class="modal-title">${title}</div>
      <button class="icon-btn modal-x" aria-label="Close">✕</button>
    </div>
    <div class="drawer-body">${body}</div>
    ${footer ? `<div class="drawer-foot">${footer}</div>` : ''}
  `;
  overlay.appendChild(drawer);
  document.body.appendChild(overlay);

  let closeFn = () => {};
  const api = { overlay, drawer, close: () => closeFn() };

  closeFn = () => { overlay.remove(); document.removeEventListener('keydown', onKey); };
  function onKey(e) { if (e.key === 'Escape') closeFn(); }
  document.addEventListener('keydown', onKey);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeFn(); });
  drawer.querySelector('.modal-x').addEventListener('click', closeFn);

  if (onOpen) queueMicrotask(() => onOpen(api));
  return api;
}

function confirmDialog({ title = 'Are you sure?', message = '', confirmText = 'Confirm', danger = false }) {
  return new Promise(resolve => {
    const m = openModal({
      title,
      body: `<p style="color:var(--text-soft);font-size:0.9rem">${esc(message)}</p>`,
      footer: `
        <button class="btn btn-ghost" data-c="no">Cancel</button>
        <button class="btn ${danger ? 'btn-red' : 'btn-gold'}" data-c="yes">${esc(confirmText)}</button>`,
      onOpen: ({ modal, close }) => {
        modal.querySelector('[data-c="no"]').addEventListener('click', () => { close(); resolve(false); });
        modal.querySelector('[data-c="yes"]').addEventListener('click', () => { close(); resolve(true); });
      },
    });
    const origClose = m.close;
    // resolve(false) if dismissed via X / overlay / Escape
    const obs = new MutationObserver(() => {
      if (!document.body.contains(m.overlay)) { obs.disconnect(); resolve(false); }
    });
    obs.observe(document.body, { childList: true });
    m.close = () => origClose();
  });
}

/* ============================================================
   VANTORX ADMIN — pages/connect.js
   BUSINESS CONNECT — the production onboarding path.
   Import → validate → review/dedupe → approve → provision →
   go-live. Talks to the real platform server (same origin,
   cookie session). NO demo data, NO localStorage truth:
   the server state machine is the only source of truth.
   All identifiers are Cx/cx-prefixed (single-file bundle is

   ============================================================ */

/* ---------------- api helper (same-origin, cookie session) ---------------- */

async function cxApi(method, path, body) {
  let res;
  try {
    res = await fetch(path, {
      method,
      credentials: 'same-origin',
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch {
    return { status: 0, error: 'Platform server not reachable. Start platform/server.ps1 and reload.' };
  }
  let data = {};
  try { data = await res.json(); } catch { /* empty body */ }
  if (!res.ok) return { status: res.status, error: data.error || `HTTP ${res.status}`, ...data };
  return { status: res.status, ...data };
}

/* ---------------- shared bits ---------------- */

function cxStatePill(state) {
  const map = {
    importing: 'status-dim', mapped: 'status-dim',
    validated: 'status-blue', approved: 'status-gold',
    provisioning: 'status-orange', ready_for_go_live: 'status-green', active: 'status-green',
    validation_failed: 'status-red', duplicate_review: 'status-orange',
    provisioning_partial: 'status-red', verification_failed: 'status-red', cancelled: 'status-dim',
  };
  const label = String(state || '').replace(/_/g, ' ');
  return `<span class="status-pill ${map[state] || 'status-dim'}"><span class="sdot"></span>${esc(label)}</span>`;
}

function cxSteps(state) {
  const order = ['import', 'validate', 'review', 'provision', 'golive'];
  let activeIdx = 1;
  switch (state) {
    case 'importing': case 'mapped': activeIdx = 0; break;
    case 'validation_failed': activeIdx = 1; break;
    case 'validated': case 'duplicate_review': activeIdx = 2; break;
    case 'approved': case 'provisioning': case 'provisioning_partial': case 'verification_failed': activeIdx = 3; break;
    case 'ready_for_go_live': activeIdx = 4; break;
    case 'active': activeIdx = 5; break;
    default: activeIdx = 1;
  }
  return `<div class="cx-steps">${order.map((s, i) => `
    <div class="cx-step ${i < activeIdx ? 'done' : ''} ${i === activeIdx && state !== 'active' ? 'now' : ''}">
      <span class="cx-step-n">${i < activeIdx || state === 'active' ? '✓' : i + 1}</span>
      <span>${s}</span>
    </div>`).join('<span class="cx-step-arrow">→</span>')}</div>`;
}

function cxIssueRows(issues) {
  if (!issues || !issues.length) return '';
  return `<div class="table-wrap"><table>

    <tbody>${issues.map(i => `
      <tr>
        <td><span class="status-pill ${i.severity === 'error' ? 'status-red' : 'status-orange'}"><span class="sdot"></span>${esc(i.severity)}</span></td>

}

        <td>${m.tenantId ? `<code>${esc(m.tenantId)}</code>` : '<span class="cell-dim">—</span>'}</td>
        <td class="cell-dim">${relTime(m.updatedAt)}</td>
        <td><button class="btn btn-ghost btn-sm" data-open="${esc(m.id)}">Open</button></td>
      </tr>`).join('')}</tbody></table></div>`;

  body.querySelectorAll('[data-imp]').forEach(tr => tr.addEventListener('click', () => {
    cxView = { name: 'detail', id: tr.dataset.imp };
    cxRenderDetail(root);
  }));
}


/* ---------------- sales inquiries (from the public website) ---------------- */

async function cxLoadInquiries(root) {
  const body = root.querySelector('#cxInqBody');
  if (!body) return;
  const r = await cxApi('GET', '/api/admin/inquiries');
  if (r.error) { body.innerHTML = `<div class="cell-dim" style="padding:8px 2px">${esc(r.error)}</div>`; return; }
  const rows = (r.inquiries || []).filter(q => q.status === 'new' || q.status === 'contacted');
  if (!rows.length) { body.innerHTML = `<div class="cell-dim" style="padding:8px 2px">No open inquiries. New website submissions appear here.</div>`; return; }
  body.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>When</th><th>Who</th><th>Interested in</th><th>Message</th><th></th></tr></thead>
    <tbody>${rows.slice(0, 15).map(q => `
      <tr>
        <td class="cell-dim">${relTime(q.createdAt)}<div>${esc(q.kind)}</div></td>
        <td><span class="cell-main">${esc(q.name)}</span><div class="cell-dim">${esc(q.business || '')} · ${esc(q.email)}${q.phone ? ' · ' + esc(q.phone) : ''}</div></td>
        <td class="cell-dim">${esc((q.interests || []).join(', ') || q.industry || '')}</td>
        <td class="cell-dim" style="max-width:280px">${esc((q.message || '').slice(0, 140))}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-gold btn-sm" data-inq-start="${esc(q.id)}">Start client setup</button>
          <button class="btn btn-ghost btn-sm" data-inq-done="${esc(q.id)}">Dismiss</button>
        </td>
      </tr>`).join('')}</tbody></table></div>`;
  body.querySelectorAll('[data-inq-start]').forEach(b => b.addEventListener('click', async () => {
    const q = rows.find(x => x.id === b.dataset.inqStart);
    await cxApi('PATCH', '/api/admin/inquiries/' + q.id, { status: 'contacted' });
    cxOpenAddClient(root, q);
  }));
  body.querySelectorAll('[data-inq-done]').forEach(b => b.addEventListener('click', async () => {
    await cxApi('PATCH', '/api/admin/inquiries/' + b.dataset.inqDone, { status: 'lost' });
    cxLoadInquiries(root);
  }));
}

/* ---------------- + Add New Client (guided provisioning form) ----------------
   Builds a schema 1.0 envelope and feeds the SAME server pipeline as a pasted import
   (validate -> review -> provision -> readiness -> go-live). Nothing is written to a tenant here. */

function cxOpenAddClient(root, inq) {
  const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const hoursRows = days.map((d, i) => {
    const closed = (i === 0 || i === 6);
    return `<tr><td style="padding:3px 8px 3px 0">${d}</td>
      <td><input type="time" id="cxH${i}o" value="09:00" ${closed ? 'disabled' : ''}></td>
      <td><input type="time" id="cxH${i}c" value="17:00" ${closed ? 'disabled' : ''}></td>
      <td><label style="display:flex;gap:5px;align-items:center"><input type="checkbox" id="cxH${i}x" ${closed ? 'checked' : ''}> closed</label></td></tr>`;
  }).join('');
  const tz = ['America/New_York', 'America/Chicago', 'America/Denver', 'America/Phoenix', 'America/Los_Angeles', 'America/Anchorage', 'Pacific/Honolulu'];
  openModal({
    title: 'Add New Client',
    wide: true,
    body: `
      <p class="cell-dim" style="margin:0 0 10px;font-size:0.82rem">Enter what you know now. Everything is validated and reviewed before anything is created — and the client stays <strong>not live</strong> until all readiness checks pass and you click GO LIVE.</p>
      <div class="cx-form-row"><strong>1 · Business</strong></div>
      <div class="cx-form-row"><label>Business name *</label><input id="cxAcName" type="text" value="${esc(inq ? inq.business : '')}" placeholder="Lakeside Barbers"></div>
      <div class="cx-form-row"><label>Industry *</label><input id="cxAcInd" type="text" value="${esc(inq ? inq.industry : '')}" placeholder="Barber / Salon / Dental / Detailing…"></div>
      <div class="cx-form-row"><label>Business phone *</label><input id="cxAcPhone" type="text" value="${esc(inq ? inq.phone : '')}" placeholder="(813) 555-0100"></div>
      <div class="cx-form-row"><label>Business email *</label><input id="cxAcEmail" type="text" value="${esc(inq ? inq.email : '')}"></div>
      <div class="cx-form-row"><label>Website</label><input id="cxAcWeb" type="text" value="${esc(inq ? inq.website : '')}"></div>
      <div class="cx-form-row"><label>City</label><input id="cxAcCity" type="text"></div>
      <div class="cx-form-row"><label>Time zone</label><select id="cxAcTz">${tz.map(z => `<option ${z === 'America/New_York' ? 'selected' : ''}>${z}</option>`).join('')}</select></div>
      <div class="cx-form-row"><strong>2 · Hours</strong></div>
      <table style="font-size:0.82rem">${hoursRows}</table>
      <div class="cx-form-row"><strong>3 · Services</strong> <span class="cell-dim">one per line: name | minutes | price in dollars</span>
        <textarea id="cxAcSvc" rows="5" placeholder="Haircut | 30 | 35&#10;Beard trim | 15 | 15"></textarea></div>
      <div class="cx-form-row"><strong>4 · Business knowledge / FAQs</strong> <span class="cell-dim">one per line: question | answer (policies, parking, payment, etc.)</span>
        <textarea id="cxAcKb" rows="5" placeholder="Do you take walk-ins? | Yes, when the schedule allows."></textarea></div>
      <div class="cx-form-row"><strong>5 · AI receptionist</strong></div>
      <div class="cx-form-row"><label>Receptionist name</label><input id="cxAcRxName" type="text" value="Ava"></div>
      <div class="cx-form-row"><label>Greeting</label><input id="cxAcRxGreet" type="text" placeholder="Thanks for calling … how can I help?"></div>
      <div class="cx-form-row"><strong>6 · Client login (owner)</strong></div>
      <div class="cx-form-row"><label>Owner email *</label><input id="cxAcOwner" type="text" value="${esc(inq ? inq.email : '')}"></div>
      <div class="cx-form-row"><label><input type="checkbox" id="cxAcCal"> Connect Google Calendar (completed later under Connections)</label></div>
      <div id="cxAcErr" style="margin-top:10px"></div>`,
    footer: `<button class="btn btn-ghost" data-cx-cancel>Cancel</button>
             <button class="btn btn-gold" data-cx-create>Create client setup</button>`,
    onOpen: ({ modal, close }) => {
      const q = (id) => modal.querySelector('#' + id);
      days.forEach((d, i) => q(`cxH${i}x`).addEventListener('change', () => {
        q(`cxH${i}o`).disabled = q(`cxH${i}c`).disabled = q(`cxH${i}x`).checked;
      }));
      modal.querySelector('[data-cx-cancel]').addEventListener('click', close);
      modal.querySelector('[data-cx-create]').addEventListener('click', async () => {
        const err = q('cxAcErr'); err.innerHTML = '';
        const name = q('cxAcName').value.trim();
        const owner = q('cxAcOwner').value.trim();
        if (!name || !q('cxAcInd').value.trim() || !q('cxAcPhone').value.trim() || !q('cxAcEmail').value.trim() || !owner) {
          err.innerHTML = cxErrBanner('Business name, industry, business phone, business email and owner email are required.'); return;
        }
        const hours = days.map((d, i) => q(`cxH${i}x`).checked
          ? { weekday: i, closed: true }
          : { weekday: i, open: q(`cxH${i}o`).value, close: q(`cxH${i}c`).value });
        const services = q('cxAcSvc').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
          const [n, m, p] = l.split('|').map(x => (x || '').trim());
          const svc = { name: n, duration_minutes: parseInt(m, 10) || 30 };
          const price = parseFloat((p || '').replace(/[^0-9.]/g, ''));
          if (!isNaN(price)) svc.price_minor = Math.round(price * 100);
          return svc;
        });
        const knowledge = q('cxAcKb').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
          const [a, ...rest] = l.split('|');
          return { kind: 'faq', title: (a || '').trim(), content: rest.join('|').trim() };
        }).filter(k => k.title && k.content);
        const envelope = {
          schema_version: '1.0',
          source: { system: 'manual', external_business_key: name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') },
          business: {
            display_name: name, legal_name: name, industry: q('cxAcInd').value.trim(),
            timezone: q('cxAcTz').value, phone: q('cxAcPhone').value.trim(),
            email: q('cxAcEmail').value.trim() || undefined, website: q('cxAcWeb').value.trim() || undefined,
            currency: 'USD', address: { city: q('cxAcCity').value.trim() || undefined }, hours,
          },
          services,
          users: [{ email: owner, role: 'business_owner' }],
          receptionist: { name: q('cxAcRxName').value.trim() || 'Ava', greeting: q('cxAcRxGreet').value.trim() || undefined, enabled: false },
          knowledge,
          integrations: q('cxAcCal').checked ? [{ provider: 'google_calendar' }] : [],
        };
        const r = await cxApi('POST', '/api/admin/connect/imports', { envelope: JSON.stringify(envelope), filename: `${name} (guided form)` });
        if (r.error && !r.import) { err.innerHTML = cxErrBanner(r.error); return; }
        close();
        const imp = r.import;
        toast(`Client setup ${imp.id} created — state: ${imp.state}`, imp.state === 'validated' ? 'success' : 'error');
        cxView = { name: 'detail', id: imp.id };
        cxRenderDetail(root);
      });
    },
  });
}


/* ---------------- owner invitation hand-off ---------------- */

async function cxLoadInvites(root, tenantId) {
  const box = root.querySelector('#cxInviteBody');
  if (!box) return;
  const r = await cxApi('GET', '/api/admin/tenants/' + encodeURIComponent(tenantId) + '/invites');
  if (r.error) { box.innerHTML = `<span class="cell-dim">${esc(r.error)}</span>`; return; }
  const enrolled = r.enrolled || [], pending = r.invites || [];
  const enr = enrolled.length
    ? `<div class="list-row"><div class="row-main"><div class="row-title">Enrolled</div><div class="row-sub">${enrolled.map(u => esc(u.email) + ' (' + esc(u.role || 'user') + ')').join(' · ')}</div></div><span class="status-pill status-green"><span class="sdot"></span>active</span></div>` : '';
  const pen = pending.map(i => `
    <div class="list-row" style="flex-wrap:wrap;gap:8px">
      <div class="row-main"><div class="row-title">${esc(i.email)} <span class="cell-dim">(${esc(i.role || 'owner')})</span></div>
        <div class="row-sub">${i.expired ? 'Invitation expired — renew it to issue a fresh link.' : 'Invited ' + esc(relTime(i.invitedAt)) + ' · valid 14 days'}</div>
        <input type="text" readonly value="${esc(i.link)}" data-inv-link="${esc(i.userId)}" style="width:100%;margin-top:6px;font-family:ui-monospace,monospace;font-size:0.76rem"></div>
      <button class="btn btn-gold btn-sm" data-inv-copy="${esc(i.userId)}">Copy link</button>
      <button class="btn btn-ghost btn-sm" data-inv-renew="${esc(i.userId)}">Renew</button>
    </div>`).join('');
  box.innerHTML = (enr + pen) || '<span class="cell-dim">No owner users found for this business.</span>';
  box.querySelectorAll('[data-inv-copy]').forEach(b => b.addEventListener('click', async () => {
    const inp = box.querySelector(`[data-inv-link="${b.dataset.invCopy}"]`);
    try { await navigator.clipboard.writeText(inp.value); toast('Invitation link copied', 'success'); }
    catch (e) { inp.select(); toast('Press Ctrl+C to copy the selected link', 'info'); }
  }));
  box.querySelectorAll('[data-inv-renew]').forEach(b => b.addEventListener('click', async () => {
    const x = await cxApi('POST', '/api/admin/invites/' + encodeURIComponent(b.dataset.invRenew) + '/renew', {});
    if (x.error) { toast(x.error, 'error'); return; }
    toast('New invitation link issued', 'success');
    cxLoadInvites(root, tenantId);
  }));
}

/* ============================================================
   DETAIL VIEW — the wizard, driven entirely by server state
   ============================================================ */

async function cxRenderDetail(root) {
  root.innerHTML = `<div class="cx-loading">Loading import…</div>`;
  const r = await cxApi('GET', `/api/admin/connect/imports/${encodeURIComponent(cxView.id)}`);
  if (r.error) {
    root.innerHTML = `
      <div class="page-head"><div class="page-title">Business Connect</div></div>
      <div class="card">${cxErrBanner(r.error)}
        <button class="btn btn-ghost btn-sm" id="cxBack1">← Back to imports</button></div>`;
    root.querySelector('#cxBack1').addEventListener('click', () => { cxView = { name: 'list' }; cxRenderList(root); });
    return;
  }

  const imp = r.import;
  const dupes = r.duplicates || [];
  const run = r.provisioningRun || null;
  const glc = r.goLiveChecks || null;

  const issues = (imp.issues || []).filter(i => i.severity === 'error');
  const warnOnly = (imp.issues || []).length > 0 && issues.length === 0;

  root.innerHTML = `
    <div class="page-head">
      <div class="page-title">Import ${esc(imp.id)} ${cxStatePill(imp.state)}</div>
      <div class="page-sub">${esc(imp.filename || '(pasted envelope)')} · created ${relTime(imp.createdAt)} by ${esc(imp.createdBy || '')}
        ${imp.externalBusinessKey ? ` · external key <code>${esc(imp.externalBusinessKey)}</code>` : ''}</div>
    </div>
    ${cxSteps(imp.state)}
    <div class="section-stack" style="margin-top:14px">

      ${cxErrBanner(imp.state === 'validation_failed' ? '' : '')}
      <div class="card">
        <div class="card-title">🗺️ Mapped envelope
          <span style="flex:1"></span>
          <button class="btn btn-ghost btn-sm" id="cxBack">← All imports</button>
          <button class="btn btn-ghost btn-sm" id="cxRaw">View JSON</button>
        </div>
        <div class="kv-list">
          ${cxKv('Legal name', imp.envelope && imp.envelope.business ? imp.envelope.business.legal_name : '')}
          ${cxKv('Display name', imp.envelope && imp.envelope.business ? imp.envelope.business.display_name : '')}
          ${cxKv('Industry', imp.envelope && imp.envelope.business ? imp.envelope.business.industry : '')}
          ${cxKv('Plan / billing consent', `${imp.planCode || '—'} · ${imp.billingConsent ? 'consented' : 'no billing consent'}`)}
          ${cxKv('Schema version', imp.schemaVersion || '—')}
        </div>
      </div>

      ${issues.length ? `
      <div class="card">
        <div class="card-title">⛔ Validation errors (${issues.length}) — provisioning is blocked until fixed</div>
        ${cxIssueRows(imp.issues)}
        <p class="cell-dim" style="font-size:0.8rem;margin:10px 0 0">
          The envelope is immutable after import (audit trail). Fix the source data and create a corrected re-import;
          use the same <code>source.external_business_key</code> so duplicate detection can link them.</p>
      </div>` : ''}

      ${warnOnly && imp.issues.length ? `
      <div class="card">
        <div class="card-title">⚠️ Warnings</div>
        ${cxIssueRows(imp.issues)}
      </div>` : ''}

      ${cxActionsCard(root, imp, dupes, r)}

      ${dupes.length ? `
      <div class="card">
        <div class="card-title">👥 Possible duplicates in existing tenants (scored, never auto-merged)</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Tenant</th><th>Name</th><th>Status</th><th>Score</th><th>Reasons</th></tr></thead>
          <tbody>${dupes.map(d => `
            <tr>
              <td><code>${esc(d.tenantId)}</code></td>
              <td>${esc(d.name)}</td>
              <td>${esc(d.status || '')}</td>
              <td><span class="status-pill ${d.score >= 80 ? 'status-red' : 'status-orange'}"><span class="sdot"></span>${d.score}</span></td>
              <td class="cell-dim">${esc((d.reasons || []).join('; '))}</td>
            </tr>`).join('')}</tbody></table></div>
      </div>` : ''}

      ${(r.review || []).length ? `
      <div class="card">
        <div class="card-title">🔍 Review — exactly what will be provisioned</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Field</th><th>Value after normalization</th><th>Source</th></tr></thead>
          <tbody>${r.review.map(f => `
            <tr><td><code>${esc(f.field)}</code></td><td>${esc(f.value || '—')}</td>
            <td>${f.source === 'normalized' ? '<span class="status-pill status-blue"><span class="sdot"></span>normalized</span>' : '<span class="cell-dim">import</span>'}</td></tr>`).join('')}</tbody></table></div>
      </div>` : ''}

      ${run ? `
      <div class="card">
        <div class="card-title">⚙️ Provisioning run <code>${esc(run.id)}</code></div>
        <div class="kv-list">
          ${cxKv('Run state', esc(String(run.state).replace(/_/g, ' ')))}
          ${cxKv('Idempotency key', `<code>${esc(run.idempotencyKey)}</code>`)}
          ${cxKv('Attempts', String(run.attempts))}
          ${run.tenantId ? cxKv('Tenant', `<code>${esc(run.tenantId)}</code>`) : ''}
          ${run.failureDetail ? cxKv('Last failure', esc(run.failureDetail)) : ''}
        </div>
        ${run.steps && run.steps.length ? `
        <div style="margin-top:10px">${run.steps.map(s => `
          <div class="list-row">
            <div class="row-ico" style="background:${s.state === 'done' ? 'var(--green-dim);color:var(--green)' : s.state === 'failed' ? 'var(--red-dim);color:var(--red)' : 'var(--bg-hover)'}">
              ${s.state === 'done' ? '✓' : s.state === 'failed' ? '✕' : '•'}</div>
            <div class="row-main">
              <div class="row-title">${esc(s.key)}</div>
              <div class="row-sub">${esc(s.detail || '')}</div>
            </div>
            <span class="status-pill ${s.state === 'done' ? 'status-green' : s.state === 'failed' ? 'status-red' : 'status-dim'}"><span class="sdot"></span>${esc(s.state)}</span>
          </div>`).join('')}</div>` : ''}
      </div>` : ''}

      ${glc && imp.tenantId ? `
      <div class="card">
        <div class="card-title">🚦 Go-live checks <span style="flex:1"></span>
          <button class="btn btn-ghost btn-sm" id="cxRecheck">↻ Re-run checks</button></div>
        ${glc.checks.map(c => `
          <div class="list-row">
            <div class="row-ico" style="background:${c.pass ? 'var(--green-dim);color:var(--green)' : 'var(--red-dim);color:var(--red)'}">${c.pass ? '✓' : '✕'}</div>
            <div class="row-main">
              <div class="row-title">${esc(c.label)} ${c.required ? '<span class="cell-dim">(required)</span>' : ''}</div>
              <div class="row-sub">${esc(c.detail || '')}</div>
            </div>
            <span class="status-pill ${c.pass ? 'status-green' : 'status-red'}"><span class="sdot"></span>${c.pass ? 'pass' : 'blocked'}</span>
          </div>`).join('')}
        ${!glc.ready ? `<p class="cell-dim" style="font-size:0.8rem;margin:10px 0 0">
          Blocked by: ${glc.blockers.map(b => `<code>${esc(b)}</code>`).join(', ')}. Go-live will fail closed until every required check passes.</p>` : ''}
      </div>` : ''}

      ${imp.tenantId ? `
      <div class="card" id="cxInviteCard">
        <div class="card-title">🔑 Owner access — hand-off <span style="flex:1"></span></div>
        <p class="cell-dim" style="font-size:0.82rem;margin:0 0 10px">Send the private link below to the owner (email or text). They choose a password and land in their finished system. Treat the link like a password. Go-live requires the owner to have enrolled.</p>
        <div id="cxInviteBody"><span class="cell-dim">Loading…</span></div>
      </div>` : ''}
    </div>`;

  if (imp.tenantId) cxLoadInvites(root, imp.tenantId);
  root.querySelector('#cxBack').addEventListener('click', () => { cxView = { name: 'list' }; cxRenderList(root); });
  root.querySelector('#cxRaw').addEventListener('click', () => {
    openModal({
      title: `Envelope — ${imp.id}`,
      wide: true,
      body: `<textarea readonly rows="20" style="width:100%;font-family:ui-monospace,monospace;font-size:0.78rem">${esc(JSON.stringify(imp.envelope, null, 2))}</textarea>`,
      footer: `<button class="btn btn-ghost" data-close3>Close</button>`,
      onOpen: ({ modal, close }) => modal.querySelector('[data-close3]').addEventListener('click', close),
    });
  });
  const recheck = root.querySelector('#cxRecheck');
  if (recheck) recheck.addEventListener('click', () => cxRenderDetail(root));

  cxBindActions(root, imp);
}

function cxKv(label, valueHtml) {
  return `<div class="kv-row"><div class="kv-label">${label}</div><div class="kv-value">${valueHtml || '<span class="cell-dim">—</span>'}</div></div>`;
}

/* ---------------- state-driven action card ---------------- */

function cxActionsCard(root, imp, dupes, detail) {
  const state = imp.state;
  let body = '';
  const dupNote = dupes.length
    ? `<p class="cell-dim" style="font-size:0.8rem;margin:8px 0 0">${dupes.length} possible duplicate${dupes.length === 1 ? '' : 's'} detected. Approving without resolving requires explicit confirmation — imports are never auto-merged.</p>`
    : '';

  if (state === 'validated' || state === 'duplicate_review') {
    body = `
      <div class="card-title">✅ Ready for review & approval</div>
      <p class="cell-dim" style="font-size:0.85rem;margin:0 0 10px">Validation passed. Approving locks this import for provisioning. Duplicate checks re-run server-side at approval time.</p>
      ${dupNote}
      <div style="display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap">
        <button class="btn btn-gold" id="cxBtnApprove">Approve import</button>
        ${dupes.length ? `<button class="btn btn-red" id="cxBtnApproveDespite">Approve anyway — create as separate business</button>` : ''}
      </div>`;
  } else if (state === 'approved') {
    body = `
      <div class="card-title">Approved — ready to provision</div>
      <p class="cell-dim" style="font-size:0.85rem;margin:0 0 10px">Provisioning creates the tenant (org + business), profile, hours, services, receptionist config, declared integrations (recorded honestly as <strong>not_configured</strong>) and owner invitation. It is idempotent — safe to re-run.</p>
      <button class="btn btn-gold" id="cxBtnProvision">Provision tenant</button>`;
  } else if (state === 'provisioning_partial' || state === 'verification_failed') {
    body = `
      <div class="card-title">⚠️ Provisioning incomplete</div>
      <p class="cell-dim" style="font-size:0.85rem;margin:0 0 10px">The last run stopped with failures. Re-running resumes from completed steps — finished steps are skipped, partial ones are retried (upsert semantics).</p>
      <button class="btn btn-gold" id="cxBtnProvision">Resume provisioning (idempotent)</button>`;
  } else if (state === 'ready_for_go_live') {
    body = `
      <div class="card-title">🚀 Ready for go-live</div>
      <p class="cell-dim" style="font-size:0.85rem;margin:0 0 10px">Tenant provisioned and verified. Go-live is <strong>fail-closed</strong>: it requires the explicit owner-approval flag AND every required check passing (including an enrolled owner and real receptionist provider readiness).</p>
      <label class="cx-check"><input type="checkbox" id="cxOwnerApproval">
        <span>Business owner has explicitly approved go-live (documented consent)</span></label>
      <div style="margin-top:12px"><button class="btn btn-gold" id="cxBtnGolive">Execute go-live</button></div>`;
  } else if (state === 'active') {
    body = `
      <div class="card-title">🏆 Tenant is live</div>
      <p class="cell-dim" style="font-size:0.85rem;margin:0 0 4px">Business Connect onboarding complete for tenant <code>${esc(imp.tenantId || '')}</code>. Ongoing configuration lives in the tenant's own apps (Client Hub, AI Receptionist).</p>`;
  } else if (state === 'validation_failed') {
    body = `
      <div class="card-title">⛔ Validation failed</div>
      <p class="cell-dim" style="font-size:0.85rem;margin:0">Fix the errors listed above in the source data, then create a corrected re-import. Approval and provisioning stay locked.</p>`;
  } else if (state === 'provisioning') {
    body = `<div class="card-title">⏳ Provisioning in progress…</div>
      <p class="cell-dim" style="font-size:0.85rem;margin:0">Refresh to see the latest run state.</p>
      <button class="btn btn-ghost btn-sm" id="cxRef" style="margin-top:8px">↻ Refresh</button>`;
  }

  return body ? `<div class="card" id="cxActions">${body}</div>` : '';
}

function cxBindActions(root, imp) {
  const bind = (id, fn) => { const el = root.querySelector(id); if (el) el.addEventListener('click', fn); };
  const refresh = () => cxRenderDetail(root);

  bind('#cxRef', refresh);

  bind('#cxBtnApprove', async () => {
    const r = await cxApi('POST', `/api/admin/connect/imports/${imp.id}/approve`, {});
    if (r.status === 409 && r.needsDuplicateResolution) {
      toast('Duplicates found — resolve or approve explicitly', 'info');
      refresh(); return;
    }
    if (r.error) { toast(r.error, 'error'); refresh(); return; }
    toast('Import approved', 'success'); refresh();
  });

  bind('#cxBtnApproveDespite', async () => {
    const ok = await confirmDialog({
      title: 'Create as a separate business?',
      message: 'Possible duplicates were detected. This records "proceed-separate" on the import and creates a NEW tenant alongside the possible matches. Nothing is merged.',
      confirmText: 'Approve despite duplicates',
      danger: true,
    });
    if (!ok) return;
    const r = await cxApi('POST', `/api/admin/connect/imports/${imp.id}/approve`, { proceedDespiteDuplicates: true });
    if (r.error) { toast(r.error, 'error'); refresh(); return; }
    toast('Import approved (proceed-separate recorded)', 'success'); refresh();
  });

  bind('#cxBtnProvision', async () => {
    const r = await cxApi('POST', `/api/admin/connect/imports/${imp.id}/provision`, {});
    if (r.error) { toast(r.error, 'error'); refresh(); return; }
    if (r.already) toast('Provisioning already complete (idempotent re-run)', 'info');
    else toast(`Provisioned tenant ${r.tenantId} — state: ${r.state}`, r.state === 'ready_for_go_live' ? 'success' : 'error');
    refresh();
  });

  bind('#cxBtnGolive', async () => {
    const chk = root.querySelector('#cxOwnerApproval');
    if (!chk || !chk.checked) { toast('Owner approval must be checked — go-live is fail-closed', 'error'); return; }
    const ok = await confirmDialog({
      title: 'Execute go-live?',
      message: 'The tenant becomes active for real call handling. All required checks must pass, including enrolled owner and receptionist provider readiness (real telephony/LLM credentials).',
      confirmText: 'Go live',
      danger: true,
    });
    if (!ok) return;
    const r = await cxApi('POST', `/api/admin/connect/imports/${imp.id}/golive`, { ownerApproval: true });
    if (r.error) { toast(r.error, 'error'); refresh(); return; }
    toast('Tenant is live', 'success'); refresh();
  });
}


/* ---- js/pages/providers.js ---- */
/* ============================================================
   VANTORX ADMIN — pages/providers.js (PRODUCTION)
   Real provider registry from the server environment. Every
   status is evaluated server-side from actual env vars — this
   page never guesses and never fakes a connection.
   ============================================================ */

const CAPS = [
  { key: 'telephony', label: 'Telephony (real inbound calls)' },
  { key: 'llm', label: 'LLM (conversation brain)' },
  { key: 'stt', label: 'Speech-to-text' },
  { key: 'tts', label: 'Text-to-speech' },
  { key: 'calendar', label: 'Calendar / booking' },
  { key: 'crm', label: 'CRM / LeadFlow' },
  { key: 'email', label: 'Email delivery' },
  { key: 'sms', label: 'SMS delivery' },
  { key: 'payments', label: 'Payments / billing' },
];

function pill(status) {
  if (status === 'connected' || status === 'CONNECTED') return `<span class="status-pill status-green"><span class="sdot"></span>connected</span>`;
  if (status === 'BLOCKED') return `<span class="status-pill status-red"><span class="sdot"></span>blocked</span>`;
  return `<span class="status-pill status-orange"><span class="sdot"></span>not connected</span>`;
}

async function renderProviders(root, ctx) {
  root.innerHTML = `<div class="page-head"><div class="page-title">Providers</div><div class="page-sub">Live status from server environment variables. Secrets never leave the server.</div></div><div id="pvBody"><div class="card">Loading…</div></div>`;

  const r = await api('GET', '/api/admin/providers');
  const e = await api('GET', '/api/admin/env-status');
  const body = root.querySelector('#pvBody');
  if (r.status !== 200) {
    body.innerHTML = `<div class="card"><div class="cx-error">✕ ${esc(r.error || 'Failed to load provider status')}</div></div>`;
    return;
  }
  const pv = r.providers || {};
  const testsDone = {};

  const capRow = (c) => {
    const st = pv[c.key] || { status: 'NOT_CONNECTED', note: '' };
    return `<tr>
      <td><strong>${esc(c.label)}</strong><div class="cell-dim" style="font-size:0.78rem">${esc(st.note || '')}</div>
        <div class="cell-dim" style="font-size:0.75rem;margin-top:2px">env: ${((st.envPresent || []).length ? '✓ ' + esc((st.envPresent || []).join(', ')) + ' ' : '') + ((st.envMissing || []).length ? '✗ ' + esc((st.envMissing || []).join(', ')) : '')}</div></td>
      <td>${esc(st.provider || '—')}</td>
      <td>${pill(st.status)}</td>
      <td><button class="btn btn-ghost btn-sm" data-test="${esc(c.key)}" ${st.status === 'NOT_CONNECTED' ? 'disabled' : ''}>Test</button><div class="cell-dim" style="font-size:0.75rem;margin-top:4px;max-width:280px" data-testout="${esc(c.key)}"></div></td>
    </tr>`;
  };

  const numRow = (n) => `<tr><td><code>${esc(n.number)}</code></td><td>${esc(n.provider || '')}</td><td>${esc(n.businessId)}</td><td><button class="btn btn-ghost btn-sm" data-unmapnum="${esc(n.id)}" style="color:var(--red)">Unmap</button></td></tr>`;
  const agentRow = (a) => `<tr><td><code>${esc(a.agentId)}</code></td><td>${esc(a.businessId)}</td><td><button class="btn btn-ghost btn-sm" data-unmapagent="${esc(a.id)}" style="color:var(--red)">Unmap</button></td></tr>`;

  const businesses = (ctx.overviewData ? ctx.overviewData.businesses : []) || [];
  const bizOpts = businesses.map(b => `<option value="${esc(b.id)}">${esc(b.name)} (${esc(b.id)})</option>`).join('');

  body.innerHTML = `
    <div class="card">
      <div class="card-title">🔌 Provider registry <span class="dim small">— connected = required env vars present in the SERVER environment</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Capability</th><th>Provider</th><th>Status</th><th>Live test</th></tr></thead>
        <tbody>${CAPS.map(capRow).join('')}</tbody>
      </table></div>
    </div>

    <div class="card">
      <div class="card-title">📞 Voice number mapping <span class="dim small">— which business answers each phone number (Twilio)</span></div>
      ${r.voiceNumbers && r.voiceNumbers.length ? `<div class="table-wrap"><table><thead><tr><th>Number</th><th>Provider</th><th>Business</th><th></th></tr></thead><tbody>${r.voiceNumbers.map(numRow).join('')}</tbody></table></div>` : '<p class="cell-dim" style="margin:0 0 10px">No numbers mapped. A real caller dialing an unmapped number gets a "not in service" response — never a fake receptionist.</p>'}
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px">
        <div><label class="cell-dim small">Number (E.164)</label><br><input id="vnNum" placeholder="+13125550142" style="min-width:180px"></div>
        <div><label class="cell-dim small">Business</label><br><select id="vnBiz" style="min-width:220px">${bizOpts}</select></div>
        <button class="btn btn-gold btn-sm" id="vnAdd">Map number</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🤖 Retell agent mapping <span class="dim small">— Retell agent → business (voice pipeline mode)</span></div>
      ${r.voiceAgents && r.voiceAgents.length ? `<div class="table-wrap"><table><thead><tr><th>Agent ID</th><th>Business</th><th></th></tr></thead><tbody>${r.voiceAgents.map(agentRow).join('')}</tbody></table></div>` : '<p class="cell-dim" style="margin:0 0 10px">No Retell agents mapped.</p>'}
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px">
        <div><label class="cell-dim small">Agent ID</label><br><input id="vaId" placeholder="agent_..." style="min-width:180px"></div>
        <div><label class="cell-dim small">Business</label><br><select id="vaBiz" style="min-width:220px">${bizOpts}</select></div>
        <button class="btn btn-gold btn-sm" id="vaAdd">Map agent</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🔐 Server environment variables <span class="dim small">— names and presence only, never values</span></div>
      ${e.status === 200 ? `<div class="table-wrap"><table><thead><tr><th>Variable</th><th>Present</th></tr></thead><tbody>
        ${(e.rows || []).map(v => `<tr><td><code>${esc(v.name)}</code></td><td>${v.present ? '<span class="status-pill status-green"><span class="sdot"></span>yes</span>' : '<span class="status-pill status-orange"><span class="sdot"></span>no</span>'}</td></tr>`).join('')}
      </tbody></table></div><p class="cell-dim small" style="margin:8px 0 0">Set secrets in the server environment or <code>platform/.env</code> (git-ignored), then restart the server.</p>` : `<div class="cx-error">✕ ${esc(e.error || 'env status unavailable')}</div>`}
    </div>`;

  body.querySelectorAll('[data-test]').forEach(btn => btn.addEventListener('click', async function () {
    const cap = this.dataset.test;
    this.disabled = true;
    const out = body.querySelector(`[data-testout="${cap}"]`);
    out.textContent = 'testing…';
    const t = await api('POST', '/api/admin/providers/test', { capability: cap });
    this.disabled = false;
    testsDone[cap] = true;
    out.textContent = t.status ? `${t.status} — ${t.detail || ''}` : (t.error || 'test failed');
    toast(`${cap}: ${t.status || 'error'}`, t.status === 'CONNECTED' ? 'success' : 'info');
  }));

  body.querySelector('#vnAdd').addEventListener('click', async () => {
    const number = body.querySelector('#vnNum').value.trim();
    const businessId = body.querySelector('#vnBiz').value;
    if (!number) { toast('Enter a phone number', 'info'); return; }
    const res = await api('POST', '/api/admin/voice/numbers', { number, businessId });
    if (res.status === 201) { toast('Number mapped', 'success'); renderProviders(root, ctx); }
    else toast(res.error || 'Mapping failed', 'info');
  });
  body.querySelector('#vaAdd').addEventListener('click', async () => {
    const agentId = body.querySelector('#vaId').value.trim();
    const businessId = body.querySelector('#vaBiz').value;
    if (!agentId) { toast('Enter an agent ID', 'info'); return; }
    const res = await api('POST', '/api/admin/voice/agents', { agentId, businessId });
    if (res.status === 201) { toast('Agent mapped', 'success'); renderProviders(root, ctx); }
    else toast(res.error || 'Mapping failed', 'info');
  });
  body.querySelectorAll('[data-unmapnum]').forEach(btn => btn.addEventListener('click', async function () {
    if (!(await confirmDialog({ title: 'Unmap number?', message: 'Callers to this number will no longer reach a receptionist.', confirmText: 'Unmap' }))) return;
    const res = await api('DELETE', `/api/admin/voice/numbers/${encodeURIComponent(this.dataset.unmapnum)}`);
    if (res.status === 200) { toast('Unmapped', 'success'); renderProviders(root, ctx); } else toast(res.error || 'Failed', 'info');
  }));
  body.querySelectorAll('[data-unmapagent]').forEach(btn => btn.addEventListener('click', async function () {
    if (!(await confirmDialog({ title: 'Unmap agent?', message: 'This Retell agent will no longer route to a business.', confirmText: 'Unmap' }))) return;
    const res = await api('DELETE', `/api/admin/voice/agents/${encodeURIComponent(this.dataset.unmapagent)}`);
    if (res.status === 200) { toast('Unmapped', 'success'); renderProviders(root, ctx); } else toast(res.error || 'Failed', 'info');
  }));
}


/* ---- js/app.js ---- */
/* ============================================================
   VANTORX ADMIN — app.js (PRODUCTION)
   Auth gate (vantorx_admin only) · router · sidebar · topbar
   (search/notifications/account/home) · mobile drawer.
   All data comes from the platform server via realapi.js.
   There is no demo store and no offline fake data.
   ============================================================ */

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

/* ---------------- session + shared cache ---------------- */

let authUser = null;        // { id, email, name, role } | null
let overviewData = null;    // last /api/admin/overview payload

const ctx = {
  navigate,
  get user() { return authUser; },
  get overviewData() { return overviewData; },
  async overview(force) {
    if (force || !overviewData) {
      const r = await overview();
      if (r.status === 200) {
        overviewData = r;
        paintBadges();
      } else if (r.status === 401) {
        authUser = null;
        return null;
      } else {
        throw new Error(r.error || 'Failed to load platform data');
      }
    }
    return overviewData;
  },
  openClient: (id) => openClientDetail(id, ctx),
};

/* ---------------- routing ---------------- */

const routes = {
  overview: renderOverview,
  clients: renderClients,
  requests: renderRequests,
  billing: renderBilling,
  activity: renderActivity,
  settings: renderSettings,
  connect: renderConnect,
  providers: renderProviders,
};

const TITLES = {
  overview: 'Overview', clients: 'Clients', requests: 'Change Requests',
  billing: 'Billing & Plans', activity: 'Audit Activity', settings: 'Settings',
  connect: 'Business Connect', providers: 'Providers',
};

function parseHash() {
  const h = (location.hash || '#/overview').replace(/^#\//, '');
  const [page] = h.split('/');
  return { page: page || 'overview' };
}

function setActiveNav(page) {
  $$('#sidebar .nav-item').forEach(a => a.classList.toggle('active', a.dataset.nav === page));
}

async function router() {
  const view = $('#view');
  if (!authUser || authUser.role !== 'vantorx_admin') {
    setActiveNav('');
    $('#topbarTitle').textContent = 'VantorX Admin';
    view.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'page';
    view.appendChild(el);
    renderAuth(el);
    return;
  }
  paintIdentity();
  const { page } = parseHash();
  const render = routes[page] || renderOverview;
  setActiveNav(page);
  $('#topbarTitle').textContent = TITLES[page] || 'VantorX Admin';
  view.innerHTML = '';
  const pageEl = document.createElement('div');
  pageEl.className = 'page';
  view.appendChild(pageEl);
  try {
    await render(pageEl, ctx);
  } catch (err) {
    console.error('Render failed on', page, err);
    pageEl.innerHTML = `<div class="card">${emptyState('⚠️', 'Could not load live data', String(err.message || err) + ' — the console only shows real platform data, so it stays empty until the server responds.')}</div>`;
  }
  closeMobileNav();
  $('.content').scrollTop = 0;
}

/* ---------------- auth gate ---------------- */

function renderAuth(root) {
  root.innerHTML = `
    <div class="auth-wrap">
      <div class="card auth-card">
        <div class="card-title">🔐 Platform sign-in</div>
        <p class="cell-dim" style="font-size:0.84rem;margin:0 0 12px">This console runs live against the VantorX platform. Access is restricted to <strong>vantorx_admin</strong> accounts.</p>
        <div class="cx-form-row"><label>Email or username</label><input id="authEmail" type="text" placeholder="Email or username" autocomplete="username"></div>
        <div class="cx-form-row"><label>Password</label><input id="authPass" type="password" autocomplete="current-password"></div>
        <div id="authErr"></div>
        <div style="display:flex;gap:9px;margin-top:14px">
          <button class="btn btn-gold" id="authGo">Sign in</button>
          <a class="btn btn-ghost" href="/" style="text-decoration:none;display:inline-flex;align-items:center">← Portal home</a>
        </div>
      </div>
    </div>`;
  const submit = async () => {
    const email = root.querySelector('#authEmail').value.trim();
    const pass = root.querySelector('#authPass').value;
    root.querySelector('#authErr').innerHTML = '';
    const r = await login(email, pass);
    if (r.error) { root.querySelector('#authErr').innerHTML = `<div class="cx-error">✕ ${esc(r.error)}</div>`; return; }
    if (r.user.role !== 'vantorx_admin') {
      root.querySelector('#authErr').innerHTML = `<div class="cx-error">✕ ${esc(r.user.email)} is a ${esc(r.user.role)} account — the admin console requires a platform admin.</div>`;
      return;
    }
    authUser = r.user;
    overviewData = null;
    toast('Signed in to live platform', 'success');
    router();
  };
  root.querySelector('#authGo').addEventListener('click', submit);
  root.querySelector('#authPass').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
}

/* ---------------- identity + badges ---------------- */

function paintIdentity() {
  if (!authUser) return;
  const name = authUser.name || authUser.email;
  $('#avatarName').textContent = String(name).split(' ')[0];
  $('#avatarInitials').textContent = String(name).split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  $('#opsName').textContent = 'Platform Admin';
  $('#opsPlan').textContent = authUser.email;
}

function paintBadges() {
  if (!overviewData) return;
  const bizCount = overviewData.businesses.length;
  $('#clientsBadge').textContent = bizCount;
  const open = overviewData.counts.changeRequests || 0;
  const reqBadge = $('#reqBadge');
  reqBadge.textContent = open;
  reqBadge.classList.toggle('red', open > 5);
}

async function refreshNotificationsDot() {
  const r = await notifications();
  if (r.status !== 200) return;
  const unread = (r.rows || []).filter(n => !n.read).length;
  $('#notifDot').classList.toggle('show', unread > 0);
}

/* ---------------- boot ---------------- */

window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', async () => {
  const me = await getMe();
  if (me.status === 200 && me.user && me.user.role === 'vantorx_admin') {
    authUser = me.user;
    try { await ctx.overview(true); } catch (e) { console.warn('overview load failed', e); }
    refreshNotificationsDot();
  }
  router();
});

/* ---------------- navigation helper ---------------- */

function navigate(route) {
  const target = '#/' + route;
  if (location.hash === target) router();
  else location.hash = target;
}

/* ---------------- sidebar / mobile drawer ---------------- */

const sidebar = $('#sidebar');
const scrim = $('#mobileScrim');

function closeMobileNav() {
  sidebar.classList.remove('mobile-open');
  scrim.hidden = true;
}
$('#menuBtn').addEventListener('click', () => {
  sidebar.classList.add('mobile-open');
  scrim.hidden = false;
});
scrim.addEventListener('click', closeMobileNav);
$$('#sidebar .nav-item').forEach(a => a.addEventListener('click', closeMobileNav));

/* ---------------- notifications (real, all tenants for admin) ---------------- */

$('#notifBtn').addEventListener('click', async () => {
  const r = await notifications();
  const rows = (r.status === 200 ? (r.rows || []) : []).slice(0, 30);
  openModal({
    title: `Notifications${rows.length ? ` · ${rows.filter(n => !n.read).length} unread` : ''}`,
    wide: true,
    body: rows.length
      ? `<div>${rows.map(n => `
          <div class="list-row" style="${n.read ? 'opacity:0.55' : ''}">
            <div class="row-ico" style="background:var(--bg-hover)">•</div>
            <div class="row-main">
              <div class="row-title">${esc(n.title)}</div>
              <div class="row-sub">${esc(n.body || '')}</div>
            </div>
            <div class="row-time">${relTime(n.at)}</div>
          </div>`).join('')}</div>`
      : emptyState('◔', 'No notifications', 'Tenant events appear here as they happen on the platform.'),
    footer: `<button class="btn btn-ghost btn-sm" data-close2>Close</button>
             ${rows.length ? '<button class="btn btn-gold btn-sm" data-markread>Mark all read</button>' : ''}`,
    onOpen: ({ modal, close }) => {
      modal.querySelector('[data-close2]').addEventListener('click', close);
      const mark = modal.querySelector('[data-markread]');
      if (mark) mark.addEventListener('click', async () => {
        await markNotificationsRead();
        close();
        refreshNotificationsDot();
        toast('All notifications marked read', 'success');
      });
    },
  });
  refreshNotificationsDot();
});

/* ---------------- account menu (real session) ---------------- */

$('#accountBtn').addEventListener('click', openAccount);
$('#opsCard').addEventListener('click', openAccount);

function openAccount() {
  if (!authUser) { router(); return; }
  openModal({
    title: 'Account',
    body: `
      <div class="kv-list">
        <div class="kv-row"><div class="kv-label">Signed in</div><div class="kv-value">${esc(authUser.name || authUser.email)}<div class="cell-dim">${esc(authUser.email)} · ${esc(authUser.role)}</div></div></div>
        <div class="kv-row"><div class="kv-label">Data source</div><div class="kv-value">Live platform server — port 8787</div></div>
      </div>
      <div style="display:flex;gap:9px;margin-top:16px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" data-act="reload">↻ Reload live data</button>
        <button class="btn btn-ghost btn-sm" data-act="signout" style="color:var(--red)">Sign out</button>
      </div>`,
    onOpen: ({ modal, close }) => {
      modal.querySelector('[data-act="reload"]').addEventListener('click', async () => {
        close();
        overviewData = null;
        await ctx.overview(true);
        router();
        toast('Live data reloaded', 'success');
      });
      modal.querySelector('[data-act="signout"]').addEventListener('click', async () => {
        close();
        await logout();
        authUser = null;
        overviewData = null;
        toast('Signed out', 'info');
        router();
      });
    },
  });
}

/* ---------------- global search (live tenants + users) ---------------- */

const searchInput = $('#globalSearch');
const searchWrap = $('#topbarSearchWrap');
let searchBox = null;

function searchAll(q) {
  const s = q.toLowerCase();
  const out = [];
  if (overviewData) {
    overviewData.businesses.forEach(b => {
      if ((b.name + ' ' + (b.industry || '') + ' ' + (b.city || '')).toLowerCase().includes(s))
        out.push({ kind: 'Tenant', label: b.name, sub: `${b.industry || ''} · ${b.status || ''}`, go: () => ctx.openClient(b.id) });
    });
    overviewData.users.forEach(u => {
      if ((u.email + ' ' + u.name).toLowerCase().includes(s))
        out.push({ kind: 'User', label: u.name || u.email, sub: `${u.email} · ${u.role}`, go: () => navigate('activity') });
    });
  }
  return out.slice(0, 8);
}

function closeSearch() {
  if (searchBox) { searchBox.remove(); searchBox = null; }
}

function renderSearchResults() {
  closeSearch();
  const q = searchInput.value.trim();
  if (q.length < 2) return;
  const hits = searchAll(q);
  searchBox = document.createElement('div');
  searchBox.className = 'search-results';
  if (!hits.length) {
    searchBox.innerHTML = `<div class="sr-item"><span class="cell-dim">No matches for "${esc(q)}"</span></div>`;
  } else {
    hits.forEach(h => {
      const row = document.createElement('div');
      row.className = 'sr-item';
      row.innerHTML = `<span><strong>${esc(h.label)}</strong>&nbsp; <span class="cell-dim">${esc(h.sub)}</span></span><span class="sr-kind">${esc(h.kind)}</span>`;
      row.addEventListener('click', () => { searchInput.value = ''; closeSearch(); h.go(); });
      searchBox.appendChild(row);
    });
  }
  searchWrap.appendChild(searchBox);
}

searchInput.addEventListener('input', renderSearchResults);
searchInput.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSearch(); searchInput.blur(); } });
document.addEventListener('click', e => { if (searchBox && !e.target.closest('#topbarSearchWrap')) closeSearch(); });

/* "/" focuses search */
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/input|textarea|select/i.test(e.target.tagName) && authUser) {
    e.preventDefault();
    searchInput.focus();
  }
});


</script>
  <!-- providers page lives at js/pages/providers.js -->
