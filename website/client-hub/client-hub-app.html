/* ---- js/pages/onboarding.js ---- */
/* ============================================================
   VANTORX CLIENT HUB — pages/onboarding.js
   8-step first-run wizard, gated before routing. Finishes by
   setting state.onboarded = true (persisted in localStorage).
   Signature: renderOnboarding(root, ctx) — matches app.js.
   ============================================================ */

const STEPS = [
  'Welcome', 'Business profile', 'Hours & services', 'AI Receptionist',
  'LeadFlow', 'Requests', 'Billing', "You're set",
];

const ONB_DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

function renderOnboarding(root, ctx) {
  if (document.getElementById('onboardOverlay')) return;

  const overlay = document.createElement('div');
  overlay.className = 'onboard-overlay';
  overlay.id = 'onboardOverlay';
  overlay.innerHTML = `
    <div class="onboard-card">
      <div class="onboard-progress" id="onbDots"></div>
      <div class="onboard-step-label" id="onbStepLabel" style="font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px"></div>
      <div id="onbBody"></div>
      <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:20px">
        <button class="btn btn-ghost btn-sm" id="onbBack">Back</button>
        <button class="btn btn-gold" id="onbNext">Continue</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const body = overlay.querySelector('#onbBody');
  const q = (sel) => overlay.querySelector(sel);

  let i = 0;

  function paint() {
    q('#onbDots').innerHTML = STEPS.map((_, n) =>
      `<span class="${n <= i ? 'done' : ''}"></span>`).join('');
    q('#onbStepLabel').textContent = `Step ${i + 1} of 8 · ${STEPS[i]}`;
    q('#onbNext').textContent = i === STEPS.length - 1 ? 'Enter the Hub' : 'Continue';
    q('#onbBack').hidden = i === 0;
    paintStep();
  }

  function paintStep() {
    const s = S.getState();
    if (i === 0) {
      body.innerHTML = `
        <div class="onboard-title">Welcome to VantorX Hub</div>
        <p class="onboard-sub">This is the command center for your AI Receptionist and LeadFlow — every call, booking, and follow-up in one place. This 60-second tour shows you around.</p>
        <div class="cap-grid" style="grid-template-columns:1fr 1fr">
          ${[['✦', 'AI Receptionist', 'Answers calls 24/7 in your business voice'],
             ['▤', 'Bookings', 'Every confirmed appointment lands here'],
             ['⟳', 'LeadFlow', 'Automatic follow-up until they reply'],
             ['✎', 'Requests', 'Ask for changes — applied same-day']]
            .map(([ic, t, d]) => `<div class="cap-card"><span class="cap-ico">${ic}</span><div><div style="font-weight:600;font-size:0.84rem">${t}</div><div style="font-size:0.74rem;color:var(--text-dim)">${d}</div></div></div>`).join('')}
        </div>`;
    } else if (i === 1) {
      body.innerHTML = `
        <div class="onboard-title">Business profile</div>
        <p class="onboard-sub">How your business appears across the Hub. Pre-filled with your details — adjust anything that's off.</p>
        <div class="form-group"><label class="form-label">Business name</label><input class="form-input" id="onbName" value="${esc(s.business.name)}"/></div>
        <div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="onbPhone" value="${esc(s.business.phone)}"/></div>
        <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="onbEmail" value="${esc(s.business.email)}"/></div>
        <div class="form-group" style="margin-bottom:0"><label class="form-label">Address</label><input class="form-input" id="onbAddress" value="${esc(s.business.address)}"/></div>`;
    } else if (i === 2) {
      body.innerHTML = `
        <div class="onboard-title">Hours &amp; services</div>
        <p class="onboard-sub">The AI books within these hours and only offers these services. You can edit both later in the AI Receptionist section.</p>
        <div class="kv-list" style="margin-bottom:14px">
          ${ONB_DAYS.map(d => {
            const h = s.business.hours[d];
            return `<div class="kv-row"><div class="kv-label" style="width:90px">${d}</div><div class="kv-value">${h ? `${h[0]} – ${h[1]}` : '<span style="color:var(--red)">Closed</span>'}</div></div>`;
          }).join('')}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${s.business.services.map(v => `<span class="chip">${esc(v.name)} · $${v.price} · ${v.duration} min</span>`).join('')}
        </div>`;
    } else if (i === 3) {
      body.innerHTML = `
        <div class="onboard-title">Meet ${esc(s.ai.name)}</div>
        <p class="onboard-sub">Your AI Receptionist answers every call on <strong>${esc(s.business.phone)}</strong>, books straight into ${esc(s.ai.calendar)}, and transfers anything sensitive to <strong>${esc(s.ai.transferNumber)}</strong>. You can switch it off anytime.</p>
        <div class="kv-list">
          <div class="kv-row"><div class="kv-label">Status</div><div class="kv-value"><span class="status-pill ${s.ai.status === 'online' ? 'status-green' : 'status-red'}"><span class="sdot"></span>${s.ai.status === 'online' ? 'ONLINE' : 'OFFLINE'}</span></div></div>
          <div class="kv-row"><div class="kv-label">Voice</div><div class="kv-value">${esc(s.ai.voice)}</div></div>
          <div class="kv-row"><div class="kv-label">Capabilities</div><div class="kv-value">Answer · Book · Reschedule · Cancel · Answer FAQs · Transfer</div></div>
        </div>`;
    } else if (i === 4) {
      const leads = s.leads.length;
      const queue = s.tasks.filter(t => !t.done).length;
      body.innerHTML = `
        <div class="onboard-title">LeadFlow is active</div>
        <p class="onboard-sub">Every lead automatically gets a friendly 5-touch follow-up sequence over SMS and email until they reply or book — no lead goes cold.</p>
        <div class="kv-list">
          <div class="kv-row"><div class="kv-label">Leads tracked</div><div class="kv-value">${leads}</div></div>
          <div class="kv-row"><div class="kv-label">Follow-ups in queue</div><div class="kv-value">${queue}</div></div>
          <div class="kv-row"><div class="kv-label">Sequence</div><div class="kv-value">5 touches · SMS + email · stops on reply</div></div>
        </div>`;
    } else if (i === 5) {
      body.innerHTML = `
        <div class="onboard-title">Request Changes</div>
        <p class="onboard-sub">Anything you want changed — greeting, prices, hours, what the AI says — submit it from the Requests page. Changes are applied same-day; no tickets, no waiting on hold.</p>
        <div class="cap-grid" style="grid-template-columns:1fr 1fr">
          ${['Pricing & services', 'Business hours', 'AI behavior', 'Call transfers', 'Calendar', 'Phone number']
            .map(t => `<div class="cap-card"><span class="cap-ico">✎</span>${t}</div>`).join('')}
        </div>`;
    } else if (i === 6) {
      const a = s.account;
      body.innerHTML = `
        <div class="onboard-title">Billing</div>
        <p class="onboard-sub">One flat monthly plan — everything included. Cancel anytime, no contracts, no setup fees.</p>
        <div class="kv-list">
          <div class="kv-row"><div class="kv-label">Plan</div><div class="kv-value">${esc(a.plan)}</div></div>
          <div class="kv-row"><div class="kv-label">Price</div><div class="kv-value">${esc(a.price)}</div></div>
          <div class="kv-row"><div class="kv-label">Status</div><div class="kv-value">${esc(a.status)}</div></div>
          <div class="kv-row" style="border-bottom:none"><div class="kv-label">Billing</div><div class="kv-value">${esc(a.nextBilling)}</div></div>
        </div>`;
    } else {
      body.innerHTML = `
        <div class="onboard-title">You're set 🎉</div>
        <p class="onboard-sub">The Hub is pre-loaded with realistic demo data so you can explore freely. Reset it anytime from Account → Reset demo data.</p>
        <div class="kv-list">
          <div class="kv-row"><div class="kv-label">AI Receptionist</div><div class="kv-value"><span class="status-pill status-green"><span class="sdot"></span>Online</span></div></div>
          <div class="kv-row" style="border-bottom:none"><div class="kv-label">LeadFlow</div><div class="kv-value">Active — ${s.leads.length} leads tracked</div></div>
        </div>`;
    }
  }

  function commit() {
    if (i !== 1) return;
    const name = q('#onbName').value.trim();
    const phone = q('#onbPhone').value.trim();
    const email = q('#onbEmail').value.trim();
    const address = q('#onbAddress').value.trim();
    S.setState(s => {
      if (name) s.business.name = name;
      if (phone) s.business.phone = phone;
      if (email) s.business.email = email;
      if (address) s.business.address = address;
    });
  }

  q('#onbNext').addEventListener('click', () => {
    commit();
    if (i < STEPS.length - 1) { i++; paint(); }
    else {
      S.setState(s => { s.onboarded = true; }); // app.js subscriber routes to the dashboard
      overlay.remove();
    }
  });
  q('#onbBack').addEventListener('click', () => { if (i > 0) { i--; paint(); } });

  paint();
}


/* -- namespace shims (deduped) -- */
const S = { getState: getState, subscribe: subscribe, refresh: refresh, init: init, hydrate: hydrate, setState: setState, platformLogin: platformLogin, platformLogout: platformLogout, initSessionFromCache: initSessionFromCache, persistProfilePatch: persistProfilePatch, saveRxProfile: saveRxProfile, rxActivate: rxActivate, rxDeactivate: rxDeactivate, createChangeRequest: createChangeRequest, cancelAppointment: cancelAppointment, rescheduleAppointment: rescheduleAppointment, markNotificationsRead: markNotificationsRead, runAiTest: runAiTest, runAiTurn: runAiTurn };
const U = { STATUS_META: STATUS_META, CALL_OUTCOMES: CALL_OUTCOMES, APPT_STATUS: APPT_STATUS, esc: esc, fmtTime: fmtTime, fmtDate: fmtDate, fmtDateTime: fmtDateTime, fmtDuration: fmtDuration, relTime: relTime, debounce: debounce, uid: uid, mulberry32: mulberry32, scoreBar: scoreBar, initials: initials, groupBy: groupBy, monthLabel: monthLabel, sameDay: sameDay };

/* ---- js/app.js ---- */
/* ============================================================
   VANTORX CLIENT HUB — app.js
   Router · sidebar · topbar (search/notifications/account) ·
   mobile drawer · onboarding gate · shared page context (ctx)
   ============================================================ */

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

/* ---------------- shared page context ---------------- */
const ctx = {
  getState: S.getState,
  setState: S.setState,
  hydrate: S.hydrate,
  navigate,
  openCall: (id) => openCallDetail(id, ctx),
  openAppointment: (id) => openApptModal(id, ctx),
  testAI: () => {
    navigate('ai');
    setTimeout(() => $('#testInput')?.focus(), 120);
  },
  openLeadFlowApp: () => window.open('../leadflow/leadflow-app.html', '_blank'),
};

/* ---------------- routing ---------------- */
const routes = {
  home: renderHome,
  ai: renderAI,
  calls: renderCalls,
  appointments: renderAppointments,
  leadflow: renderLeadFlow,
  activity: renderActivity,
  requests: renderRequests,
  settings: renderSettings,
  billing: renderSettings,
  help: renderSettings,
};

const TITLES = {
  home: 'Home', ai: 'AI Receptionist', calls: 'Calls', appointments: 'Appointments',
  leadflow: 'LeadFlow', activity: 'Activity', requests: 'Request Changes',
  settings: 'Settings', billing: 'Billing', help: 'Help & Support',
};

function parseHash() {
  const h = (location.hash || '#/home').replace(/^#\//, '');
  const [page, ...rest] = h.split('/');
  return { page: page || 'home', param: rest.join('/') };
}

function setActiveNav(page) {
  const mapped = page === 'billing' || page === 'help' ? 'settings' : page;
  $$('#sidebar .nav-item').forEach(a => a.classList.toggle('active', a.dataset.nav === mapped));
}

async function router() {
  const view = $('#view');
  const s = S.getState();

  /* auth / session gates — before anything renders */
  if (s.authRequired) {
    setActiveNav('');
    $('#topbarTitle').textContent = 'Sign in';
    view.innerHTML = '';
    const authEl = document.createElement('div');
    authEl.className = 'page';
    authEl.innerHTML = `
      <div style="display:flex;justify-content:center;padding-top:8vh">
        <div class="card" style="width:min(430px,100%)">
          <div class="card-title">🔐 Sign in to your Hub</div>
          <p class="cell-dim" style="font-size:0.84rem;margin:0 0 12px">Your Hub shows your live business data from the VantorX platform.</p>
          <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="hubEmail" type="email" autocomplete="username"/></div>
          <div class="form-group"><label class="form-label">Password</label><input class="form-input" id="hubPass" type="password" autocomplete="current-password"/></div>
          <div id="hubAuthErr"></div>
          <div style="display:flex;gap:9px;margin-top:14px;flex-wrap:wrap">
            <button class="btn btn-gold" id="hubGo" style="flex:1">Sign In</button>
            <button class="btn btn-ghost" id="hubDemo" style="flex:1">⚡ Demo Preview</button>
          </div>
          <div style="margin-top:14px;text-align:center">
            <a class="cell-dim" href="/" style="font-size:0.8rem;text-decoration:none">← Return to VantorX Portal</a>
          </div>
        </div>
      </div>`;
    view.appendChild(authEl);
    authEl.querySelector('#hubGo').addEventListener('click', async () => {
      const email = authEl.querySelector('#hubEmail').value.trim();
      const pass = authEl.querySelector('#hubPass').value;
      authEl.querySelector('#hubAuthErr').innerHTML = '';
      const r = await S.platformLogin(email, pass);
      if (!r.ok) { authEl.querySelector('#hubAuthErr').innerHTML = `<div class="cx-error">✕ ${U.esc(r.error)}</div>`; return; }
      router();
    });
    authEl.querySelector('#hubDemo').addEventListener('click', () => {
      mountDemoMode();
      toast('Welcome to Apex Plumbing Interactive Hub Demo', 'success');
      router();
    });
    authEl.querySelector('#hubPass').addEventListener('keydown', e => { if (e.key === 'Enter') authEl.querySelector('#hubGo').click(); });
    closeMobileNav();
    return;
  }
  if (s.adminAccount) {
    setActiveNav('');
    view.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'page';
    el.innerHTML = `<div style="display:flex;justify-content:center;padding-top:8vh">
      <div class="card" style="width:min(520px,100%)">${emptyState('🛡️', 'Platform admin account', 'The Client Hub is for business owner and staff accounts. Use the VantorX Admin console to manage tenants.', '<a class="btn btn-gold btn-sm" href="/vantorx-admin/admin-app.html" style="text-decoration:none">Open Admin console →</a>')}</div>
    </div>`;
    view.appendChild(el);
    closeMobileNav();
    return;
  }
  if (s.serverError) {
    setActiveNav('');
    view.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'page';
    el.innerHTML = `<div class="card">${emptyState('📡', 'Platform server not reachable', U.esc(s.serverError) + ' The Hub only shows real platform data — it stays empty until the server responds.', '<a class="btn btn-ghost btn-sm" href="/" style="text-decoration:none">← Portal home</a>')}</div>`;
    view.appendChild(el);
    closeMobileNav();
    return;
  }
  if (s.needOnboarding) {
    setActiveNav('');
    $('#topbarTitle').textContent = 'Welcome';
    view.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'page';
    el.innerHTML = `<div style="display:flex;justify-content:center;padding-top:8vh">
      <div class="card" style="width:min(560px,100%)">${emptyState('🚀', 'Your business is being set up', 'Your VantorX team is building and configuring your system for you. You will get access here as soon as it is ready — contact your VantorX representative if you have questions.')}</div>
    </div>`;
    view.appendChild(el);
    closeMobileNav();
    return;
  }

  const { page, param } = parseHash();
  const render = routes[page] || renderHome;
  setActiveNav(page);
  $('#topbarTitle').textContent = TITLES[page] || 'VantorX Hub';
  view.innerHTML = '';
  const pageEl = document.createElement('div');
  pageEl.className = 'page';
  view.appendChild(pageEl);
  try {
    await render(pageEl, ctx, param);
  } catch (err) {
    console.error('Render failed on', page, err);
    pageEl.innerHTML = `<div class="card">${emptyState('⚠️', 'Something went wrong', 'This section failed to load. Try navigating again — the rest of the Hub still works.')}</div>`;
  }
  closeMobileNav();
  $('.content').scrollTop = 0;
}

window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', async () => { await S.init(); paintIdentity(); router(); });

/* ---------------- identity (sidebar biz card + avatar) ---------------- */
function paintIdentity() {
  const s = S.getState();
  const name = s.account?.name || 'Client';
  $('#bizName').textContent = s.business?.name || '—';
  $('#bizPlan').textContent = s.business?.industry || 'Client Portal';
  $('#avatarName').textContent = name.split(' ')[0];
  $('#avatarInitials').textContent = name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
}

/* ---------------- navigation helper ---------------- */
function navigate(route, opts = {}) {
  if (route === 'requests' && opts.prefill) setRequestPrefill(opts.prefill);
  if (route === 'leadflow' && opts.tab) setLeadFlowTab(opts.tab);
  const target = '#/' + route;
  if (location.hash === target) router(); // same-route re-render
  else location.hash = target;
}

/* ---------------- sidebar / mobile drawer ---------------- */
const sidebar = $('#sidebar');
const scrim = $('#mobileScrim');

function closeMobileNav() {
  sidebar.classList.remove('mobile-open');
  scrim.hidden = true;
}
$('#menuBtn').addEventListener('click', () => {
  sidebar.classList.add('mobile-open');
  scrim.hidden = false;
});
scrim.addEventListener('click', closeMobileNav);
$$('#sidebar .nav-item').forEach(a => a.addEventListener('click', closeMobileNav));

/* ---------------- notifications ---------------- */
function refreshNotifDot() {
  const unread = notificationService.unreadCount();
  $('#notifDot').classList.toggle('show', unread > 0);
}

function openNotifications() {
  const items = notificationService.getNotifications();
  const unread = notificationService.unreadCount();
  openModal({
    title: `Notifications${unread ? ` · ${unread} new` : ''}`,
    wide: true,
    body: items.length ? `<div>${items.map(n => `
      <div class="list-row" ${n.link ? `data-go="${n.link}"` : ''} style="${n.read ? 'opacity:0.6' : ''}">
        <div class="row-ico" style="background:var(--bg-hover)">${n.icon || '•'}</div>
        <div class="row-main">
          <div class="row-title">${U.esc(n.title)}</div>
          <div class="row-sub">${U.esc(n.body || '')}</div>
        </div>
        <div class="row-time">${U.relTime(n.at)}</div>
      </div>`).join('')}</div>`
      : emptyState('◔', 'No notifications', 'Updates from your AI, bookings, and leads will appear here.'),
    footer: `<button class="btn btn-ghost btn-sm" data-close2>Close</button>`,
    onOpen: ({ modal, close }) => {
      modal.querySelector('[data-close2]').addEventListener('click', close);
      modal.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { close(); navigate(b.dataset.go); }));
    },
  });
  notificationService.markAllRead();
  refreshNotifDot();
}

$('#notifBtn').addEventListener('click', openNotifications);

/* ---------------- account menu ---------------- */
$('#accountBtn').addEventListener('click', openAccount);
$('#bizCard').addEventListener('click', openAccount);

function openAccount() {
  const a = S.getState().account;
  const b = S.getState().business;
  openModal({
    title: 'Account',
    body: `
      <div class="kv-list">
        <div class="kv-row"><div class="kv-label">Signed in</div><div class="kv-value">${U.esc(a.name)}<div class="cell-dim">${U.esc(a.email)}</div></div></div>
        <div class="kv-row"><div class="kv-label">Business</div><div class="kv-value">${U.esc(b.name)}<div class="cell-dim">${U.esc(b.industry || '')}</div></div></div>
        <div class="kv-row"><div class="kv-label">Billing</div><div class="kv-value">Managed by your VantorX agreement</div></div>
      </div>
      <div style="display:flex;gap:9px;margin-top:16px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" data-act="billing">Billing</button>
        <button class="btn btn-ghost btn-sm" data-act="settings">Settings</button>
        <button class="btn btn-ghost btn-sm" data-act="signout" style="color:var(--red)">Sign out</button>
      </div>`,
    onOpen: ({ modal, close }) => {
      modal.querySelector('[data-act="billing"]').addEventListener('click', () => { close(); navigate('billing'); });
      modal.querySelector('[data-act="settings"]').addEventListener('click', () => { close(); navigate('settings'); });
      modal.querySelector('[data-act="signout"]').addEventListener('click', async () => {
        close();
        await S.platformLogout();
        router();
        toast('Signed out', 'info');
      });
    },
  });
}

/* ---------------- global search (live dropdown) ---------------- */
const searchInput = $('#globalSearch');
const searchWrap = $('#topbarSearchWrap');
let searchBox = null;

function searchAll(q) {
  const s = q.toLowerCase();
  const st = S.getState();
  const out = [];
  (st.calls || []).forEach(c => {
    // raw server rows: seeded calls use from/at; web-test calls add caller/phone
    const who = c.from || c.caller || '';
    const num = c.phone || c.from || '';
    if (who.toLowerCase().includes(s) || num.toLowerCase().includes(s))
      out.push({ kind: 'Call', label: who, sub: `${c.outcome || ''} · ${U.relTime(c.at || c.createdAt)}`, go: () => navigate('calls') });
  });
  (st.appointments || []).forEach(a => {
    if ((a.customer || '').toLowerCase().includes(s) || (a.service || '').toLowerCase().includes(s))
      out.push({ kind: 'Appointment', label: a.customer, sub: `${a.service || ''} · ${U.fmtDate(a.at || a.createdAt)}`, go: () => navigate('appointments') });
  });
  (st.leads || []).forEach(l => {
    if (l.name.toLowerCase().includes(s) || (l.source || '').toLowerCase().includes(s))
      out.push({ kind: 'Lead', label: l.name, sub: `${l.source} · ${l.status}`, go: () => navigate('leadflow') });
  });
  (st.tasks || []).forEach(t => {
    if ((t.leadName || '').toLowerCase().includes(s))
      out.push({ kind: 'Follow-up', label: t.leadName, sub: `${t.type} · ${U.relTime(t.dueAt)}`, go: () => navigate('leadflow', { tab: 'queue' }) });
  });
  return out.slice(0, 8);
}

function closeSearch() {
  if (searchBox) { searchBox.remove(); searchBox = null; }
}

function renderSearchResults() {
  closeSearch();
  const q = searchInput.value.trim();
  if (q.length < 2) return;
  const hits = searchAll(q);
  searchBox = document.createElement('div');
  searchBox.className = 'search-results';
  if (!hits.length) {
    searchBox.innerHTML = `<div class="sr-item"><span class="cell-dim">No matches for "${U.esc(q)}"</span></div>`;
  } else {
    hits.forEach(h => {
      const row = document.createElement('div');
      row.className = 'sr-item';
      row.innerHTML = `<span><strong>${U.esc(h.label)}</strong>&nbsp; <span class="cell-dim">${U.esc(h.sub)}</span></span><span class="sr-kind">${U.esc(h.kind)}</span>`;
      row.addEventListener('click', () => { searchInput.value = ''; closeSearch(); h.go(); });
      searchBox.appendChild(row);
    });
  }
  searchWrap.appendChild(searchBox);
}

searchInput.addEventListener('input', renderSearchResults);
searchInput.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSearch(); searchInput.blur(); } });
document.addEventListener('click', e => { if (searchBox && !e.target.closest('#topbarSearchWrap')) closeSearch(); });

/* "/" focuses search, "n" opens request form */
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/input|textarea|select/i.test(e.target.tagName) && S.getState().signedIn && !S.getState().needOnboarding) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key.toLowerCase() === 'n' && !e.metaKey && !e.ctrlKey && !e.altKey &&
      !/input|textarea|select/i.test(e.target.tagName) && S.getState().signedIn && !S.getState().needOnboarding) {
    e.preventDefault();
    navigate('requests');
  }
});

/* ---------------- boot ---------------- */
let lastState = S.getState();
S.subscribe(s => {
  refreshNotifDot();
  if (!!s.signedIn !== !!lastState.signedIn || !!s.needOnboarding !== !!lastState.needOnboarding ||
      !!s.authRequired !== !!lastState.authRequired) {
    lastState = s;
    paintIdentity();
    router();
  }
  lastState = s;
});


</script>
