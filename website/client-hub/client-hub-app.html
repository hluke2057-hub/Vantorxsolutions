/* ---- js/utils.js ---- */
/* ============================================================
   VANTORX CLIENT HUB — utils.js
   Shared helpers. No dependencies.
   ============================================================ */

const STATUS_META = {
  Submitted:   { cls: 'req-status-submitted',   icon: '📨' },
  'In Review': { cls: 'req-status-in-review',   icon: '🔎' },
  'In Progress': { cls: 'req-status-in-progress', icon: '🛠️' },
  'Waiting on Client': { cls: 'req-status-waiting', icon: '⏸️' },
  Completed:   { cls: 'req-status-completed',   icon: '✅' },
};

const CALL_OUTCOMES = {
  answered:    { label: 'Answered',    cls: 'status-green' },
  missed:      { label: 'Missed',      cls: 'status-red' },
  transferred: { label: 'Transferred', cls: 'status-purple' },
  booked:      { label: 'Booked',      cls: 'status-gold' },
  faq:         { label: 'Question Answered', cls: 'status-blue' },
};

const APPT_STATUS = {
  Confirmed:  'status-green',
  Completed:  'status-dim',
  Rescheduled: 'status-orange',
  Cancelled:  'status-red',
};

function esc(s) {
  return String(s ?? '')
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;').replaceAll("'", '&#39;');
}

function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}

function fmtDateTime(iso) {
  return `${fmtDate(iso)} · ${fmtTime(iso)}`;
}

function fmtDuration(sec) {
  if (sec == null) return '—';
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}m ${String(s).padStart(2, '0')}s`;
}

function relTime(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const min = Math.round(diff / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return `${min}m ago`;
  const h = Math.round(min / 60);
  if (h < 24) return `${h}h ago`;
  const d = Math.round(h / 24);
  if (d < 7) return `${d}d ago`;
  return fmtDate(iso);
}

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

function uid(prefix = 'id') {
  return `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
}

/* Deterministic PRNG so demo data is stable across reloads until edited */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function scoreBar(score) {
  return `<span class="score-bar"><i style="width:${Math.min(100, score)}%"></i></span>${score}`;
}

function initials(name) {
  return String(name || '?').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
}

function groupBy(arr, keyFn) {
  return arr.reduce((acc, item) => {
    const k = keyFn(item);
    (acc[k] = acc[k] || []).push(item);
    return acc;
  }, {});
}

function monthLabel(y, m) {
  return new Date(y, m, 1).toLocaleDateString([], { month: 'long', year: 'numeric' });
}

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}


/* ---- js/live.js ---- */
/* ============================================================
   VANTORX CLIENT HUB — live.js (PRODUCTION data plumbing)
   Real platform server is the ONLY source of truth. Adapters
   map server rows to the UI shapes. Unknown values are null or
   omitted — never invented. No demo data anywhere.
   ============================================================ */

async function api(method, path, body) {
  let res;
  try {
    res = await fetch(path, {
      method,
      credentials: 'same-origin',
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    return { ok: false, status: 0, error: 'Platform backend not reachable. Please check your connection and reload.' };
  }
  let data = {};
  try { data = await res.json(); } catch { /* empty */ }
  if (!res.ok) return { ok: false, status: res.status, error: data.error || `HTTP ${res.status}`, ...data };
  return { ok: true, status: res.status, ...data };
}

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

/* ---------------- adapters ---------------- */

function adaptCall(row, appointments) {
  const blocks = String(row.transcript || '')
    .split(' / ')
    .filter(Boolean)
    .map(line => {
      const i = line.indexOf(':');
      return i > 0
        ? { who: /^(caller|client|customer)/i.test(line.slice(0, i)) ? 'human' : 'ai', text: line.slice(i + 1).trim(), t: '' }
        : { who: 'ai', text: line, t: '' };
    });
  const bookedAppt = (appointments || []).find(a =>
    new Date(a.at).getTime() - new Date(row.at).getTime() >= 0 &&
    new Date(a.at).getTime() - new Date(row.at).getTime() < 7 * 864e5);
  return {
    id: row.id,
    caller: (row.from || '').replace(/^\+1\s*/, '') || 'Unknown caller',
    phone: row.from || '',
    date: row.at,
    duration: null,                    // server does not record call length yet — shown honestly as —
    outcome: row.outcome || 'info',
    summary: row.summary || '',
    apptId: bookedAppt ? bookedAppt.id : null,
    transcriptBlocks: blocks,
    note: row.notes || '',
  };
}

function adaptLead(row) {
  return {
    id: row.id,
    name: row.name,
    service: null,                     // real lead source does not track a service — not shown
    source: row.source || '—',
    status: row.status || 'New',
    score: null,                       // no server-side lead scoring — no fake score bars
    lastContact: row.updatedAt || row.createdAt || null,
    nextFollowUp: null,                // real follow-up scheduling lives in LeadFlow; measured there, not invented here
    phone: row.phone || '',
    email: row.email || '',
    notes: row.notes || '',
  };
}

function statusToHub(serverStatus) {
  return serverStatus === 'Open' ? 'Submitted' : serverStatus === 'In Progress' ? 'In Progress' : 'Completed';
}
function statusToServer(hubStatus) {
  return hubStatus === 'Submitted' ? 'Open' : hubStatus;
}

/* ---------------- session + tenant discovery ---------------- */

const session = { user: null, bizId: null, needOnboarding: false };

async function discoverSession() {
  const me = await api('GET', '/api/auth/me');
  if (!me.ok || !me.user) return 'signin';
  if (me.user.role === 'vantorx_admin') return 'admin';
  session.user = me.user;

  for (let i = 0; i < 10; i++) {
    const b = await api('GET', '/api/businesses');
    if (b.status === 200 && b.rows && b.rows.length) { session.bizId = b.rows[0].id; break; }
    if (b.status === 200 && (!b.rows || !b.rows.length)) {
      session.needOnboarding = true;
      return 'onboard';
    }
    if (b.status === 404) { await sleep(400); continue; }
    return 'error';
  }
  if (!session.bizId) return 'onboard';
  return 'ready';
}


/* ---- js/state.js ---- */
/* ============================================================
   VANTORX CLIENT HUB — state.js (PRODUCTION)
   The platform server is the single source of truth.
   This module keeps a read-model of real server rows and the
   session context; pages stay synchronous via a stable snapshot.
   There is NO demo dataset and NO localStorage truth: if the
   server is unreachable, pages render honest empty states.
   ============================================================ */

let snapshot = {
  ready: false,
  signedIn: false,
  needOnboarding: false,
  authRequired: false,
  adminAccount: false,
  serverError: null,
  business: { name: '', phone: '', email: '', address: '' },
  ai: { name: 'Ava', status: 'offline', calendar: 'the online calendar', transferNumber: '' },
  account: { name: '', email: '' },
  calls: [], appointments: [], leads: [], tasks: [],
  notifications: [], activity: [], requests: [], aiTests: [],
};
const listeners = new Set();

function getState() { return snapshot; }
function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }
function emit() { listeners.forEach(fn => { try { fn(snapshot); } catch (e) { console.error(e); } }); }

async function refresh() {
  const r = await api('GET', '/api/health');
  if (!r.ok) { snapshot = { ...snapshot, ready: true, serverError: r.error, signedIn: false }; emit(); return snapshot; }
  snapshot = { ...snapshot, ready: true, serverError: null };
  emit();
  return snapshot;
}

async function init() {
  const mode = await discoverSession();
  if (mode === 'signin') { snapshot = { ...snapshot, authRequired: true, signedIn: false, ready: true }; emit(); return; }
  if (mode === 'admin') { snapshot = { ...snapshot, adminAccount: true, signedIn: true, ready: true }; emit(); return; }
  if (mode === 'error') { snapshot = { ...snapshot, ready: true, serverError: 'Could not load tenant data' }; emit(); return; }

  // ready | onboard — refresh real rows
  await hydrate();
}

async function hydrate() {
  const bizId = session.bizId;
  const [bizR, callR, apptR, leadR, notifR, reqR, cfgR] = await Promise.all([
    api('GET', '/api/businesses'),
    api('GET', '/api/calls'),
    api('GET', '/api/appointments'),
    api('GET', '/api/leads'),
    api('GET', '/api/notifications'),
    api('GET', '/api/change-requests'),
    api('GET', `/api/receptionist/config?businessId=${encodeURIComponent(bizId)}`),
  ]);

  const biz = (bizR.rows || []).find(b => b.id === bizId) || {};
  const cfg = (cfgR && cfgR.config) || {};
  const prof = cfg.profile || {};
  const know = cfg.knowledge || {};
  const pol = know.policies || {};

  /* activity timeline derived from real server rows (no invented events) */
  const activity = [
    ...(callR.rows || []).map(c => ({ type: 'calls', icon: '📞', title: `Call — ${c.from || c.caller || 'Unknown caller'}`, desc: c.summary || c.outcome || '', at: c.at || c.createdAt })),
    ...(apptR.rows || []).map(a => ({ type: 'appointments', icon: '📅', title: `Appointment — ${a.customer}`, desc: [a.service, a.status].filter(Boolean).join(' · '), at: a.at || a.createdAt })),
    ...(leadR.rows || []).map(l => ({ type: 'leads', icon: '🎯', title: `Lead — ${l.name}`, desc: [l.source, l.status].filter(Boolean).join(' · '), at: l.createdAt || l.updatedAt })),
    ...(reqR.rows || []).map(r => ({ type: 'account', icon: '📨', title: `Change request — ${r.type}`, desc: r.detail || r.status || '', at: r.at })),
  ].filter(x => x.at).sort((a, b) => new Date(b.at) - new Date(a.at));

  snapshot = {
    ...snapshot,
    __bizId: bizId,
    signedIn: true,
    authRequired: false,
    adminAccount: false,
    needOnboarding: !biz.id,
    ready: true,
    serverError: null,
    business: {
      name: biz.name || '',
      phone: biz.phone || '',
      email: biz.email || '',
      address: biz.city || '',
      industry: biz.industry || '',
    },
    ai: {
      name: (biz.receptionist && biz.receptionist.name) || 'Ava',
      status: cfg.active ? 'online' : 'offline',
      calendar: 'the platform calendar',
      transferNumber: prof.transferNumber || '',
      knowledge: {
        policies: pol.cancellation || '',
        payments: pol.payment || '',
        faqs: know.faqs || [],
      },
    },
    account: { name: (session.user && session.user.name) || (session.user && session.user.email) || '', email: (session.user && session.user.email) || '' },
    calls: (callR.rows || []).slice(),
    appointments: (apptR.rows || []).slice(),
    leads: (leadR.rows || []).slice(),
    tasks: [],
    notifications: (notifR.rows || []).slice(),
    activity,
    requests: (reqR.rows || []).slice(),
    aiTests: [],
  };
  emit();
}

async function setState(mutator) {
  mutator(snapshot);
  emit();                          // optimistic paint; hydrate() re-syncs after writes
}

/* sign in from the auth screen, then load tenant data */
async function platformLogin(email, password) {
  const r = await api('POST', '/api/auth/login', { email, password });
  if (!r.ok) return { ok: false, error: r.error || 'Login failed' };
  const mode = await discoverSession();
  if (mode === 'admin') { snapshot = { ...snapshot, adminAccount: true, signedIn: true, ready: true }; emit(); return { ok: true }; }
  if (mode === 'signin' || mode === 'error') return { ok: false, error: 'Could not load a business tenant for this account' };
  await hydrate();
  return { ok: true };
}

async function platformLogout() {
  await api('POST', '/api/auth/logout', {});
  snapshot = {
    ...snapshot,
    signedIn: false, authRequired: true, adminAccount: false,
    __bizId: null,
    calls: [], appointments: [], leads: [], tasks: [], notifications: [], activity: [], requests: [],
    business: { name: '', phone: '', email: '', address: '' },
    account: { name: '', email: '' },
  };
  emit();
}

/* ---------------- write-through actions (server → re-hydrate) ---------------- */

async function persistProfilePatch(patch) {
  const r = await api('PATCH', `/api/businesses/${encodeURIComponent(session.bizId)}`, patch);
  if (!r.ok) return r;
  await hydrate();
  return r;
}

async function saveRxProfile(patch) {
  const r = await api('PUT', `/api/receptionist/config`, { businessId: session.bizId, ...patch });
  if (!r.ok) return r;
  await hydrate();
  return r;
}

async function rxActivate() {
  return api('POST', '/api/receptionist/activate', { action: 'activate', businessId: session.bizId });
}
async function rxDeactivate() {
  const r = await api('POST', '/api/receptionist/activate', { action: 'deactivate', businessId: session.bizId });
  if (r.ok) await hydrate();
  return r;
}

async function createChangeRequest(type, description) {
  const r = await api('POST', '/api/change-requests', { businessId: session.bizId, type, detail: description });
  if (!r.ok) return r;
  await hydrate();
  return r;
}

async function cancelAppointment(id) {
  const r = await api('PATCH', `/api/appointments/${encodeURIComponent(id)}`, { status: 'Cancelled' });
  if (!r.ok) return r;
  await hydrate();
  return r;
}

async function rescheduleAppointment(id, date) {
  const r = await api('PATCH', `/api/appointments/${encodeURIComponent(id)}`, { at: date });
  if (!r.ok) return r;
  await hydrate();
  return r;
}

async function markNotificationsRead(id) {
  const r = await api('POST', '/api/notifications/read', id ? { id } : {});
  if (!r.ok) return r;
  await hydrate();
  return r;
}

}

}


/* ---- js/services/notificationService.js ---- */
/* ============================================================
   SERVICE: notificationService (PRODUCTION — real server rows)
   ============================================================ */

function adaptNotif(row) {
  return {
    id: row.id,
    title: row.title || '',
    body: row.body || '',
    at: row.at,
    read: !!row.read,
    link: null,
    icon: '•',
  };
}

const notificationService = {

function adaptCallRow(row) {
  /* server rows come in two real shapes: seeded call log (from + string
     transcript) and web-test sessions (caller/phone, durationSec, array
     transcript, appointmentId). Handle both — never invent fields. */
  const from = row.from || row.caller || 'Unknown caller';
  const phone = row.phone || row.from || '';
  const transcriptBlocks = Array.isArray(row.transcript)
    ? row.transcript.map(t => ({ who: t.role === 'caller' ? 'human' : 'ai', text: t.text || '', t: t.at || '' }))
    : String(row.transcript || '').split(' / ').filter(Boolean).map(line => {
        const i = line.indexOf(':');
        return i > 0 ? { who: /^(caller|client|customer)/i.test(line.slice(0, i)) ? 'human' : 'ai', text: line.slice(i + 1).trim(), t: '' }
                     : { who: 'ai', text: line, t: '' };
      });
  const outcome = row.outcome === 'appointment-booked' ? 'booked' : (row.outcome || 'info');
  return {
    id: row.id,
    caller: from.replace(/^\+1\s*/, ''),
    phone,
    date: row.at || row.createdAt,
    duration: (row.durationSec != null) ? row.durationSec : null,   // only web-test rows carry it
    outcome,
    summary: row.summary || '',
    transcriptBlocks,
    apptId: row.appointmentId || null,
    handled: row.handledBy === 'AI' ? 'AI receptionist' : (row.handledBy || 'AI receptionist'),
    note: row.notes || '',
  };
}

const callService = {
  getCalls() { return getState().calls.map(adaptCallRow).sort((a, b) => new Date(b.date) - new Date(a.date)); },
  getCall(id) { return this.getCalls().find(c => c.id === id) || null; },

  metrics() {
    const calls = this.getCalls();
    const today = new Date().toDateString();
    const answered = calls.filter(c => c.outcome !== 'missed');
    const booked = calls.filter(c => c.outcome === 'booked');
    return {
      total: calls.length,
      answered: answered.length,
      missed: calls.filter(c => c.outcome === 'missed').length,
      transferred: calls.filter(c => c.outcome === 'transferred').length,
      booked: booked.length,
      faq: calls.filter(c => c.outcome === 'faq' || c.outcome === 'info').length,
      answeredRate: calls.length ? Math.round((answered.length / calls.length) * 100) : 0,
      today: calls.filter(c => new Date(c.date).toDateString() === today).length,
      missedToday: calls.filter(c => c.outcome === 'missed' && new Date(c.date).toDateString() === today).length,
    };
  },
  callsToday() { const t = new Date().toDateString(); return this.getCalls().filter(c => new Date(c.date).toDateString() === t); },
  answeredToday() { return this.callsToday().filter(c => c.outcome !== 'missed').length; },
  missedToday() { return this.metrics().missedToday; },

    return { ok: false, error: 'Call notes are not stored on the platform yet — notes are attached to appointments instead.' };
  },
};

    // business profile fields → businesses PATCH (name/phone/city are the
    // writable fields); knowledge text → receptionist config PUT, which

    const profile = {};

/* ============================================================
   VANTORX CLIENT HUB — components.js
   Shared UI primitives: toasts, modal, drawer, confirm,
   empty states, skeletons.
   ============================================================ */

/* ---------- toast ---------- */

let toastZone;
function ensureToastZone() {
  if (!toastZone) {
    toastZone = document.createElement('div');
    toastZone.className = 'toast-zone';
    document.body.appendChild(toastZone);
  }
  return toastZone;
}

function toast(msg, kind = 'success') {
  const zone = ensureToastZone();
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  const icon = kind === 'success' ? '✓' : kind === 'error' ? '✕' : 'ℹ';
  el.innerHTML = `<span style="font-weight:800;color:var(--gold-bright)">${icon}</span><span>${esc(msg)}</span>`;
  zone.appendChild(el);
  setTimeout(() => {
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 260);
  }, 3400);
}

/* ---------- modal / drawer ----------
   onOpen fires after the caller has received { close } so callbacks
   can safely reference close (avoids TDZ issues). */

function openModal({ title, body, footer, onOpen, wide }) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const modal = document.createElement('div');
  modal.className = 'modal';
  if (wide) modal.style.width = 'min(720px, calc(100vw - 40px))';
  modal.innerHTML = `
    <div class="modal-head">
      <div class="modal-title">${title}</div>
      <button class="icon-btn modal-x" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">${body}</div>
    ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
  `;
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  const api = { overlay, modal };
  let closeFn = () => {};
  api.close = () => closeFn();

  closeFn = () => { overlay.remove(); document.removeEventListener('keydown', onKey); };
  function onKey(e) { if (e.key === 'Escape') closeFn(); }
  document.addEventListener('keydown', onKey);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeFn(); });
  modal.querySelector('.modal-x').addEventListener('click', closeFn);

  if (onOpen) queueMicrotask(() => onOpen(api));
  return api;
}

function openDrawer({ title, body, footer, onOpen }) {
  const overlay = document.createElement('div');
  overlay.className = 'drawer-overlay';
  const drawer = document.createElement('div');
  drawer.className = 'drawer';
  drawer.innerHTML = `
    <div class="drawer-head">
      <div class="modal-title">${title}</div>
      <button class="icon-btn modal-x" aria-label="Close">✕</button>
    </div>
    <div class="drawer-body">${body}</div>
    ${footer ? `<div class="drawer-foot">${footer}</div>` : ''}
  `;
  overlay.appendChild(drawer);
  document.body.appendChild(overlay);

  let closeFn = () => {};
  const api = { overlay, drawer, close: () => closeFn() };

  closeFn = () => { overlay.remove(); document.removeEventListener('keydown', onKey); };
  function onKey(e) { if (e.key === 'Escape') closeFn(); }
  document.addEventListener('keydown', onKey);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeFn(); });
  drawer.querySelector('.modal-x').addEventListener('click', closeFn);

  if (onOpen) queueMicrotask(() => onOpen(api));
  return api;
}

function confirmDialog({ title = 'Are you sure?', message = '', confirmText = 'Confirm', danger = false }) {
  return new Promise(resolve => {
    const m = openModal({
      title,
      body: `<p style="color:var(--text-soft);font-size:0.9rem">${esc(message)}</p>`,
      footer: `
        <button class="btn btn-ghost" data-c="no">Cancel</button>
        <button class="btn ${danger ? 'btn-red' : 'btn-gold'}" data-c="yes">${esc(confirmText)}</button>`,
      onOpen: ({ modal, close }) => {
        modal.querySelector('[data-c="no"]').addEventListener('click', () => { close(); resolve(false); });
        modal.querySelector('[data-c="yes"]').addEventListener('click', () => { close(); resolve(true); });
      },
    });
    const origClose = m.close;
    // resolve(false) if dismissed via X / overlay / Escape
    const obs = new MutationObserver(() => {
      if (!document.body.contains(m.overlay)) { obs.disconnect(); resolve(false); }
    });
    obs.observe(document.body, { childList: true });
    m.close = () => origClose();
  });
}

function emptyState(icon, title, msg, actionHTML = '') {

        <div class="row-title">${esc(l.name)} ${l.status === 'New' ? '<span class="status-pill status-blue" style="padding:1px 8px">NEW</span>' : '<span class="status-pill status-orange" style="padding:1px 8px">DUE</span>'}
        </div>
        <div class="row-sub">${esc(l.source)} · ${esc(l.status)}</div>
      </div>
      <span class="cell-dim">awaiting contact</span>
    </div>`).join('') : emptyState('🎯', 'No leads currently need attention', 'Every lead is up to date — nice work.');

  const acts = s.activity.slice(0, 6);
  root.querySelector('#recentActivity').innerHTML = acts.map(a => `
    <div class="list-row">
      <div class="row-ico" style="background:var(--bg-hover)">${a.icon}</div>
      <div class="row-main">
        <div class="row-title" style="font-size:0.82rem">${esc(a.title)}</div>
        <div class="row-sub">${esc(a.desc)}</div>
      </div>
      <div class="row-time">${relTime(a.at)}</div>
    </div>`).join('');

  /* ---------- status card buttons ---------- */
  root.querySelectorAll('[data-h]').forEach(b => b.addEventListener('click', () => {
    const h = b.dataset.h;
    if (h === 'test') ctx.testAI();
    else if (h === 'calls') ctx.navigate('calls');
    else if (h === 'ai') ctx.navigate('ai');
    else if (h === 'leads') ctx.navigate('leadflow');
    else if (h === 'queue') ctx.navigate('leadflow', { tab: 'queue' });
    else if (h === 'openlf') ctx.openLeadFlowApp();
    else if (h === 'appts') ctx.navigate('appointments');
    else if (h === 'activity') ctx.navigate('activity');
  }));
}

function kpi(icon, label, value, hint, accent = '') {
  return `
    <div class="kpi ${accent}">
      <div class="kpi-label">${icon} ${esc(label)}</div>
      <div class="kpi-value">${value}</div>
      <div class="kpi-hint">${esc(hint)}</div>
    </div>`;
}

function outcomePill(outcome) {
  const map = {
    booked: ['status-gold', 'Booked'],
    answered: ['status-blue', 'Answered'],
    faq: ['status-blue', 'Question'],
    info: ['status-blue', 'Question'],
    transferred: ['status-purple', 'Transferred'],
    missed: ['status-red', 'Missed'],
  };
  const [cls, label] = map[outcome] || ['status-dim', outcome];
  return `<span class="status-pill ${cls}"><span class="sdot"></span>${esc(label)}</span>`;
}

      hoursEl.querySelector(`[data-hr="${d}"][data-edge="close"]`).disabled = off;
    }));
  });

  root.querySelector('#saveHours').addEventListener('click', function () {
    this.disabled = true;
    const payload = { businessId: bizId };

      payload[d] = {
        open: hoursEl.querySelector(`[data-hr="${d}"][data-edge="open"]`).value,
        close: hoursEl.querySelector(`[data-hr="${d}"][data-edge="close"]`).value,
        closed: off,
      };
    });
    api('PUT', `/api/hours/${encodeURIComponent(bizId)}`, payload).then(r => {
      this.disabled = false;
      if (r.error) { toast(r.error, 'error'); return; }
      toast('Hours saved to server', 'success');
    });
  });

  /* ---------- save actions (async writes) ---------- */
  root.querySelector('#saveTransfer').addEventListener('click', function () {

    this.disabled = true;

      this.disabled = false;
      if (r && r.ok === false) { toast(r.error || 'Save failed', 'error'); return; }
      toast('Transfer number saved to server', 'success');

  });

  root.querySelector('#aiToggle').addEventListener('click', async () => {
    const nowOnline = !aiReceptionistService.getStatus().online;
    const r = await aiReceptionistService.setStatus(nowOnline);
    if (r && r.ok === false) {
      toast(r.error, 'error');
      root.querySelector('#aiToggleHint').textContent = `Blocked: ${r.error}`;
      return;
    }
    await ctx.hydrate();
    const onlineNow = aiReceptionistService.getStatus().online;
    toast(onlineNow ? 'AI Receptionist is online' : 'AI Receptionist turned offline', onlineNow ? 'success' : 'info');
  });

  root.querySelector('#saveKB').addEventListener('click', function () {
    this.disabled = true;
    (async () => {
      const profile = {};
      const kb = {};
      const name = root.querySelector('#kbName').value.trim();
      if (name && name !== s.business.name) profile.name = name;
      const r = await aiReceptionistService.updateBusinessInfo({
        name: name || undefined,
        policies: root.querySelector('#kbPolicies').value,
        payments: root.querySelector('#kbPayments').value,

      toast('Knowledge saved to the platform server', 'success');
    })();
  });

  /* ---------- test area (real talk API) ---------- */
  const input = root.querySelector('#testInput');
  const result = root.querySelector('#testResult');
  let testSession = null;
  let greeting = '';

  const ensureSession = async () => {
    if (testSession) return true;
    const r = await aiReceptionistService.startTest();
    if (r.error || !r.sessionId) { toast(r.error || 'Test console unavailable', 'error'); return false; }
    testSession = r.sessionId;
    greeting = r.greeting || '';
    return true;
  };

  const run = async () => {
    const scenario = input.value.trim();
    if (!scenario) return toast('Type a test scenario first', 'error');
    result.innerHTML = `<div style="display:flex;align-items:center;gap:10px;color:var(--text-dim);font-size:0.84rem">
      <span class="typing-dots"><i></i><i></i><i></i></span> ${esc(st.name)} is thinking…</div>`;

    if (!okStart) { result.innerHTML = ''; return; }
    const r = await aiReceptionistService.turn(testSession, scenario);
    if (r.error) { result.innerHTML = `<div class="cx-error">✕ ${esc(r.error)}</div>`; return; }
    result.innerHTML = `
      <div class="sim-bubble">
        ${greeting ? `<div class="cell-dim" style="font-size:0.72rem;margin-bottom:6px">${esc(st.name)}: "${esc(greeting)}"</div>` : ''}

      </div>`;
  };
  root.querySelector('#runTest').addEventListener('click', run);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
  root.querySelectorAll('.test-chip').forEach(c => c.addEventListener('click', () => { input.value = c.dataset.sc; run(); }));
}

/* ============================================================
   VANTORX CLIENT HUB — pages/calls.js
   Calls: metrics, searchable/filterable table, detail drawer
   with realistic transcript snippets.
   ============================================================ */

let callFilter = 'all';
let callQuery = '';

function renderCalls(root, ctx) {
  const m = callService.metrics();
  const kpis = [
    ['📞', 'Total Calls', m.total], ['✅', 'Answered', m.answered], ['📵', 'Missed', m.missed],
    ['🙋', 'Transferred', m.transferred], ['📅', 'Appointments Booked', m.booked],
  ];

  root.innerHTML = `
    <div class="page-head">
      <div class="page-title">Calls</div>
      <div class="page-sub">Every call your AI receptionist handled — searchable and linked to appointments.</div>
    </div>

    <div class="kpi-grid" style="grid-template-columns:repeat(5,1fr)">
      ${kpis.map(([i, l, v]) => `
        <div class="kpi" data-kpi="${l}">
          <div class="kpi-label">${i} ${esc(l)}</div>
          <div class="kpi-value">${v}</div>
        </div>`).join('')}
    </div>

    <div class="card">
      <div class="filter-bar">
        <div class="seg" id="callFilters">
          ${[['all', 'All'], ['answered', 'Answered'], ['missed', 'Missed'], ['transferred', 'Transferred'], ['booked', 'Appointment Booked']]
            .map(([v, l]) => `<button data-f="${v}" class="${callFilter === v ? 'active' : ''}">${l}</button>`).join('')}
        </div>
        <input class="search-input" id="callSearch" placeholder="Search caller or phone…" value="${esc(callQuery)}"/>
        <span class="result-count" id="callCount"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Caller</th><th>Phone</th><th>Date</th><th>Time</th><th>Duration</th>
            <th>Outcome</th><th>Handled By</th><th>Appointment</th>
          </tr></thead>
          <tbody id="callRows"></tbody>
        </table>
        <div id="callEmpty"></div>
      </div>
    </div>
  `;

  const tbody = root.querySelector('#callRows');
  const emptyEl = root.querySelector('#callEmpty');

  function drawRows() {
    const q = callQuery.toLowerCase();
    let calls = callService.getCalls();
    if (callFilter === 'answered') calls = calls.filter(c => c.outcome !== 'missed');
    else if (callFilter !== 'all') calls = calls.filter(c => c.outcome === callFilter);
    if (q) calls = calls.filter(c => c.caller.toLowerCase().includes(q) || c.phone.includes(q));

    root.querySelector('#callCount').textContent = `${calls.length} call${calls.length === 1 ? '' : 's'}`;
    emptyEl.innerHTML = '';
    if (!calls.length) {
      tbody.innerHTML = '';
      emptyEl.innerHTML = emptyState('📞', 'No calls match', callQuery
        ? 'Try a different name or number — or clear the filter.'
        : 'No calls yet. Calls to your VantorX number will appear here automatically.');
      return;
    }
    tbody.innerHTML = calls.map(c => {
      const appt = c.apptId ? appointmentService.getAppointment(c.apptId) : null;
      return `
      <tr data-call="${c.id}" data-clickable>
        <td><div class="cell-main">${esc(c.caller)}</div></td>
        <td class="cell-dim">${esc(c.phone)}</td>
        <td class="cell-dim">${fmtDate(c.date)}</td>
        <td class="cell-dim">${fmtTime(c.date)}</td>
        <td class="cell-dim">${fmtDuration(c.duration)}</td>
        <td>${outcomePill(c.outcome)}</td>
        <td class="cell-dim">${esc(c.handled)}</td>
        <td>${appt ? `<span class="chip" style="background:var(--gold-dim);color:var(--gold-bright);border-color:rgba(212,175,55,0.3)">${fmtTime(appt.date)} ✓</span>` : '<span class="cell-dim">—</span>'}</td>
      </tr>`;
    }).join('');
    tbody.querySelectorAll('[data-call]').forEach(tr =>
      tr.addEventListener('click', () => openCallDetail(tr.dataset.call, ctx)));
  }

  drawRows();

  root.querySelectorAll('#callFilters button').forEach(b => b.addEventListener('click', () => {
    callFilter = b.dataset.f;
    root.querySelectorAll('#callFilters button').forEach(x => x.classList.toggle('active', x === b));
    drawRows();
  }));
  root.querySelector('#callSearch').addEventListener('input', debounce(e => { callQuery = e.target.value; drawRows(); }, 180));
}

      </div>

      <div style="margin-top:18px">

        ${c.transcriptBlocks.map(t => `
          <div class="tr-line">
            <div class="tr-who ${t.who}">${t.who === 'ai' ? 'AI' : t.who === 'human' ? 'Caller' : 'Sys'}</div>
            <div class="tr-text">${esc(t.text)}<div class="tr-time">${esc(t.t)}</div></div>
          </div>`).join('')}
        </div>
      </div>

      <div style="margin-top:18px">
        <div class="card-title" style="font-size:0.85rem">Your note</div>
        <textarea class="form-textarea" id="callNote" rows="2" placeholder="Add an internal note about this call…">${esc(c.note || '')}</textarea>
      </div>
    `,
    footer: `
      ${appt ? '<button class="btn btn-ghost btn-sm" data-a="appt">View Appointment</button>' : ''}
      <button class="btn btn-ghost btn-sm" data-a="note">Add Note</button>
      <button class="btn btn-gold btn-sm" data-a="help">Request Help</button>`,
    onOpen: ({ drawer, close }) => {
      drawer.querySelector('[data-a="note"]').addEventListener('click', async () => {
        const v = drawer.querySelector('#callNote').value.trim();
        if (!v) return toast('Write the note first', 'error');
        const r = await callService.addNote(id, v);
        if (r && r.ok === false) { toast(r.error, 'error'); return; }
        toast('Note saved to call record', 'success');
      });
      drawer.querySelector('[data-a="help"]').addEventListener('click', () => {
        close();
        ctx.navigate('requests', { prefill: `Help with call from ${c.caller} (${fmtDate(c.date)}): ` });
      });
      drawer.querySelector('[data-a="appt"]')?.addEventListener('click', () => {
        close();
        ctx.openAppointment(appt.id);
      });
    },
  });
}

/* ============================================================
   VANTORX CLIENT HUB — pages/appointments.js
   Appointments: tabs, metrics, table with reschedule/cancel,
   and Day / Week / Month calendar views (local demo state).
   ============================================================ */

const APPT_PILL = { Confirmed: 'status-green', Completed: 'status-dim', Rescheduled: 'status-orange', Cancelled: 'status-red' };
let apptTab = 'upcoming';
let calMode = 'month';
let calCursor = new Date();

function renderAppointments(root, ctx) {
  const m = appointmentService.metrics();
  const now = new Date();

  /* tab counts are recomputed on every table draw so they stay true after
     server writes (cancel/reschedule re-hydrate the snapshot) */
  function counts() {
    const all = appointmentService.getAppointments();
    return {
      upcoming: all.filter(a => new Date(a.date) > now && a.status !== 'Cancelled').length,
      today: all.filter(a => sameDay(new Date(a.date), now) && a.status !== 'Cancelled').length,
      past: all.filter(a => new Date(a.date) < now && a.status !== 'Cancelled').length,
      cancelled: all.filter(a => a.status === 'Cancelled').length,
    };
  }

  root.innerHTML = `
    <div class="page-head">
      <div class="page-title">Appointments</div>
      <div class="page-sub">Booked by your AI receptionist — stored live on the platform server.</div>
    </div>

    <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
      ${[['📅', 'Upcoming', m.upcoming], ['🤖', 'Booked by AI', m.bookedByAI], ['🔁', 'Rescheduled', m.rescheduled], ['🚫', 'Cancelled', m.cancelled]]
        .map(([i, l, v]) => `<div class="kpi"><div class="kpi-label">${i} ${esc(l)}</div><div class="kpi-value">${v}</div></div>`).join('')}
    </div>

    <div class="tabs">
      ${[['upcoming', 'Upcoming'], ['today', 'Today'], ['past', 'Past'], ['cancelled', 'Cancelled']]
        .map(([v, l]) => `<button class="tab ${apptTab === v ? 'active' : ''}" data-tab="${v}">${l}<span class="tab-count" data-count="${v}">0</span></button>`).join('')}
    </div>

    <div class="section-stack">
      <div class="card">
        <div class="card-title">📋 Appointments</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Customer</th><th>Service</th><th>Date</th><th>Time</th><th>Booked By</th><th>Status</th><th style="width:150px">Actions</th></tr></thead>
            <tbody id="apptRows"></tbody>
          </table>
          <div id="apptEmpty"></div>
        </div>
      </div>

      <div class="card">
        <div class="cal-head">
          <div class="card-title" style="margin-bottom:0">🗓️ Calendar</div>
          <div class="seg" id="calSeg">
            ${[['day', 'Day'], ['week', 'Week'], ['month', 'Month']].map(([v, l]) => `<button data-m="${v}" class="${calMode === v ? 'active' : ''}">${l}</button>`).join('')}
          </div>
          <span style="flex:1"></span>
          <button class="icon-btn" id="calPrev">‹</button>
          <div class="cal-title" id="calTitle"></div>
          <button class="icon-btn" id="calNext">›</button>
          <button class="btn btn-ghost btn-sm" id="calToday">Today</button>
        </div>
        <div id="calBody"></div>
      </div>
    </div>
  `;

  /* ---------- table ---------- */
  function drawTable() {
    const fresh = appointmentService.getAppointments(); // re-read after server writes
    const c = counts();
    root.querySelectorAll('[data-count]').forEach(el => { el.textContent = c[el.dataset.count]; });
    const rows = fresh.filter(a => {
      const d = new Date(a.date);
      if (apptTab === 'cancelled') return a.status === 'Cancelled';
      if (a.status === 'Cancelled') return false;
      if (apptTab === 'upcoming') return d > now;
      if (apptTab === 'today') return sameDay(d, now);
      if (apptTab === 'past') return d < now;
      return true;
    });
    const tbody = root.querySelector('#apptRows');
    const emptyEl = root.querySelector('#apptEmpty');
    emptyEl.innerHTML = '';
    if (!rows.length) {
      tbody.innerHTML = '';
      const msgs = {
        upcoming: ['Nothing upcoming', 'New AI bookings will land here automatically.'],
        today: ['No appointments today', 'Enjoy the quiet — or test the AI booking flow.'],
        past: ['No past appointments', 'Completed appointments will appear here.'],
        cancelled: ['No cancellations', 'Cancelled appointments will appear here.'],
      };
      emptyEl.innerHTML = emptyState('📅', msgs[apptTab][0], msgs[apptTab][1]);
      return;
    }
    tbody.innerHTML = rows.map(a => `
      <tr>
        <td><div class="cell-main">${esc(a.customer)}</div><div class="cell-dim">${esc(a.phone)}</div></td>
        <td class="cell-dim">${esc(a.service)}</td>
        <td class="cell-dim">${fmtDate(a.date)}</td>
        <td class="cell-dim">${fmtTime(a.date)}</td>
        <td class="cell-dim">${esc(a.bookedBy)}</td>
        <td><span class="status-pill ${APPT_PILL[a.status] || 'status-dim'}"><span class="sdot"></span>${esc(a.status)}</span></td>
        <td>
          ${a.status !== 'Cancelled' ? `
            <button class="btn btn-ghost btn-sm" data-view="${a.id}">View</button>
            <button class="btn btn-ghost btn-sm" data-resched="${a.id}">Reschedule</button>
            <button class="btn btn-ghost btn-sm" data-cancel="${a.id}">Cancel</button>`
          : `<button class="btn btn-ghost btn-sm" data-view="${a.id}">View</button>`}
        </td>
      </tr>`).join('');

    tbody.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => openApptModal(b.dataset.view, ctx)));
    tbody.querySelectorAll('[data-resched]').forEach(b => b.addEventListener('click', () => openReschedule(b.dataset.resched, ctx, drawAll)));
    tbody.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', async () => {
      const a = appointmentService.getAppointment(b.dataset.cancel);
      const ok = await confirmDialog({ title: 'Cancel appointment?', message: `Cancel ${a.customer} — ${a.service} on ${fmtDate(a.date)} ${fmtTime(a.date)}? This cancels it on the platform server immediately.`, confirmText: 'Cancel appointment', danger: true });
      if (!ok) return;
      const r = await appointmentService.cancel(a.id);
      if (r && r.ok === false) { toast(r.error || 'Cancel failed', 'error'); return; }
      toast('Appointment cancelled on the server', 'success');
      drawAll();
    }));
  }

  function openReschedule(id, ctx2, redraw) {
    const a = appointmentService.getAppointment(id);
    const base = new Date(a.date);
    const dayStr = base.toISOString().slice(0, 10);
    openModal({
      title: `Reschedule — ${esc(a.customer)}`,
      body: `
        <div class="form-group"><label class="form-label">New date</label>
          <input type="date" class="form-input" id="rsDate" value="${dayStr}"/></div>
        <div class="form-group"><label class="form-label">New time</label>
          <select class="form-select" id="rsTime">
            ${['9:00 AM', '9:30 AM', '10:00 AM', '11:00 AM', '12:00 PM', '1:00 PM', '1:30 PM', '2:00 PM', '3:00 PM', '3:30 PM', '4:00 PM', '5:00 PM', '6:00 PM']
              .map(t => `<option ${fmtTime(a.date) === t ? 'selected' : ''}>${t}</option>`).join('')}
          </select></div>
        <div class="form-hint">Saves the new time to the platform server immediately.</div>`,
      footer: `<button class="btn btn-ghost btn-sm" data-close2>Close</button><button class="btn btn-gold btn-sm" data-go>Reschedule</button>`,
      onOpen: ({ modal, close }) => {
        modal.querySelector('[data-close2]').addEventListener('click', close);
        modal.querySelector('[data-go]').addEventListener('click', async () => {
          const d = new Date(modal.querySelector('#rsDate').value + 'T00:00:00');
          if (isNaN(d)) return toast('Pick a valid date', 'error');
          const t = modal.querySelector('#rsTime').value;
          const mm = t.match(/(\d+):(\d+)\s*(AM|PM)/);
          let h = parseInt(mm[1], 10) % 12 + (mm[3] === 'PM' ? 12 : 0);
          d.setHours(h, parseInt(mm[2], 10), 0, 0);
          const r = await appointmentService.reschedule(id, d);
          if (r && r.ok === false) { toast(r.error || 'Reschedule failed', 'error'); return; }
          close();
          toast('Appointment rescheduled on the server', 'success');
          redraw();
        });
      },
    });
  }

  /* ---------- calendar ---------- */
  function drawCal() {
    const titleEl = root.querySelector('#calTitle');
    const body = root.querySelector('#calBody');
    const appts = appointmentService.getAppointments().filter(a => a.status !== 'Cancelled');

    if (calMode === 'day') {
      titleEl.textContent = calCursor.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
      const day = appts.filter(a => sameDay(new Date(a.date), calCursor));
      body.innerHTML = day.length
        ? `<div class="cal-day-list">${day.map(a => `
            <div class="cal-day-row">
              <div class="cal-day-time">${fmtTime(a.date)}</div>
              <div class="cal-day-line"><div class="cal-day-name">${esc(a.customer)}</div><div class="cell-dim">${esc(a.service)} · ${esc(a.bookedBy)}</div></div>
              <button class="btn btn-ghost btn-sm" data-view="${a.id}">View</button>
            </div>`).join('')}</div>`
        : emptyState('🗓️', 'No appointments this day', 'Pick another date or switch to Month view.');
    } else if (calMode === 'week') {
      const start = new Date(calCursor);
      start.setDate(start.getDate() - start.getDay() + (start.getDay() === 0 ? -6 : 1)); // Monday start
      const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(start); d.setDate(d.getDate() + i); return d; });
      titleEl.textContent = `${days[0].toLocaleDateString([], { month: 'short', day: 'numeric' })} – ${days[6].toLocaleDateString([], { month: 'short', day: 'numeric' })}`;
      body.innerHTML = `<div class="week-cols">${days.map(d => {
        const day = appts.filter(a => sameDay(new Date(a.date), d));
        return `<div class="week-col ${sameDay(d, new Date()) ? 'today-col' : ''}">
          <div class="week-dow">${d.toLocaleDateString([], { weekday: 'short' })}</div>
          <div class="week-date">${d.getDate()}</div>
          ${day.length ? day.map(a => `<div class="cal-evt" data-view="${a.id}" title="${esc(a.customer)} — ${esc(a.service)}">${fmtTime(a.date)} ${esc(a.customer.split(' ')[0])}</div>`).join('') : '<div style="font-size:0.68rem;color:var(--text-dim)">—</div>'}
        </div>`;
      }).join('')}</div>`;
    } else {
      const y = calCursor.getFullYear(), mo = calCursor.getMonth();
      titleEl.textContent = monthLabel(y, mo);
      const first = new Date(y, mo, 1);
      const startOffset = (first.getDay() + 6) % 7; // Monday-first
      const start = new Date(y, mo, 1 - startOffset);
      const cells = Array.from({ length: 42 }, (_, i) => { const d = new Date(start); d.setDate(d.getDate() + i); return d; });
      body.innerHTML = `
        <div class="cal-grid">
          ${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="cal-dow">${d}</div>`).join('')}
          ${cells.map(d => {
            const day = appts.filter(a => sameDay(new Date(a.date), d));
            const inMonth = d.getMonth() === mo;
            return `<div class="cal-cell ${inMonth ? '' : 'other'} ${sameDay(d, new Date()) ? 'today' : ''}">
              <div class="cal-num">${d.getDate()}</div>
              ${day.slice(0, 2).map(a => `<div class="cal-evt ${a.status === 'Cancelled' ? 'cancelled' : ''}" data-view="${a.id}">${fmtTime(a.date)} ${esc(a.customer.split(' ')[0])}</div>`).join('')}
              ${day.length > 2 ? `<div class="cal-count">+${day.length - 2} more</div>` : ''}
            </div>`;
          }).join('')}
        </div>`;
    }
    body.querySelectorAll('[data-view]').forEach(el => el.addEventListener('click', () => openApptModal(el.dataset.view, ctx)));
  }

  function drawAll() { drawTable(); drawCal(); }

  root.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    apptTab = t.dataset.tab;
    root.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    drawTable();
  }));

  root.querySelectorAll('#calSeg button').forEach(b => b.addEventListener('click', () => {
    calMode = b.dataset.m;
    root.querySelectorAll('#calSeg button').forEach(x => x.classList.toggle('active', x === b));
    drawCal();
  }));
  root.querySelector('#calPrev').addEventListener('click', () => { stepCal(-1); });
  root.querySelector('#calNext').addEventListener('click', () => { stepCal(1); });
  root.querySelector('#calToday').addEventListener('click', () => { calCursor = new Date(); drawCal(); });

  function stepCal(dir) {
    if (calMode === 'day') calCursor.setDate(calCursor.getDate() + dir);
    else if (calMode === 'week') calCursor.setDate(calCursor.getDate() + dir * 7);
    else calCursor.setMonth(calCursor.getMonth() + dir);
    drawCal();
  }

  drawAll();
}

let lfTab = 'leads';

/** Called by app.js navigate('leadflow', { tab }) before rendering. */
function setLeadFlowTab(t) { lfTab = t === 'queue' ? 'queue' : 'leads'; }

function renderLeadFlow(root, ctx) {
  const s = ctx.getState();
  const m = leadflowService.getMetrics();
  const pipeline = leadflowService.pipelineCounts();
  const maxCount = Math.max(...pipeline.map(p => p.count), 1);
  const queue = leadflowService.followUpQueue();
  const now = Date.now();

  const STAGE_COLORS = {
    New: 'var(--blue)', Contacted: 'var(--orange)', Responded: 'var(--purple)',
    Booked: 'var(--green)', Lost: 'var(--red)',
  };

  root.innerHTML = `
    <div class="page-head">
      <div class="page-title">LeadFlow
        <span class="status-pill status-gold" style="vertical-align:middle;margin-left:10px"><span class="sdot"></span>ACTIVE</span>
      </div>
      <div class="page-sub">Your automated lead follow-up system. This is the overview — the full CRM lives in LeadFlow.</div>
    </div>

    <div class="kpi-grid" style="grid-template-columns:repeat(6,1fr)">
      ${[['🎯', 'Total Leads', m.total], ['✨', 'New', m.new], ['📨', 'Contacted', m.contacted],
         ['💬', 'Responded', m.responded], ['🏆', 'Booked', m.booked], ['📈', 'Conversion', m.conversion + '%']]
        .map(([i, l, v]) => `<div class="kpi"><div class="kpi-label">${i} ${esc(l)}</div><div class="kpi-value">${v}</div></div>`).join('')}
    </div>

    <div class="tabs">
      <button class="tab ${lfTab === 'leads' ? 'active' : ''}" data-tab="leads">Leads</button>
      <button class="tab ${lfTab === 'queue' ? 'active' : ''}" data-tab="queue">Follow-up Queue<span class="tab-count">${queue.length}</span></button>
    </div>

    <div id="lfBody"></div>

    <div class="card" style="margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div style="font-size:0.86rem;color:var(--text-soft)">Need to edit leads, run automations, or manage the pipeline?</div>
      <span style="flex:1"></span>
      <button class="btn btn-gold btn-sm" id="openLF">Open LeadFlow →</button>
    </div>
  `;

  const body = root.querySelector('#lfBody');

  function drawLeads() {
    const leads = leadflowService.getLeads();
    body.innerHTML = `
      <div class="card" style="margin-bottom:18px">
        <div class="card-title">📊 Pipeline</div>
        ${pipeline.map(p => `
          <div style="display:flex;align-items:center;gap:12px;padding:7px 0">
            <div style="width:92px;font-size:0.8rem;font-weight:600">${esc(p.stage)}</div>
            <div style="flex:1;height:10px;background:var(--bg-hover);border-radius:5px;overflow:hidden">
              <div style="width:${(p.count / maxCount) * 100}%;height:100%;background:${STAGE_COLORS[p.stage]};border-radius:5px;opacity:0.85"></div>
            </div>
            <div style="width:30px;text-align:right;font-family:var(--font-display);font-weight:700">${p.count}</div>
          </div>`).join('')}
      </div>

      <div class="grid-3" id="leadCards">
        ${leads.map(l => `
          <div class="card" style="padding:15px">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
              <div class="row-ico" style="background:var(--bg-hover);font-size:0.72rem;font-weight:700">${esc(l.name.split(' ').map(w => w[0]).slice(0, 2).join(''))}</div>
              <div style="min-width:0">
                <div class="row-title">${esc(l.name)}</div>
                <div class="row-sub">${esc(l.service || 'Service not set')}</div>
              </div>
              <span class="status-pill ${l.status === 'Booked' ? 'status-green' : l.status === 'Lost' ? 'status-red' : l.status === 'New' ? 'status-blue' : l.status === 'Contacted' ? 'status-orange' : 'status-purple'}" style="margin-left:auto">
                <span class="sdot"></span>${esc(l.status)}
              </span>
            </div>
            <div class="cell-dim" style="margin-bottom:8px">${esc(l.source)} · score ${l.score != null ? scoreBar(l.score) : 'not scored'}</div>
            <div style="display:flex;justify-content:space-between;font-size:0.74rem;color:var(--text-dim)">
              <span>Last contact ${relTime(l.lastContact)}</span>
              <span>${l.nextFollowUp ? `Next ${fmtDate(l.nextFollowUp)}` : '—'}</span>
            </div>
          </div>`).join('')}
      </div>`;

  function drawQueue() {
    body.innerHTML = queue.length ? `
      <div class="card">
        <div class="card-title">⏰ Follow-up queue <span class="chip" style="margin-left:auto">${queue.length} pending</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Lead</th><th>Type</th><th>Due</th><th style="width:110px"></th></tr></thead>

              const overdue = new Date(t.dueAt) < new Date();
              return `<tr>
                <td class="cell-main">${esc(t.leadName)}</td>
                <td><span class="chip">${esc(t.type)}</span></td>
                <td><span class="${overdue ? 'cell-main' : 'cell-dim'}" style="${overdue ? 'color:var(--red)' : ''}">${overdue ? 'Overdue — ' : ''}${relTime(t.dueAt)}</span></td>
                <td><button class="btn btn-ghost btn-sm" data-done="${t.id}">Mark done</button></td>
              </tr>`;
            }).join('')}

    body.querySelectorAll('[data-done]').forEach(b => b.addEventListener('click', () => {
      leadflowService.markTaskDone(b.dataset.done);
      toast('Follow-up marked done', 'success');
      lfTab = 'queue';
      renderLeadFlow(root, ctx);
    }));
  }

  function draw() { lfTab === 'leads' ? drawLeads() : drawQueue(); }

  root.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    lfTab = t.dataset.tab;
    root.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    draw();
  }));

  root.querySelector('#openLF').addEventListener('click', () => ctx.openLeadFlowApp());

  draw();
}

          <div class="form-group">
            <label class="form-label">Description <span class="req">*</span></label>
            <textarea class="form-textarea" id="reqDesc" placeholder="Tell us what you want changed..." rows="6"></textarea>
          </div>
          <button type="submit" class="btn btn-gold" id="reqSubmit">Submit Request</button>
        </form>
        <div id="reqSuccess" style="display:none"></div>
      </div>

      <div>
        <div class="card" style="margin-bottom:18px">
          <div class="card-title">🔁 How it works</div>
          <div class="timeline" style="padding-left:24px">
            ${[['📤', 'You submit', 'Your request posts to the platform server immediately.'],
               ['🔎', 'We review', 'The team triages it in the admin console — usually same business day.'],
               ['🛠️', 'We update', 'Changes are made to your systems by VantorX.'],
               ['✅', 'You get told', 'Status updates appear right here in the Hub.']]
              .map(([i, t, d]) => `
              <div class="tl-item">
                <div class="tl-dot">${i}</div>
                <div class="tl-title" style="font-size:0.84rem">${t}</div>
                <div class="tl-desc">${d}</div>
              </div>`).join('')}
          </div>
        </div>
        <div class="card">
          <div class="card-title">🛡️ Where it goes</div>
          <p class="cell-dim" style="font-size:0.8rem;margin:0">Requests are stored server-side and worked in the <strong>VantorX Admin console</strong> (Change Requests board). Priorities and assignments are managed there.</p>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:18px">
      <div class="card-title">🗂️ Request history</div>
      <div id="reqHistory"></div>
    </div>
  `;

  /* ---------- form (real submit) ---------- */
  const form = root.querySelector('#reqForm');
  const successEl = root.querySelector('#reqSuccess');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const type = root.querySelector('#reqType').value;
    const desc = root.querySelector('#reqDesc').value.trim();
    if (!type) return toast('Choose a request type', 'error');
    if (desc.length < 5) return toast('Describe the change you need', 'error');
    const btn = root.querySelector('#reqSubmit');
    btn.disabled = true;
    try {
      const out = await requestService.createRequest({ type, description: desc });
      if (out.ok === false) { toast(out.error || 'Submit failed', 'error'); return; }
      const req = out.request;
      form.reset();
      successEl.style.display = 'block';
      successEl.innerHTML = `
        <div class="sim-bubble" style="border-color:rgba(74,222,128,0.35)">
          <strong style="color:var(--green)">✓ Request submitted to the platform.</strong><br/>
          Your VantorX team has received your request.
          <div class="cell-dim" style="margin-top:6px">Reference ${esc(req.id)} · ${esc(req.type)}</div>
        </div>`;
      toast('Request submitted — it is in the live admin queue', 'success');
      drawHistory();
    } finally {
      btn.disabled = false;
    }
  });

  /* ---------- history ---------- */
  if (pendingPrefill) {
    root.querySelector('#reqDesc').value = pendingPrefill;
    pendingPrefill = '';
    root.querySelector('#reqDesc').focus();
  }

  function drawHistory() {
    const list = requestService.getRequests();
    const el = root.querySelector('#reqHistory');
    if (!list.length) {
      el.innerHTML = emptyState('🗂️', "You haven't submitted any requests", 'Use the form to ask for anything — pricing updates, AI tweaks, calendar changes.');
      return;
    }
    el.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Request</th><th>Type</th><th>Submitted</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${list.map(r => `
          <tr>
            <td style="max-width:300px"><div class="cell-main" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.description)}</div></td>
            <td class="cell-dim">${esc(r.type)}</td>
            <td class="cell-dim">${fmtDate(r.createdAt)}<div class="cell-dim">${esc(r.requestId)}</div></td>
            <td><span class="status-pill ${STATUS_META[r.status]?.cls || 'status-dim'}"><span class="sdot"></span>${esc(r.status)}</span></td>
            <td><button class="btn btn-ghost btn-sm" data-view="${esc(r.id)}">View</button></td>
          </tr>`).join('')}
      </tbody>
    </table></div>`;

    el.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
      const r = requestService.getRequests().find(x => x.id === b.dataset.view);
      if (!r) return;
      openModal({
        title: `Request ${esc(r.requestId)}`,
        body: `<div class="kv-list">
          <div class="kv-row"><div class="kv-label">Type</div><div class="kv-value">${esc(r.type)}</div></div>
          <div class="kv-row"><div class="kv-label">Description</div><div class="kv-value">${esc(r.description)}</div></div>
          <div class="kv-row"><div class="kv-label">Status</div><div class="kv-value"><span class="status-pill ${STATUS_META[r.status]?.cls || 'status-dim'}"><span class="sdot"></span>${esc(r.status)}</span></div></div>
          <div class="kv-row"><div class="kv-label">Submitted</div><div class="kv-value">${fmtDate(r.createdAt)}</div></div>
        </div>`,
        footer: `<button class="btn btn-ghost btn-sm" data-close2>Close</button>`,
        onOpen: ({ modal, close }) => modal.querySelector('[data-close2]').addEventListener('click', close),
      });
    }));
  }

  drawHistory();
}

/* ============================================================

let activeTab = 'settings';

function renderSettings(root, ctx, param) {
  /* Routes are #/settings, #/billing, #/help — derive the tab from the hash,
     falling back to the (unused) param so the function stays self-contained. */
  const fromHash = (location.hash.match(/^#\/(billing|help)/) || [])[1];
  const tab = fromHash || (param === 'billing' || param === 'help' ? param : 'settings');
  activeTab = tab;

  root.innerHTML = `
    <div class="page-head"><div class="page-title">${{ settings: 'Settings', billing: 'Billing', help: 'Help & Support' }[tab]}</div></div>
    <div class="settings-nav" id="settingsNav">
      <button data-tab="settings">Settings</button>
      <button data-tab="billing">Billing</button>
      <button data-tab="help">Help & Support</button>
    </div>
    <div id="settingsBody"></div>`;

  root.querySelectorAll('#settingsNav button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
    b.addEventListener('click', () => { location.hash = '#/' + b.dataset.tab; });
  });

  const body = root.querySelector('#settingsBody');
  if (tab === 'settings') paintSettings(body, ctx);
  else if (tab === 'billing') paintBilling(body);
  else paintHelp(body, ctx);
}
