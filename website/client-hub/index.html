<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VantorX Hub — Client Portal</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <a href="/" title="Back to VantorX portal" style="text-decoration:none;color:inherit;display:flex;gap:10px;align-items:center">
      <div class="brand-mark">V</div>
      <div>
        <div class="brand-name">VantorX <span class="gold">Hub</span></div>
        <div class="brand-sub">Client Portal</div>
      </div>
      </a>
    </div>

    <div class="demo-pill" title="Live data from the VantorX platform server"><span class="dot"></span>Live platform</div>

    <nav style="display:flex;flex-direction:column;gap:3px;margin-top:14px">
      <div class="nav-section-label">Overview</div>
      <a class="nav-item" href="#/home" data-nav="home"><span class="ico">▦</span>Home</a>

      <div class="nav-section-label">Your systems</div>
      <a class="nav-item" href="#/ai" data-nav="ai"><span class="ico">✦</span>AI Receptionist</a>
      <a class="nav-item" href="#/calls" data-nav="calls"><span class="ico">☎</span>Calls</a>
      <a class="nav-item" href="#/appointments" data-nav="appointments"><span class="ico">▤</span>Appointments</a>
      <a class="nav-item" href="#/leadflow" data-nav="leadflow"><span class="ico">⟳</span>LeadFlow</a>

      <div class="nav-section-label">Account</div>
      <a class="nav-item" href="#/activity" data-nav="activity"><span class="ico">≡</span>Activity</a>
      <a class="nav-item" href="#/requests" data-nav="requests"><span class="ico">✎</span>Request Changes</a>
      <a class="nav-item" href="#/settings" data-nav="settings"><span class="ico">⚙</span>Settings</a>
    </nav>

    <div class="sidebar-bottom">
      <div class="sidebar-biz" id="bizCard" role="button" tabindex="0" aria-label="Account">
        <div class="biz-avatar">MR</div>
        <div style="min-width:0">
          <div class="biz-name" id="bizName">—</div>
          <div class="biz-plan" id="bizPlan">—</div>
        </div>
        <div class="biz-caret">▾</div>
      </div>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <div class="main">

    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation">☰</button>
      <div class="topbar-title" id="topbarTitle">Home</div>

      <div class="topbar-search" id="topbarSearchWrap">
        <span>⌕</span>
        <input id="globalSearch" type="search" placeholder="Search calls, appointments, leads…" autocomplete="off" />
        <kbd>/</kbd>
      </div>

      <div class="topbar-spacer"></div>

      <button class="icon-btn" id="notifBtn" aria-label="Notifications" title="Notifications">
        ◔<span class="dot-badge" id="notifDot"></span>
      </button>

      <button class="avatar-btn" id="accountBtn" aria-label="Account menu">
        <span class="avatar-circle" id="avatarInitials">··</span>
        <span class="avatar-name" id="avatarName">…</span>
        <span class="avatar-caret">▾</span>
      </button>
    </header>

    <main class="content" id="view"></main>
  </div>
</div>

<!-- ===== APP ROOTS ===== -->
<div class="mobile-scrim" id="mobileScrim" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
