/* ============================================================
   VANTORX LEADFLOW — pages/automations.js
   Sequence builder + message templates with live preview.
   ============================================================ */

/* ============================================================
   AUTOMATIONS
   ============================================================ */
function renderAutomations(root) {
  const s = getState();

  root.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Follow up automatically. Convert more consistently.</div>
        <div class="page-subtitle">Sequences run until the lead replies, books, opts out, or is marked lost.</div>
      </div>
      <button class="btn btn-gold" data-action="new-auto">+ New Sequence</button>
    </div>
    <div id="autoList"></div>
  `;
  const list = root.querySelector('#autoList');

  function draw() {
    const st = getState();
    if (!st.automations.length) {
      list.innerHTML = `<div class="card">${emptyState({
        icon: '⚙️', title: 'No sequences yet',
        message: 'Create your first follow-up sequence and start converting more leads automatically.',
        actionHTML: '<button class="btn btn-gold" data-new-auto>+ New Sequence</button>'
      })}</div>`;
      list.querySelector('[data-new-auto]').addEventListener('click', () => openEditor(null, draw));
      return;
    }
    list.innerHTML = st.automations.map(a => {
      const enrolled = st.leads.filter(l => l.automationId === a.id).length;
      const conversions = st.leads.filter(l => l.automationId === a.id && l.status === 'Booked').length;
      return `<div class="card" style="margin-bottom:14px">
        <div class="auto-card">
          <div class="auto-info">
            <div class="auto-name">${esc(a.name)} ${a.active ? '<span class="automation-status-pill" style="margin-left:8px"><span class="pulse-dot"></span><span class="pill-text">ACTIVE</span></span>' : '<span class="badge badge-paused" style="margin-left:8px">PAUSED</span>'}</div>
            <div class="auto-meta">
              <span>Trigger: <span class="trigger-select">${esc(a.trigger)}</span></span>
              <span>${enrolled} lead${enrolled === 1 ? '' : 's'} enrolled</span>
              <span>${conversions} booked</span>
              <span>Edited ${relTime(a.updatedAt)}</span>
              <span>Stops on: ${a.stopConditions.join(', ')}</span>
            </div>
          </div>
          <div class="cell-actions">
            <button class="btn btn-ghost btn-sm" data-toggle-auto="${a.id}">${a.active ? '⏸ Pause' : '▶ Enable'}</button>
            <button class="btn btn-ghost btn-sm" data-edit-auto="${a.id}">✎ Edit</button>
            <button class="btn btn-danger btn-sm" data-del-auto="${a.id}">🗑</button>
          </div>
        </div>
        <div class="auto-steps-visual">
          ${a.steps.map((st2, i) => stepRow(st2, i, a)).join('')}
        </div>
      </div>`;
    }).join('');

    list.querySelectorAll('[data-toggle-auto]').forEach(b => b.addEventListener('click', () => {
      toggleAutomation(b.dataset.toggleAuto); toast('Sequence updated'); draw();
    }));
    list.querySelectorAll('[data-edit-auto]').forEach(b => b.addEventListener('click', () => openEditor(b.dataset.editAuto, draw)));
    list.querySelectorAll('[data-del-auto]').forEach(b => b.addEventListener('click', async () => {
      const ok = await confirmDialog({ title: 'Delete this sequence?', message: 'Leads enrolled in it will stop receiving automated messages. This cannot be undone.', confirmText: 'Delete', danger: true });
      if (!ok) return;
      deleteAutomation(b.dataset.delAuto); toast('Sequence deleted', 'info'); draw();
    }));
  }

  function stepRow(st, i, auto) {
    const delayTxt = st.delayMinutes === 0 ? 'Immediately' : st.delayMinutes < 1440
      ? `Wait ${st.delayMinutes / 60}h` : `Wait ${st.delayMinutes / 1440} day${st.delayMinutes / 1440 > 1 ? 's' : ''}`;
    const icon = { 'Send SMS': '💬', 'Send Email': '📧', 'Wait': '⏱', 'Create task': '📝', 'Change status': '🔀', 'Notify owner': '🔔', 'Stop sequence': '⏹' }[st.type] || '•';
    return `<div class="auto-step-row ${st.enabled ? '' : 'disabled'}">
      <span class="auto-step-num">${i + 1}</span>
      <span>${icon}</span>
      <span class="auto-step-type">${esc(st.type)}</span>
      <span class="auto-step-detail">${esc(delayTxt)}${st.message ? ` — “${esc(st.message.slice(0, 80))}${st.message.length > 80 ? '…' : ''}”` : ''}</span>
      <div class="cell-actions">
        <button class="row-actions-btn" data-preview-step="${st.id}" data-tooltip="Preview">👁</button>
        <button class="row-actions-btn" data-toggle-step="${st.id}" data-tooltip="${st.enabled ? 'Disable' : 'Enable'} step">${st.enabled ? '✓' : '○'}</button>
      </div>
    </div>`;
  }

  /* step preview uses closure over current list */
  list.addEventListener('click', (e) => {
    const pv = e.target.closest('[data-preview-step]');
    if (!pv) return;
    const auto = getState().automations.find(a => a.steps.some(st => st.id === pv.dataset.previewStep));
    const st = auto?.steps.find(x => x.id === pv.dataset.previewStep);
    if (!st) return;
    const sampleLead = getState().leads.find(l => !l.archived) || { firstName: 'there', lastName: '', serviceInterest: 'your service' };
    const rendered = renderTemplate(st.message, sampleLead, { businessName: getState().settings.business.name });
    openModal({
      title: 'Step Preview (sample lead)',
      body: `<div class="msg-preview ${st.type === 'Send Email' ? '' : 'sms'}">${esc(rendered)}</div>
        <div class="form-hint" style="margin-top:8px">Rendered with sample lead “${esc(sampleLead.firstName)}” in demo mode.</div>`,
      footer: `<button class="btn btn-ghost" data-cancel>Close</button>`,
      onOpen(modal) { modal.querySelector('[data-cancel]').addEventListener('click', modal.querySelector('.modal-close').onclick); }
    });
  });

  root.querySelector('[data-action="new-auto"]').addEventListener('click', () => openEditor(null, draw));
  draw();
}

/* ---------- sequence editor ---------- */
function openEditor(autoId, onDone) {
  const s = getState();
  const auto = autoId ? JSON.parse(JSON.stringify(s.automations.find(a => a.id === autoId))) : {
    name: '', trigger: 'New lead', active: true,
    stopConditions: ['Lead replies', 'Lead books', 'Lead opts out', 'Lead marked lost'],
    steps: [{ id: uid('st'), type: 'Send SMS', delayMinutes: 0, templateId: null, message: '', enabled: true }]
  };
  const TRIGGERS = ['New lead', 'Website lead', 'Missed call', 'No response', 'Appointment requested', 'Appointment missed', 'Manual enrollment'];
  const STEP_TYPES = ['Send SMS', 'Send Email', 'Wait', 'Create task', 'Change status', 'Notify owner', 'Stop sequence'];

  const close = openModal({
    title: autoId ? 'Edit Sequence' : 'New Sequence',
    wide: true,
    body: `
      <div class="form-row">
        ${field({ label: 'Sequence name', name: 'aName', value: auto.name, required: true })}
        ${field({ label: 'Trigger', name: 'aTrigger', type: 'select', options: TRIGGERS, value: auto.trigger })}
      </div>
      <div class="form-group">
        <label class="form-label">Stop conditions</label>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${['Lead replies', 'Lead books', 'Lead opts out', 'Lead marked lost'].map(c =>
            `<label class="chip" style="cursor:pointer;padding:7px 14px"><input type="checkbox" name="aStop" value="${c}" ${auto.stopConditions.includes(c) ? 'checked' : ''} style="accent-color:var(--gold)"/> ${c}</label>`).join('')}
        </div>
      </div>
      <div class="form-label" style="margin:14px 0 8px">Steps</div>
      <div id="stepEditor"></div>
      <button class="btn btn-ghost btn-sm" id="addStep">+ Add step</button>`,
    footer: `<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn btn-gold" data-save>Save sequence</button>`,
    onOpen(modal) {
      modal.querySelector('[data-cancel]').addEventListener('click', close);
      const stepEditor = modal.querySelector('#stepEditor');

      function drawSteps() {
        stepEditor.innerHTML = auto.steps.map((st, i) => `
          <div class="auto-step-row" data-step="${st.id}">
            <div class="step-up-down">
              <button data-up="${st.id}" ${i === 0 ? 'disabled' : ''}>▲</button>
              <button data-down="${st.id}" ${i === auto.steps.length - 1 ? 'disabled' : ''}>▼</button>
            </div>
            <span class="auto-step-num">${i + 1}</span>
            <select class="select-input" data-sf="type" style="width:130px">${STEP_TYPES.map(t => `<option ${st.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
            <div style="display:flex;align-items:center;gap:6px">
              <input class="form-input" type="number" data-sf="delayVal" value="${st.delayMinutes === 0 ? 0 : st.delayMinutes >= 1440 ? st.delayMinutes / 1440 : st.delayMinutes / 60}" min="0" style="width:64px;padding:6px 8px"/>
              <select class="select-input" data-sf="delayUnit" style="width:80px">
                <option value="60" ${st.delayMinutes > 0 && st.delayMinutes < 1440 ? 'selected' : ''}>hours</option>
                <option value="1440" ${st.delayMinutes >= 1440 ? 'selected' : ''}>days</option>
                <option value="1" ${st.delayMinutes === 0 ? 'selected' : ''}>min</option>
              </select>
            </div>
            <input class="form-input" data-sf="message" value="${esc(st.message || '')}" placeholder="Message / instruction (use {{first_name}}, {{service}}…)" style="flex:1;min-width:160px"/>
            <div class="cell-actions">
              <button class="row-actions-btn" data-eye="${st.id}" data-tooltip="Preview">👁</button>
              <label class="switch" style="transform:scale(0.85)"><input type="checkbox" data-sf="enabled" ${st.enabled ? 'checked' : ''}/><span class="track"></span></label>
              <button class="row-actions-btn" data-del-step="${st.id}" data-tooltip="Remove step">🗑</button>
            </div>
          </div>`).join('');

        stepEditor.querySelectorAll('[data-sf]').forEach(el => {
          el.addEventListener('change', () => {
            stepEditor.querySelectorAll('[data-step]').forEach(row => {
              const stId = row.dataset.step;
              const target = auto.steps.find(x => x.id === stId);
              if (!target) return;
              const unit = Number(row.querySelector('[data-sf="delayUnit"]').value) || 60;
              const val = Number(row.querySelector('[data-sf="delayVal"]').value) || 0;
              target.type = row.querySelector('[data-sf="type"]').value;
              target.delayMinutes = unit === 1 ? 0 : val * unit;
              target.message = row.querySelector('[data-sf="message"]').value;
              target.enabled = row.querySelector('[data-sf="enabled"]').checked;
            });
          });
          if (el.dataset.sf === 'message') el.addEventListener('input', () => {
            const row = el.closest('[data-step]');
            const target = auto.steps.find(x => x.id === row.dataset.step);
            if (target) target.message = el.value;
          });
        });
        stepEditor.querySelectorAll('[data-up]').forEach(b => b.addEventListener('click', () => {
          const i = auto.steps.findIndex(x => x.id === b.dataset.up);
          if (i > 0) { [auto.steps[i - 1], auto.steps[i]] = [auto.steps[i], auto.steps[i - 1]]; drawSteps(); }
        }));
        stepEditor.querySelectorAll('[data-down]').forEach(b => b.addEventListener('click', () => {
          const i = auto.steps.findIndex(x => x.id === b.dataset.down);
          if (i < auto.steps.length - 1) { [auto.steps[i + 1], auto.steps[i]] = [auto.steps[i], auto.steps[i + 1]]; drawSteps(); }
        }));
        stepEditor.querySelectorAll('[data-del-step]').forEach(b => b.addEventListener('click', () => {
          auto.steps = auto.steps.filter(x => x.id !== b.dataset.delStep); drawSteps();
        }));
        stepEditor.querySelectorAll('[data-eye]').forEach(b => b.addEventListener('click', () => {
          const st = auto.steps.find(x => x.id === b.dataset.eye);
          const sampleLead = { firstName: 'there', lastName: '', serviceInterest: 'your service' };
          const rendered = renderTemplate(st.message || '(no message yet)', sampleLead, { businessName: getState().settings.business.name });
          toast(rendered.slice(0, 90) + (rendered.length > 90 ? '…' : ''), 'info');
        }));
      }
      drawSteps();

      modal.querySelector('#addStep').addEventListener('click', () => {
        auto.steps.push({ id: uid('st'), type: 'Wait', delayMinutes: 1440, templateId: null, message: '', enabled: true });
        drawSteps();
      });

      modal.querySelector('[data-save]').addEventListener('click', () => {
        const name = modal.querySelector('[name="aName"]').value.trim();
        if (!name) { toast('Give the sequence a name', 'error'); return; }
        auto.name = name;
        auto.trigger = modal.querySelector('[name="aTrigger"]').value;
        auto.stopConditions = [...modal.querySelectorAll('[name="aStop"]:checked')].map(c => c.value);
        saveAutomation(auto);
        close(); toast('Sequence saved'); onDone && onDone();
      });
    }
  });
}

function renderTemplates(root) {
  const s = getState();
  let tab = 'SMS';

  root.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Message Templates</div>
        <div class="page-subtitle">Reusable SMS and email messages with variables like <span class="tpl-var">{{first_name}}</span>.</div>
      </div>
      <button class="btn btn-gold" data-action="new-tpl">+ New Template</button>
    </div>
    <div class="chart-toggle" style="margin-bottom:16px" id="tplTabs">
      <button data-tab="SMS" class="active">SMS</button>
      <button data-tab="Email">Email</button>
    </div>
    <div id="tplList"></div>`;

  const list = root.querySelector('#tplList');

  function draw() {
    const st = getState();
    const tpls = st.templates.filter(t => t.channel === tab);
    if (!tpls.length) {
      list.innerHTML = `<div class="card">${emptyState({ icon: '📝', title: `No ${tab} templates yet`, message: 'Create a reusable template so follow-ups stay consistent.' })}</div>`;
      return;
    }
    list.innerHTML = `<div class="tpl-grid">${tpls.map(t => `
      <div class="card card-hover tpl-card">
        <div class="tpl-head">
          <span class="tpl-name">${esc(t.name)}</span>
          <span class="badge ${t.active ? 'badge-connected' : 'badge-not-connected'}">${t.active ? 'Active' : 'Off'}</span>
        </div>
        <span class="chip" style="align-self:flex-start">${esc(t.category)}</span>
        <div class="tpl-body">${esc(t.body)}</div>
        <div class="cell-actions" style="margin-top:auto;padding-top:8px">
          <button class="btn btn-ghost btn-sm" data-view-tpl="${t.id}">Preview</button>
          <button class="btn btn-ghost btn-sm" data-edit-tpl="${t.id}">✎ Edit</button>
          <button class="btn btn-danger btn-sm" data-del-tpl="${t.id}">🗑</button>
        </div>
      </div>`).join('')}</div>`;

    list.querySelectorAll('[data-view-tpl]').forEach(b => b.addEventListener('click', () => {
      const t = getState().templates.find(x => x.id === b.dataset.viewTpl);
      const sampleLead = getState().leads.find(l => !l.archived) || { firstName: 'there' };
      const rendered = renderTemplate(t.body, sampleLead, { businessName: getState().settings.business.name, ownerName: getState().settings.ownerName });
      openModal({
        title: t.name,
        body: `${t.subject ? `<div class="form-hint" style="margin-bottom:10px">Subject: ${esc(renderTemplate(t.subject, sampleLead, { businessName: getState().settings.business.name }))}</div>` : ''}
          <div class="msg-preview ${t.channel === 'SMS' ? 'sms' : ''}">${esc(rendered)}</div>
          <div class="form-hint" style="margin-top:8px">Previewed with sample lead data.</div>`,
        footer: `<button class="btn btn-ghost" data-cancel>Close</button>`,
        onOpen(modal) { modal.querySelector('[data-cancel]').addEventListener('click', modal.querySelector('.modal-close').onclick); }
      });
    }));
    list.querySelectorAll('[data-edit-tpl]').forEach(b => b.addEventListener('click', () => openTplEditor(b.dataset.editTpl, draw)));
    list.querySelectorAll('[data-del-tpl]').forEach(b => b.addEventListener('click', async () => {
      const ok = await confirmDialog({ title: 'Delete template?', message: 'Sequences using this template will keep their written messages, but this template will be gone.', confirmText: 'Delete', danger: true });
      if (!ok) return;
      deleteTemplate(b.dataset.delTpl); toast('Template deleted', 'info'); draw();
    }));
  }

  root.querySelector('#tplTabs').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    root.querySelectorAll('#tplTabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); tab = b.dataset.tab; draw();
  });
  root.querySelector('[data-action="new-tpl"]').addEventListener('click', () => openTplEditor(null, draw));
  draw();
}

function openTplEditor(tplId, onDone) {
  const t = tplId ? { ...getState().templates.find(x => x.id === tplId) } : { name: '', channel: 'SMS', category: 'Custom', subject: '', body: '', active: true };
  const cats = ['First contact', 'No response', 'Follow-up', 'Booking', 'Re-engagement', 'Missed call', 'Reminder', 'Final follow-up', 'Custom'];
  const close = openModal({
    title: tplId ? 'Edit Template' : 'New Template',
    wide: true,
    body: `
      <div class="form-row">
        ${field({ label: 'Name', name: 'tplName', value: t.name, required: true })}
        ${field({ label: 'Category', name: 'tplCategory', type: 'select', options: cats, value: t.category })}
      </div>
      ${field({ label: 'Subject (email only)', name: 'tplSubject', value: t.subject, full: true })}
      ${field({ label: 'Body', name: 'tplBody', type: 'textarea', value: t.body, full: true, hint: 'Variables: {{first_name}} {{last_name}} {{business_name}} {{service}} {{appointment_time}} {{owner_name}}' })}
      <div class="form-label" style="margin:6px 0 8px">Live preview</div>
      <div class="msg-preview" id="tplLive"></div>`,
    footer: `<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn btn-gold" data-save>Save template</button>`,
    onOpen(modal) {
      modal.querySelector('[data-cancel]').addEventListener('click', close);
      const bodyEl = modal.querySelector('[name="tplBody"]');
      const subjEl = modal.querySelector('[name="tplSubject"]');
      const live = modal.querySelector('#tplLive');
      const sampleLead = getState().leads.find(l => !l.archived) || { firstName: 'there' };
      const update = () => {
        const rendered = renderTemplate(bodyEl.value, sampleLead, { businessName: getState().settings.business.name, ownerName: getState().settings.ownerName });
        live.textContent = subjEl.value ? `Subject: ${renderTemplate(subjEl.value, sampleLead, {})}\n\n${rendered}` : rendered;
      };
      bodyEl.addEventListener('input', update);
      subjEl.addEventListener('input', update);
      update();
      modal.querySelector('[data-save]').addEventListener('click', () => {
        const name = modal.querySelector('[name="tplName"]').value.trim();
        if (!name) { toast('Name your template', 'error'); return; }
        saveTemplate({ ...t, name, category: modal.querySelector('[name="tplCategory"]').value, subject: subjEl.value, body: bodyEl.value });
        close(); toast('Template saved'); onDone && onDone();
      });
    }
  });
}

/* ============================================================

   ============================================================ */
function renderActivity(root) {
  const s = getState();
  const filters = { lead: '', type: '', channel: '', days: '' };
  const TYPES = [...new Set(s.activities.map(a => a.type))];

  root.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Activity</div>
        <div class="page-subtitle">Everything that has happened across your leads.</div>
      </div>
    </div>
    <div class="filter-bar">
      <select class="select-input" id="actLead">
        <option value="">All leads</option>
        ${s.leads.map(l => `<option value="${l.id}">${esc(l.firstName)} ${esc(l.lastName)}</option>`).join('')}
      </select>
      <select class="select-input" id="actType">
        <option value="">All types</option>
        ${TYPES.map(t => `<option value="${t}">${t.replace(/_/g, ' ')}</option>`).join('')}
      </select>
      <select class="select-input" id="actChannel">
        <option value="">All channels</option>
        <option value="SMS">SMS</option>
        <option value="Email">Email</option>
      </select>
      <select class="select-input" id="actDays">
        <option value="">All time</option>
        <option value="1">Today</option>
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
      </select>
      <span class="result-count" id="actCount"></span>
    </div>
    <div class="card card-pad"><div id="actList"></div></div>`;

  const list = root.querySelector('#actList');
  const count = root.querySelector('#actCount');

  function draw() {
    let acts = [...getState().activities].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    if (filters.lead) acts = acts.filter(a => a.leadId === filters.lead);
    if (filters.type) acts = acts.filter(a => a.type === filters.type);
    if (filters.channel) acts = acts.filter(a => a.channel === filters.channel);
    if (filters.days) {
      const cutoff = Date.now() - Number(filters.days) * 86400000;
      acts = acts.filter(a => new Date(a.createdAt) >= cutoff);
    }
    count.textContent = `${acts.length} event${acts.length === 1 ? '' : 's'}`;
    if (!acts.length) {
      list.innerHTML = '<div style="color:var(--text-dim);padding:30px;text-align:center">No activity matches these filters.</div>';
      return;
    }
    const ICONS = {
      lead_created: '✨', lead_updated: '✏️', status_changed: '🔀', note_added: '📝',
      sms_sent: '💬', email_sent: '📧', sms_drafted: '✍️', email_drafted: '✉️',
      reply: '⚡', automation_started: '▶️', automation_stopped: '⏸️',
      appointment_booked: '📅', lead_archived: '📦', lead_deleted: '🗑️', followup_scheduled: '⏰'
    };
    list.innerHTML = acts.slice(0, 200).map(a => {
      const lead = getLead(a.leadId);
      return `<div class="timeline-item">
        <div class="timeline-ico">${ICONS[a.type] || '•'}</div>
        <div class="timeline-body">
          <div class="timeline-head">
            <span class="timeline-text">${lead ? `<strong data-open-lead="${lead.id}">${esc(lead.firstName)} ${esc(lead.lastName)}</strong> · ` : ''}${describeActivity(a)}</span>
            <span class="timeline-time">${fmtDateTime(a.createdAt)}</span>
          </div>
          ${a.createdBy ? `<div class="act-time">by ${esc(a.createdBy)}${a.channel ? ` · ${esc(a.channel)}` : ''}</div>` : ''}
        </div>
      </div>`;
    }).join('');
    list.querySelectorAll('[data-open-lead]').forEach(el =>
      el.addEventListener('click', () => window.LeadFlow.openLead(el.dataset.openLead)));
  }

  root.querySelector('#actLead').addEventListener('change', e => { filters.lead = e.target.value; draw(); });
  root.querySelector('#actType').addEventListener('change', e => { filters.type = e.target.value; draw(); });
  root.querySelector('#actChannel').addEventListener('change', e => { filters.channel = e.target.value; draw(); });
  root.querySelector('#actDays').addEventListener('change', e => { filters.days = e.target.value; draw(); });
  draw();
}

/* ============================================================
   ANALYTICS
   ============================================================ */
function renderAnalytics(root) {
  let range = 30;

  root.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Know where your leads are coming from — and what converts.</div>
        <div class="page-subtitle">Live platform data — every number reflects your real leads and bookings.</div>
      </div>
      <div class="range-toggle" id="anRange">
        <button data-r="1">Today</button>
        <button data-r="7">7d</button>
        <button data-r="30" class="active">30d</button>
        <button data-r="90">90d</button>
      </div>
    </div>
    <div class="metrics-grid" id="anMetrics" style="grid-template-columns:repeat(5,1fr)"></div>
    <div class="dash-grid">
      <div class="card chart-card"><h3>Leads over time</h3><div id="chartLeads"></div></div>
      <div class="card chart-card"><h3>Bookings over time</h3><div id="chartBookings"></div></div>
    </div>
    <div class="dash-grid-3" style="margin-top:18px">
      <div class="card chart-card"><h3>Leads by status</h3><div class="donut-wrap" id="chartStatus"></div></div>
      <div class="card chart-card"><h3>Leads by source</h3><div class="source-bars" id="chartSources"></div></div>
      <div class="card chart-card"><h3>Leads by service</h3><div class="source-bars" id="chartServices"></div></div>
    </div>
    <div class="dash-grid-2" style="margin-top:18px">
      <div class="card chart-card">
        <h3>Speed & effort</h3>
        <div id="speedStats"></div>
        <div class="form-hint" style="margin-top:10px">Measured from live platform activity.</div>
      </div>
      <div class="card chart-card"><h3>Source performance</h3><div id="sourcePerf"></div></div>
    </div>`;

  function draw() {
    const st = getState();
    const leads = st.leads.filter(l => !l.archived && isWithinDays(l.createdAt, range) || (range === 90 && !l.archived));
    const scoped = st.leads.filter(l => !l.archived && (range === 90 ? true : isWithinDays(l.createdAt, range)));
    const total = scoped.length;
    const contacted = scoped.filter(l => l.lastContactAt).length;
    const responded = scoped.filter(l => ['Responded', 'Booked'].includes(l.status)).length;
    const booked = scoped.filter(l => l.status === 'Booked').length;

    root.querySelector('#anMetrics').innerHTML = [
      ['Total leads', total], ['New leads', scoped.filter(l => l.status === 'New').length],
      ['Response rate', fmtPct(contacted ? responded / contacted : 0)], ['Booking rate', fmtPct(total ? booked / total : 0)],
      ['Conversion rate', fmtPct(total ? booked / total : 0)]
    ].map(([label, v]) => `<div class="card metric-card"><div class="metric-label">${label}</div><div class="metric-value" style="font-size:1.4rem">${v}</div></div>`).join('');

    /* time series */
    const days = Math.min(range, 30);
    const labels = [], leadPts = [], bookPts = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i); d.setHours(12, 0, 0, 0);
      const next = new Date(d); next.setDate(next.getDate() + 1);
      const inDay = iso => { const t = new Date(iso); return t >= d && t < next; };
      labels.push(d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
      leadPts.push({ x: d, y: st.leads.filter(l => inDay(l.createdAt)).length });
      bookPts.push({ x: d, y: st.activities.filter(a => a.type === 'appointment_booked' && inDay(a.createdAt)).length });
    }
    root.querySelector('#chartLeads').innerHTML = lineChart([{ color: '#60a5fa', points: leadPts, fill: true }], { labels });
    root.querySelector('#chartBookings').innerHTML = lineChart([{ color: '#4ade80', points: bookPts, fill: true }], { labels });

    /* status donut */
    root.querySelector('#chartStatus').innerHTML = donutChart(
      STATUSES.map(stt => ({ label: stt, value: scoped.filter(l => l.status === stt).length, color: STATUS_COLORS[stt] }))
    ) + `<div class="legend">${STATUSES.map(stt => `<div class="legend-item"><span class="legend-swatch" style="background:${STATUS_COLORS[stt]}"></span>${stt}<strong>${scoped.filter(l => l.status === stt).length}</strong></div>`).join('')}</div>`;

    /* sources */
    const srcCounts = SOURCES.map(sr => ({ label: sr, value: scoped.filter(l => l.source === sr).length })).filter(d => d.value > 0).sort((a, b) => b.value - a.value);
    root.querySelector('#chartSources').innerHTML = srcCounts.length ? barList(srcCounts) : '<div style="color:var(--text-dim)">No leads in range.</div>';

    /* services */
    const svcMap = {};
    scoped.forEach(l => { const k = l.serviceInterest || 'Other'; svcMap[k] = (svcMap[k] || 0) + 1; });
    const svcData = Object.entries(svcMap).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value).slice(0, 7);
    root.querySelector('#chartServices').innerHTML = svcData.length ? barList(svcData) : '<div style="color:var(--text-dim)">No data.</div>';

    /* speed stats */
    const firstFollowUps = st.activities.filter(a => a.type === 'sms_sent' || a.type === 'email_sent');
    let avgFirstFU = null;
    const byLead = {};
    firstFollowUps.forEach(a => {
      if (!byLead[a.leadId]) byLead[a.leadId] = a.createdAt;
      else if (new Date(a.createdAt) < new Date(byLead[a.leadId])) byLead[a.leadId] = a.createdAt;
    });
    const gaps = Object.entries(byLead).map(([leadId, sentAt]) => {
      const lead = getLead(leadId);
      return lead ? (new Date(sentAt) - new Date(lead.createdAt)) / 3600000 : null;
    }).filter(g => g != null && g >= 0);
    if (gaps.length) avgFirstFU = gaps.reduce((s, g) => s + g, 0) / gaps.length;

    const bookedLeads = scoped.filter(l => l.status === 'Booked');
    const touchesBefore = bookedLeads.map(l => st.activities.filter(a => a.leadId === l.id && (a.type === 'sms_sent' || a.type === 'email_sent')).length);
    const avgTouches = touchesBefore.length ? (touchesBefore.reduce((s, t) => s + t, 0) / touchesBefore.length) : 0;

    root.querySelector('#speedStats').innerHTML = `
      <div class="stat-row"><span>Average time to first follow-up</span><span class="val">${avgFirstFU != null ? avgFirstFU.toFixed(1) + ' hours' : '—'}</span></div>
      <div class="stat-row"><span>Average touches before booking</span><span class="val">${avgTouches.toFixed(1)}</span></div>
      <div class="stat-row"><span>Leads contacted</span><span class="val">${contacted} of ${total}</span></div>
      <div class="stat-row"><span>Open follow-up tasks</span><span class="val">${st.tasks.filter(t => !t.completed).length}</span></div>`;

    /* source performance */
    const rows = SOURCES.map(sr => {
      const ls = scoped.filter(l => l.source === sr);
      const bk = ls.filter(l => l.status === 'Booked').length;
      return { source: sr, leads: ls.length, booked: bk, conv: ls.length ? bk / ls.length : 0 };
    }).filter(r => r.leads > 0).sort((a, b) => b.leads - a.leads);
    root.querySelector('#sourcePerf').innerHTML = `
      <table style="font-size:0.82rem">
        <thead><tr><th>Source</th><th>Leads</th><th>Booked</th><th>Conversion</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td>${esc(r.source)}</td><td>${r.leads}</td><td>${r.booked}</td><td><strong style="color:var(--gold-bright)">${fmtPct(r.conv)}</strong></td></tr>`).join('')}</tbody>
      </table>`;
  }

  root.querySelector('#anRange').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    root.querySelectorAll('#anRange button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); range = Number(b.dataset.r); draw();
  });
  draw();
}

function renderSettings(root) {
  let tab = 'Business';
  const TABS = ['Business', 'Team', 'Leads', 'Pipeline', 'Automation', 'Notifications', 'Branding', 'Data'];

  root.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Settings</div>
        <div class="page-subtitle">Configure LeadFlow for your business.</div>
      </div>
    </div>
    <div class="settings-tabs" id="setTabs">
      ${TABS.map(t => `<button class="settings-tab ${t === tab ? 'active' : ''}" data-tab="${t}">${t}</button>`).join('')}
    </div>
    <div class="settings-section" id="setBody"></div>`;

  const body = root.querySelector('#setBody');

  function draw() {
    const st = getState();
    if (tab === 'Business') {
      const b = st.settings.business;
      body.innerHTML = `<div class="card card-pad">
        ${field({ label: 'Business name', name: 'bizName', value: b.name, full: true })}
        <div class="form-row">
          ${field({ label: 'Website', name: 'bizSite', value: b.website })}
          ${field({ label: 'Phone', name: 'bizPhone', value: b.phone })}
        </div>
        <div class="form-row">
          ${field({ label: 'Email', name: 'bizEmail', value: b.email })}
          ${field({ label: 'Time zone', name: 'bizTZ', type: 'select', options: ['America/New_York', 'America/Chicago', 'America/Denver', 'America/Los_Angeles'], value: b.timeZone })}
        </div>
        <button class="btn btn-gold btn-sm" id="saveBiz">Save business info</button>
        <div class="form-hint" style="margin-top:10px">Name, phone and time zone save to the platform server. Website and email are display-only until the platform tracks them.</div>
      </div>`;
      body.querySelector('#saveBiz').addEventListener('click', async () => {
        const r = await saveSettings({ business: { ...b, name: body.querySelector('[name="bizName"]').value, website: body.querySelector('[name="bizSite"]').value, phone: body.querySelector('[name="bizPhone"]').value, email: body.querySelector('[name="bizEmail"]').value, timeZone: body.querySelector('[name="bizTZ"]').value } });
        if (!r || r.ok === false) return;
        toast('Business info saved to the platform server');
      });
    }
    if (tab === 'Team') {
      body.innerHTML = `<div class="card card-pad">
        <div class="table-wrap"><table>
          <thead><tr><th>Name</th><th>Role</th><th>Initials</th></tr></thead>
          <tbody>${st.settings.team.map(m => `<tr>
            <td>${esc(m.name)}</td>
            <td><select class="select-input" data-role="${esc(m.name)}" style="width:140px">${['Admin', 'Manager', 'Sales Rep', 'Viewer'].map(r => `<option ${m.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select></td>
            <td><span class="user-avatar">${esc(m.initials)}</span></td>
          </tr>`).join('')}</tbody>
        </table></div>
        <div class="form-hint" style="margin-top:12px">Roles: Admin manages everything · Manager manages leads + automations · Sales Rep owns their leads · Viewer has read-only access.</div>
      </div>`;
      body.querySelectorAll('[data-role]').forEach(sel => sel.addEventListener('change', () => {
        const member = st.settings.team.find(m => m.name === sel.dataset.role);
        if (member) member.role = sel.value;
        saveSettings({ team: st.settings.team }); toast('Role kept for this session — team accounts arrive with the team backend', 'info');
      }));
    }
    if (tab === 'Leads') {
      const ls = st.settings.leadSettings;
      body.innerHTML = `<div class="card card-pad">
        <div class="form-row">
          ${field({ label: 'Default owner', name: 'defOwner', type: 'select', options: st.settings.team.map(m => m.name), value: ls.defaultOwner })}
          ${field({ label: 'Default status', name: 'defStatus', type: 'select', options: st.settings.pipeline.stages, value: ls.defaultStatus })}
        </div>
        <div class="form-label" style="margin-bottom:8px">Lead sources</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
          ${SOURCES.map(sr => `<span class="chip">${esc(sr)}</span>`).join('')}
          <button class="btn btn-ghost btn-sm" id="addSource">+ Custom source</button>
        </div>
        ${toggle('quietHours', ls.quietHours.enabled, 'Quiet hours', 'Pause automated sends overnight')}
        ${ls.quietHours.enabled ? `<div class="form-row" style="margin-top:12px">
          ${field({ label: 'From', name: 'qhFrom', type: 'time', value: ls.quietHours.from })}
          ${field({ label: 'To', name: 'qhTo', type: 'time', value: ls.quietHours.to })}
        </div>` : ''}
        <button class="btn btn-gold btn-sm" id="saveLeadSet" style="margin-top:14px">Save lead settings</button>
      </div>`;
      body.querySelector('#addSource').addEventListener('click', () => toast('Custom sources can be typed when adding a lead', 'info'));
      body.querySelector('#saveLeadSet').addEventListener('click', () => {
        saveSettings({ leadSettings: { ...ls, defaultOwner: body.querySelector('[name="defOwner"]').value, defaultStatus: body.querySelector('[name="defStatus"]').value, quietHours: { ...ls.quietHours, enabled: body.querySelector('[name="quietHours"]').checked, from: body.querySelector('[name="qhFrom"]')?.value || ls.quietHours.from, to: body.querySelector('[name="qhTo"]')?.value || ls.quietHours.to } } });
        toast('Lead settings kept for this session — server-side preferences arrive with the team backend', 'info');
      });
    }
    if (tab === 'Pipeline') {
      body.innerHTML = `<div class="card card-pad">
        <div class="form-label" style="margin-bottom:10px">Pipeline stages (reorder)</div>
        <div id="stageList">${st.settings.pipeline.stages.map((s2, i) => `
          <div class="auto-step-row"><span class="auto-step-num">${i + 1}</span>
            <input class="form-input" data-stage="${i}" value="${esc(s2)}" style="flex:1"/>
            <div class="step-up-down">
              <button data-up="${i}" ${i === 0 ? 'disabled' : ''}>▲</button>
              <button data-down="${i}" ${i === st.settings.pipeline.stages.length - 1 ? 'disabled' : ''}>▼</button>
            </div>
          </div>`).join('')}</div>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn btn-ghost btn-sm" id="addStage">+ Add stage</button>
          <button class="btn btn-gold btn-sm" id="saveStages">Save stages</button>
        </div>
        <div class="form-hint" style="margin-top:10px">Stage names apply across the board, table, and kanban.</div>
      </div>`;
      const stages = [...st.settings.pipeline.stages];
      body.querySelectorAll('[data-stage]').forEach(inp => inp.addEventListener('change', () => { stages[Number(inp.dataset.stage)] = inp.value; }));
      body.querySelectorAll('[data-up]').forEach(b => b.addEventListener('click', () => {
        const i = Number(b.dataset.up);
        if (i > 0) { [stages[i - 1], stages[i]] = [stages[i], stages[i - 1]]; saveSettings({ pipeline: { stages: [...stages] } }); draw(); }
      }));
      body.querySelectorAll('[data-down]').forEach(b => b.addEventListener('click', () => {
        const i = Number(b.dataset.down);
        if (i < stages.length - 1) { [stages[i + 1], stages[i]] = [stages[i], stages[i + 1]]; saveSettings({ pipeline: { stages: [...stages] } }); draw(); }
      }));
      body.querySelector('#addStage').addEventListener('click', () => { stages.push('New Stage'); saveSettings({ pipeline: { stages } }); draw(); });
      body.querySelector('#saveStages').addEventListener('click', () => { saveSettings({ pipeline: { stages } }); toast('Stage names kept for this session', 'info'); });
    }
    if (tab === 'Automation') {
      const ls = st.settings.leadSettings;
      body.innerHTML = `<div class="card card-pad">
        ${toggle('autoEnabled', true, 'Follow-up automations', 'Master switch for all sequences')}
        ${toggle('quiet', ls.quietHours.enabled, 'Respect quiet hours', 'Hold SMS/email during quiet hours')}
        <div class="form-label" style="margin:14px 0 8px">Default delays for new sequences</div>
        <div class="form-row">
          ${field({ label: 'First message', name: 'd1', value: 'Immediately' })}
          ${field({ label: 'Second touch', name: 'd2', value: '4 hours' })}
        </div>
        <div class="form-row">
          ${field({ label: 'Third touch', name: 'd3', value: '1 day' })}
          ${field({ label: 'Final touch', name: 'd4', value: '3 days' })}
        </div>
        <div class="form-hint">Stop rules are configured per sequence: reply, booking, opt-out, or lost status.</div>
      </div>`;
    }
    if (tab === 'Notifications') {
      const n = st.settings.notifications;
      body.innerHTML = `<div class="card card-pad">
        ${toggle('nNewLead', n.newLead, 'New lead', 'When a lead is captured from any source')}
        ${toggle('nReply', n.reply, 'Lead replied')}
        ${toggle('nBooking', n.booking, 'Appointment booked')}
        ${toggle('nFollowup', n.followupDue, 'Follow-up due')}
        <button class="btn btn-gold btn-sm" id="saveNotif" style="margin-top:14px">Save notification settings</button>
      </div>`;
      body.querySelector('#saveNotif').addEventListener('click', () => {
        saveSettings({ notifications: { newLead: body.querySelector('[name="nNewLead"]').checked, reply: body.querySelector('[name="nReply"]').checked, booking: body.querySelector('[name="nBooking"]').checked, followupDue: body.querySelector('[name="nFollowup"]').checked } });
        toast('Notification preferences kept for this session', 'info');
      });
    }
    if (tab === 'Branding') {
      const br = st.settings.branding;
      body.innerHTML = `<div class="card card-pad">
        ${field({ label: 'Display name', name: 'brandName', value: br.displayName, full: true })}
        <div class="form-group">
          <label class="form-label">Accent color</label>
          <input type="color" name="brandAccent" value="${br.accent}" style="width:64px;height:38px;border:1px solid var(--border);border-radius:9px;background:var(--bg);padding:4px;cursor:pointer"/>
        </div>
        <button class="btn btn-gold btn-sm" id="saveBrand">Save branding</button>
      </div>`;
      body.querySelector('#saveBrand').addEventListener('click', () => {
        const accent = body.querySelector('[name="brandAccent"]').value;
        saveSettings({ branding: { ...br, displayName: body.querySelector('[name="brandName"]').value, accent } });
        document.documentElement.style.setProperty('--gold', accent);
        toast('Branding kept for this session', 'info');
      });
    }
    if (tab === 'Data') {
      body.innerHTML = `<div class="card card-pad">
        <div class="panel-title" style="margin-bottom:8px">Your data</div>
        <p style="color:var(--text-soft);font-size:0.86rem;margin-bottom:16px">Leads, notes, activity and appointments live on the VantorX platform server — not in your browser. Export pulls a snapshot of what is on the server right now.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" id="exportData">⬇ Export data (JSON)</button>
          <button class="btn btn-ghost btn-sm" id="lfSignOut" style="color:var(--red)">Sign out</button>
        </div>
      </div>`;
      body.querySelector('#exportData').addEventListener('click', () => {
        const blob = JSON.stringify(getState(), null, 2);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([blob], { type: 'application/json' }));
        a.download = 'leadflow-data.json'; a.click();
        toast('Data exported');
      });
      body.querySelector('#lfSignOut').addEventListener('click', async () => {
        const ok = await confirmDialog({ title: 'Sign out?', message: 'End your LeadFlow session.', confirmText: 'Sign out', danger: true });
        if (!ok) return;
        await platformLogout();
        location.reload();
      });
    }
  }

  root.querySelector('#setTabs').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    root.querySelectorAll('.settings-tab').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); tab = b.dataset.tab; draw();
  });
  draw();
}

function maybeShowOnboarding(rootEl) {
  const st = getState();
  if (st.onboarded) return;
  showOnboarding();
}

function showOnboarding() {
  const data = { industry: null, sources: [], providers: [], bizName: getState().settings.business.name };
  const steps = ['Welcome', 'Business', 'Industry', 'Sources', 'Providers', 'Automation', 'Leads', 'Finish'];
  let step = 0;

  const overlay = document.createElement('div');
  overlay.className = 'onboard-overlay';
  document.body.appendChild(overlay);

  function draw() {
    const progress = steps.map((s, i) => `<span class="${i <= step ? 'done' : ''}"></span>`).join('');
    let content = '';
    if (step === 0) content = `
      <div class="onboard-title">Welcome to VantorX LeadFlow</div>
      <div class="onboard-sub">Never let a lead go cold. Let's set you up in about a minute.</div>
      <div class="onboard-option selected"><span class="onboard-ico">✨</span><div><strong>Everything is wired for demo</strong><div style="font-size:0.76rem;color:var(--text-dim)">Sample data is loaded so you can explore immediately.</div></div></div>`;
    if (step === 1) content = `
      <div class="onboard-title">Business information</div>
      <div class="onboard-sub">Used across templates as {{business_name}}.</div>
      ${field({ label: 'Business name', name: 'obName', value: data.bizName, required: true, full: true })}
      ${field({ label: 'Owner name', name: 'obOwner', value: getState().settings.ownerName, full: true })}`;
    if (step === 2) content = `
      <div class="onboard-title">What industry are you in?</div>
      <div class="onboard-sub">We tune sample services and message tone.</div>
      ${['Barbershop', 'Tattoo Studio', 'Salon / Med Spa', 'Gym / Fitness', 'Auto Services', 'Home Services', 'Dental', 'Real Estate', 'Other'].map(ind =>
        `<button class="onboard-option ${data.industry === ind ? 'selected' : ''}" data-ind="${ind}"><span class="onboard-ico">${industryIcon(ind)}</span>${ind}</button>`).join('')}`;
    if (step === 3) content = `
      <div class="onboard-title">Where do your leads come from?</div>
      <div class="onboard-sub">Pick all that apply.</div>
      ${['Phone', 'Website', 'Instagram', 'Facebook', 'TikTok', 'Google', 'Walk-in', 'Referral'].map(src =>
        `<button class="onboard-option ${data.sources.includes(src) ? 'selected' : ''}" data-src="${src}"><span class="onboard-ico">${industryIcon(src)}</span>${src}</button>`).join('')}`;
    if (step === 4) content = `
      <div class="onboard-title">Communication providers</div>
      <div class="onboard-sub">These stay in demo mode until a backend is connected.</div>
      <div class="onboard-option selected"><span class="onboard-ico">💬</span><div><strong>SMS — demo adapter</strong><div style="font-size:0.76rem;color:var(--text-dim)">Simulated delivery, honest labeling.</div></div></div>
      <div class="onboard-option selected"><span class="onboard-ico">📧</span><div><strong>Email — demo adapter</strong><div style="font-size:0.76rem;color:var(--text-dim)">Simulated delivery, honest labeling.</div></div></div>`;
    if (step === 5) content = `
      <div class="onboard-title">Create your first automation</div>
      <div class="onboard-sub">The classic 5-touch follow-up, pre-built for you.</div>
      <div class="onboard-option selected"><span class="onboard-ico">⚡</span><div><strong>“New Lead Follow-Up” — 5 steps</strong><div style="font-size:0.76rem;color:var(--text-dim)">SMS immediately → Email 4h → SMS 1d → Email 2d → Final SMS 3d. Stops on reply or booking.</div></div></div>`;
    if (step === 6) content = `
      <div class="onboard-title">Add your leads</div>
      <div class="onboard-sub">Sample leads are already loaded — or import your own anytime.</div>
      <button class="onboard-option" data-ob="import"><span class="onboard-ico">📄</span>Import a CSV now</button>
      <button class="onboard-option selected" data-ob="sample"><span class="onboard-ico">✅</span>Start with sample leads</button>`;
    if (step === 7) content = `
      <div class="onboard-title">You're all set 🎉</div>
      <div class="onboard-sub">Your dashboard is live with ${getState().leads.filter(l => !l.archived).length} leads. Explore freely — nothing here is sent to anyone.</div>
      <div class="onboard-option selected"><span class="onboard-ico">🚀</span><div><strong>Open LeadFlow</strong><div style="font-size:0.76rem;color:var(--text-dim)">Dashboard → Leads → Pipeline → Automations → Analytics</div></div></div>`;

    overlay.innerHTML = `
      <div class="onboard-card">
        <div class="onboard-progress">${progress}</div>
        ${content}
        <div style="display:flex;justify-content:space-between;margin-top:24px">
          <button class="btn btn-ghost btn-sm" id="obBack" ${step === 0 ? 'disabled' : ''}>← Back</button>
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost btn-sm" id="obSkip">Skip</button>
            ${step < 7 ? '<button class="btn btn-gold btn-sm" id="obNext">Continue →</button>' : '<button class="btn btn-gold btn-sm" id="obDone">Finish setup</button>'}
          </div>
        </div>
      </div>`;

    /* wiring */
    overlay.querySelectorAll('[data-ind]').forEach(b => b.addEventListener('click', () => { data.industry = b.dataset.ind; draw(); }));
    overlay.querySelectorAll('[data-src]').forEach(b => b.addEventListener('click', () => {
      const src = b.dataset.src;
      data.sources = data.sources.includes(src) ? data.sources.filter(x => x !== src) : [...data.sources, src];
      draw();
    }));
    overlay.querySelector('[data-ob="import"]')?.addEventListener('click', () => { finish(); window.LeadFlow.navigate('leads'); setTimeout(() => window.LeadFlow.openImport(), 300); });
    overlay.querySelector('#obBack').addEventListener('click', () => { if (step > 0) { step--; draw(); } });
    overlay.querySelector('#obSkip').addEventListener('click', finish);
    overlay.querySelector('#obNext')?.addEventListener('click', () => {
      if (step === 1) {
        const name = overlay.querySelector('[name="obName"]')?.value.trim();
        const owner = overlay.querySelector('[name="obOwner"]')?.value.trim();
        if (name) saveSettings({ business: { ...getState().settings.business, name } });
        if (owner) saveSettings({ ownerName: owner });
      }
      step++; draw();
    });
    overlay.querySelector('#obDone')?.addEventListener('click', finish);
  }

  function finish() {
    setOnboarded();
    overlay.remove();
    toast('Setup complete — welcome to LeadFlow');
    window.LeadFlow.render();
  }

  draw();
}

function industryIcon(ind) {
  const map = {
    Barbershop: '💈', 'Tattoo Studio': '🖋️', 'Salon / Med Spa': '💅', 'Gym / Fitness': '🏋️',
    'Auto Services': '🚗', 'Home Services': '🏠', Dental: '🦷', 'Real Estate': '🏡', Other: '🏢',
    Phone: '📞', Website: '🌐', Instagram: '📸', Facebook: '📘', TikTok: '🎵', Google: '🔍',
    'Walk-in': '🚶', Referral: '🤝'
  };
  return map[ind] || '•';
}

/* ---------- router ---------- */
let currentPage = 'dashboard';
const TITLES = {
  dashboard: 'Dashboard', leads: 'Leads', pipeline: 'Pipeline', queue: 'Follow-Up Queue',
  automations: 'Automations', templates: 'Templates', appointments: 'Appointments',
  activity: 'Activity', analytics: 'Analytics', integrations: 'Integrations', settings: 'Settings'
};

function navigate(page, opts = {}) {
  if (!TITLES[page]) page = 'dashboard';
  currentPage = page;
  clearSelection();
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  const view = document.getElementById('viewRoot');
  const pageEl = document.getElementById('pageRoot');
  pageEl.scrollTop = 0;
  closeMobileNav();

  switch (page) {
    case 'dashboard': renderDashboard(view); break;
    case 'leads': renderLeads(view); break;
    case 'pipeline': renderPipeline(view); break;
    case 'queue': renderQueue(view); break;
    case 'automations': renderAutomations(view); break;
    case 'templates': renderTemplates(view); break;
    case 'appointments': renderAppointments(view); break;
    case 'activity': renderActivity(view); break;
    case 'analytics': renderAnalytics(view); break;
    case 'integrations': renderIntegrations(view); break;
    case 'settings': renderSettings(view); break;
  }
  /* re-scroll + focus main region for a11y */
  pageEl.setAttribute('tabindex', '-1');
}

function renderCurrent() {
  navigate(currentPage);
}

/* ---------- global API for cross-page actions ---------- */
window.LeadFlow = {
  navigate,
  openLead(leadId) {
    currentPage = 'lead-profile';
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    const view = document.getElementById('viewRoot');
    document.getElementById('pageRoot').scrollTop = 0;
    renderProfile(view, leadId);
  },
  openAIAssistant(leadId) {
    window.LeadFlow.openLead(leadId);
    setTimeout(() => document.querySelector('[data-ai="generate"]')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 350);
  },
  openImport() {
    currentPage = 'leads';
    renderLeads(document.getElementById('viewRoot'));
    setTimeout(() => openImport(), 250);
  },
  openQuickAdd() {
    openLeadForm(null, () => renderCurrent());
  },
  render: renderCurrent
};

/* ---------- shell wiring ---------- */
function wireShell() {
  /* nav */
  document.querySelectorAll('.nav-item').forEach(btn =>
    btn.addEventListener('click', () => navigate(btn.dataset.page)));

  /* delegated nav buttons rendered inside pages (data-nav) */
  document.getElementById('viewRoot').addEventListener('click', (e) => {
    const nav = e.target.closest('[data-nav]');
    if (nav) { navigate(nav.dataset.nav); return; }
    const quick = e.target.closest('[data-action="quick-add"]');
    if (quick) { window.LeadFlow.openQuickAdd(); }
  });

  /* badges */
  refreshBadges();

  /* quick add */
  document.getElementById('quickAddBtn').addEventListener('click', () => window.LeadFlow.openQuickAdd());

  /* global search — jumps to leads with query applied */
  const gs = document.getElementById('globalSearch');
  gs.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && gs.value.trim()) {
      navigate('leads');
      setTimeout(() => {
        const inp = document.getElementById('leadSearch');
        if (inp) {
          inp.value = gs.value.trim();
          inp.dispatchEvent(new Event('input', { bubbles: true }));
        }
      }, 60);
    }
  });
  gs.addEventListener('input', () => {
    if (!gs.value && currentPage === 'leads') {
      const inp = document.getElementById('leadSearch');
      if (inp) { inp.value = ''; inp.dispatchEvent(new Event('input', { bubbles: true })); }
    }
  });

  /* notifications dropdown */
  document.getElementById('notifBtn').addEventListener('click', openNotificationCenter);

  /* business switcher */
  document.getElementById('bizSwitcher').addEventListener('click', () => {
    toast('Multi-business workspaces arrive with the team backend.', 'info');
  });

  /* help dialog */
  document.getElementById('helpBtn').addEventListener('click', openHelp);

  /* mobile drawer */
  document.getElementById('mobileMenuBtn').addEventListener('click', openMobileNav);
  document.getElementById('mobileOverlay').addEventListener('click', closeMobileNav);

  /* keyboard shortcuts */
  document.addEventListener('keydown', (e) => {
    const inField = /input|textarea|select/i.test(e.target.tagName);
    if (e.key === '/' && !inField) { e.preventDefault(); gs.focus(); }
    if (inField) return;
    if (e.key === 'n' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); window.LeadFlow.openQuickAdd(); }
  });

  /* store subscription: refresh badges + live-render current page */
  subscribe((state) => {
    refreshBadges();
    /* live update current view (except forms which manage their own re-renders) */
  });
}

function refreshBadges() {
  const s = getState();
  const leads = s.leads.filter(l => !l.archived).length;
  const overdue = s.tasks.filter(t => !t.completed && new Date(t.dueAt) < new Date()).length;
  const queue = s.tasks.filter(t => !t.completed).length;
  const bl = document.getElementById('badgeLeads');
  const bq = document.getElementById('badgeQueue');
  if (bl) bl.textContent = leads;
  if (bq) { bq.textContent = queue + (overdue ? '!' : ''); bq.classList.toggle('urgent', overdue > 0); }
  const dot = document.getElementById('notifDot');
  const unread = s.notifications.filter(n => !n.read).length;
  if (dot) dot.style.display = unread ? 'block' : 'none';
}

/* ---------- notification center ---------- */
function openNotificationCenter() {
  const draw = (close) => {
    const s = getState();
    const items = s.notifications;
    const closeRef = close;
    const body = items.length ? items.map(n => `
      <div class="toggle-row" style="gap:12px;cursor:pointer" data-ntf="${n.id}">
        <div style="display:flex;gap:11px;align-items:flex-start">
          <span style="font-size:1.05rem">${{ new_lead: '✨', reply: '⚡', followup: '⏰', booking: '📅', automation: '⚙️', status: '🔀', info: '✦' }[n.type] || '🔔'}</span>
          <div>
            <div class="toggle-label" style="${n.read ? 'color:var(--text-soft);font-weight:500' : ''}">${esc(n.title)}</div>
            <div class="toggle-sub">${esc(n.body)}</div>
            <div class="toggle-sub" style="margin-top:2px">${relTime(n.createdAt)}</div>
          </div>
        </div>
        ${!n.read ? '<span class="dot" style="position:static;width:8px;height:8px;border-radius:50%;background:var(--gold-bright);flex-shrink:0"></span>' : ''}
      </div>`).join('')
      : '<div style="color:var(--text-dim);text-align:center;padding:30px 0">You\'re all caught up.</div>';

    const modal = openModal({
      title: 'Notifications',
      body: body,
      footer: `<button class="btn btn-ghost btn-sm" data-markall>Mark all read</button><button class="btn btn-ghost btn-sm" data-clear>Clear all</button><button class="btn btn-gold btn-sm" data-close2>Close</button>`,
      onOpen(m) {
        m.querySelector('[data-close2]').addEventListener('click', closeRef);
        m.querySelector('[data-markall]').addEventListener('click', () => { markAllNotificationsRead(); closeRef(); openNotificationCenter(); });
        m.querySelector('[data-clear]').addEventListener('click', () => { clearNotifications(); closeRef(); });
        m.querySelectorAll('[data-ntf]').forEach(row => row.addEventListener('click', () => {
          markNotificationRead(row.dataset.ntf);
          closeRef();
        }));
      }
    });
  };
  draw(() => {});
}

/* ---------- help dialog ---------- */
function openHelp() {
  openModal({
    title: 'Help & Shortcuts',
    body: `
      <div class="panel-title" style="margin-bottom:8px">Keyboard shortcuts</div>
      <div class="stat-row"><span><kbd>/</kbd> focus search</span></div>
      <div class="stat-row"><span><kbd>N</kbd> quick add lead</span></div>
      <div class="stat-row"><span><kbd>Esc</kbd> close dialogs</span></div>
      <div class="panel-title" style="margin:16px 0 8px">About this build</div>
      <p style="color:var(--text-soft);font-size:0.86rem">LeadFlow runs on the <strong>live VantorX platform</strong>: leads, activity, appointments and notifications are stored server-side and every change saves immediately. SMS/email automations and AI drafting are shown honestly as not connected until their providers go live.</p>
      <div class="panel-title" style="margin:16px 0 8px">Quick tour</div>
      <p style="color:var(--text-soft);font-size:0.86rem">1. Dashboard → 2. open a lead → 3. change status or book an appointment → 4. Pipeline drag & drop → 5. Appointments → 6. Analytics → 7. Integrations.</p>`,
    footer: `<button class="btn btn-gold btn-sm" data-close2>Got it</button>`,
    onOpen(m) { m.querySelector('[data-close2]').addEventListener('click', m.querySelector('.modal-close').onclick); }
  });
}

/* ---------- mobile nav ---------- */
function openMobileNav() {
  document.getElementById('sidebar').classList.add('mobile-open');
  document.getElementById('mobileOverlay').style.display = 'block';
}
function closeMobileNav() {
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('mobileOverlay').style.display = 'none';
}

/* ---------- session gate ---------- */
function showGate(mode, errText) {
  const existing = document.getElementById('lfGate');
  if (existing) existing.remove();
  const gate = document.createElement('div');
  gate.id = 'lfGate';
  gate.style.cssText = 'position:fixed;inset:0;background:rgba(8,8,10,0.92);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px';
  if (mode === 'admin') {
    gate.innerHTML = `<div class="card card-pad" style="width:min(480px,100%);text-align:center">
      <div style="font-size:2rem">🛡️</div>
      <div class="panel-title" style="margin:10px 0 6px">Platform admin account</div>
      <p style="color:var(--text-soft);font-size:0.86rem;margin-bottom:16px">LeadFlow is for business owner and staff accounts. Use the VantorX Admin console to manage tenants.</p>
      <div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
        <a class="btn btn-gold btn-sm" href="/vantorx-admin/admin-app.html" style="text-decoration:none">Open Admin console →</a>
        <button class="btn btn-ghost btn-sm" id="lfGateOut" style="color:var(--red)">Sign out</button>
      </div>
    </div>`;
  } else if (mode === 'onboard') {
    gate.innerHTML = `<div class="card card-pad" style="width:min(480px,100%);text-align:center">
      <div style="font-size:2rem">🚀</div>
      <div class="panel-title" style="margin:10px 0 6px">Your business is being set up</div>
      <p style="color:var(--text-soft);font-size:0.86rem;margin-bottom:16px">Your VantorX team is building and configuring LeadFlow for you. You will get access here as soon as it is ready.</p>
      <div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" id="lfGateOut" style="color:var(--red)">Sign out</button>
      </div>
    </div>`;
  } else if (mode === 'error') {
    gate.innerHTML = `<div class="card card-pad" style="width:min(480px,100%);text-align:center">
      <div style="font-size:2rem">📡</div>
      <div class="panel-title" style="margin:10px 0 6px">Platform server not reachable</div>
      <p style="color:var(--text-soft);font-size:0.86rem;margin-bottom:16px">${esc(errText || 'The server did not respond.')} LeadFlow only shows real platform data — it stays empty until the server responds.</p>
      <div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-gold btn-sm" id="lfGateRetry">Retry</button>
        <a class="btn btn-ghost btn-sm" href="/" style="text-decoration:none">← Portal home</a>
      </div>
    </div>`;
  } else {
    gate.innerHTML = `<div class="card card-pad" style="width:min(430px,100%)">
      <div class="panel-title" style="margin-bottom:6px">🔐 Sign in to LeadFlow</div>
      <p style="color:var(--text-soft);font-size:0.84rem;margin-bottom:14px">Your CRM data lives on the VantorX platform — sign in to see your live leads.</p>
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="lfEmail" type="email" autocomplete="username"/></div>
      <div class="form-group"><label class="form-label">Password</label><input class="form-input" id="lfPass" type="password" autocomplete="current-password"/></div>
      <div id="lfErr"></div>
      <div style="display:flex;gap:9px;margin-top:14px">
        <button class="btn btn-gold" id="lfGo">Sign in</button>
        <a class="btn btn-ghost" href="/" style="text-decoration:none;display:inline-flex;align-items:center">← Portal home</a>
      </div>
    </div>`;
  }
  document.body.appendChild(gate);

  gate.querySelector('#lfGateOut')?.addEventListener('click', async () => { await platformLogout(); gate.remove(); showGate('signin'); });
  gate.querySelector('#lfGateRetry')?.addEventListener('click', () => start());
  const go = gate.querySelector('#lfGo');
  if (go) {
    const submit = async () => {
      const email = gate.querySelector('#lfEmail').value.trim();
      const pass = gate.querySelector('#lfPass').value;
      gate.querySelector('#lfErr').innerHTML = '';
      const r = await platformLogin(email, pass);
      if (!r.ok) { gate.querySelector('#lfErr').innerHTML = `<div class="form-error">✕ ${esc(r.error)}</div>`; return; }
      gate.remove();
      if (r.mode !== 'ready') { showGate(r.mode); return; }
      navigate('dashboard');
    };
    go.addEventListener('click', submit);
    gate.querySelector('#lfPass').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  }
}

/* ---------- identity (sidebar business + user) ---------- */
function paintIdentity() {
  const s = getState();
  if (s.settings) document.getElementById('bizName').textContent = s.settings.business.name || 'VantorX';
  const u = getState().settings && document.getElementById('lfUserName');
  if (u) {
    const name = s.settings.ownerName || '';
    u.textContent = name;
    document.getElementById('lfUserInitials').textContent = name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase() || '?';
    const role = s.settings.team[0] && s.settings.team[0].role;
    document.getElementById('lfUserRole').textContent = role || 'Owner';
  }
}

/* ---------- boot ---------- */
async function start() {
  wireShell();
  const mode = await boot();
  if (mode !== 'ready') { showGate(mode); return; }
  paintIdentity();
  navigate('dashboard');
}
start();


</script>
